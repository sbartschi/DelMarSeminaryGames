      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }
        }

      if (full.length < 2) { bannerMsg('You need players on at least 2 teams to start.'); return; }
      var size = t.meta.size || 'medium';
      Promise.all(teams.filter(function (x) { return !(by[x.id] || []).length; }).map(function (x) { return db.del(S.code + '/teams/' + x.id); }))
        .then(function () { return db.patch(S.code + '/meta', { state: 'playing', startedAt: now(), endAfter: Math.min(2, full.length), N: SIZES[size], seed: Math.floor(Math.random() * 1e9) }); }).then(refresh);
    } else if (act === 'force') {
      var tid = b.getAttribute('data-team'), put = {}; ITEMS.forEach(function (it, i) { if (!((t.teams[tid].items || {})[i])) put[i] = { p: 'host', n: 'Teacher', t: now() }; });
      db.patch(S.code + '/teams/' + tid + '/items', put).then(refresh);
    } else if (act === 'togglemap') {
      S.showMap = !S.showMap; b.textContent = S.showMap ? 'Hide maze map' : 'Show maze map';
      var card = body.querySelector('#mapCard'); if (card) card.innerHTML = ''; refresh();
    } else if (act === 'endnow') { db.patch(S.code + '/meta', { over: true }).then(refresh);
    } else if (act === 'newgame') { S.showMap = false; newGame(); }
  });
  init();
  return { getCode: function () { return S.code; } };
}

function boot(kind) {
  var el = document.getElementById('app');
  if (!CFG.databaseURL || /YOUR-/.test(CFG.databaseURL)) {
    el.innerHTML = '<div class="ph"><div class="card pad"><h2>One setup step left</h2><p>Open <b>config.js</b> in this folder and paste your Firebase Realtime Database address (the same one your other seminary games use).</p></div></div>'; return;
  }
  var db = restDb(CFG.databaseURL, CFG.root || 'seminaryGames/escape-maze');
  if (kind === 'teacher') mountHost(el, db); else mountPhone(el, db);
}
window.EscapeMaze = { boot: boot, mountHost: mountHost, mountPhone: mountPhone, memDb: memDb, restDb: restDb, buildMaze: buildMaze, botTick: botTick, ITEMS: ITEMS, standings: standings, isOver: isOver, K: K };
})();
</script>
<script>EscapeMaze.boot('teacher');</script>
</body></html>
