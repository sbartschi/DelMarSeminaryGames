<style>:root{--bg-page:#0E1B2B;--bg-panel:#16273B;--bg-panel-raised:#1E3450;--ink:#F1F6FB;--muted:#9FB4C9;--line:rgba(241,246,251,0.14);--accent:#58B38A;--ok:#3FA66B;--bad:#C65B5B;color-scheme:dark;}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;background:var(--bg-page);color:var(--ink);font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 50px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
h1{font-family:'Fraunces',Georgia,serif;font-size:1.9rem;margin:0 0 8px;}
h2{font-family:'Fraunces',Georgia,serif;font-size:1.3rem;margin:0 0 10px;}
.card{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
.muted{color:var(--muted);font-size:0.95rem;}
.btn{font:inherit;font-weight:700;padding:14px 20px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);cursor:pointer;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121D;}
.btn.big{font-size:1.1rem;width:100%;padding:18px;margin-top:6px;}
.btn[disabled]{opacity:0.4;cursor:default;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
input[type=text]{font:inherit;font-size:1.1rem;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);width:100%;margin-bottom:10px;}
.qr-box{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:14px;margin:10px auto;width:max-content;max-width:100%;}
.code{font-family:'IBM Plex Mono',monospace;font-size:2.4rem;letter-spacing:0.18em;text-align:center;color:var(--accent);margin:6px 0;}
.tag{display:inline-block;background:var(--bg-panel-raised);border-radius:20px;padding:6px 14px;margin:4px;font-size:0.95rem;}
.lb{width:100%;border-collapse:collapse;margin-top:6px;}
.lb td,.lb th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:1rem;}
.lb th{color:var(--muted);font-weight:600;font-size:0.78rem;text-transform:uppercase;}
.q{font-family:'Fraunces',Georgia,serif;font-size:1.6rem;line-height:1.35;margin:8px 0 16px;}
.verse{font-family:'Fraunces',Georgia,serif;font-size:1.45rem;line-height:1.45;font-style:italic;margin:8px 0 16px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt{padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--bg-panel-raised);font-size:1.1rem;}
.opt.right{border-color:var(--ok);background:rgba(63,166,107,0.25);}
.opt .n{font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-right:8px;}
.ans{display:block;width:100%;text-align:left;font:inherit;font-size:1.1rem;padding:18px 16px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);cursor:pointer;}
.ans.t{background:rgba(63,166,107,0.2);border-color:var(--ok);text-align:center;font-size:1.4rem;font-weight:700;}
.ans.f{background:rgba(198,91,91,0.2);border-color:var(--bad);text-align:center;font-size:1.4rem;font-weight:700;}
.timerbar{height:8px;border-radius:4px;background:var(--bg-panel-raised);overflow:hidden;margin:6px 0 12px;}
.timerbar i{display:block;height:100%;background:var(--accent);transition:width .25s linear;}
.result-big{font-family:'Fraunces',Georgia,serif;font-size:2.2rem;font-weight:700;margin:6px 0;}
.good{color:var(--ok);} .bad{color:var(--bad);}
.reveal{background:var(--bg-panel-raised);border-radius:12px;padding:14px 16px;margin-top:6px;}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:20px 0;}
.podium .spot{background:var(--bg-panel-raised);border-radius:10px 10px 0 0;padding:14px 16px;text-align:center;min-width:100px;}
.podium .g1{min-height:130px;background:linear-gradient(180deg,#F0CB77,#C9A227);color:#2b2418;}
.podium .g2{min-height:96px;} .podium .g3{min-height:72px;}
.ph{max-width:480px;margin:0 auto;}
.center{text-align:center;}
@media (max-width:600px){ .opts{grid-template-columns:1fr;} .q{font-size:1.3rem;} .verse{font-size:1.2rem;} }
.emoji{font-size:4rem;line-height:1.3;text-align:center;margin:10px 0 18px;letter-spacing:0.1em;}
.order{margin:0 0 6px;padding-left:28px;font-size:1.15rem;line-height:1.7;}
.order li::marker{color:var(--accent);font-weight:700;}
.ans.picked{border-color:var(--accent);background:rgba(255,255,255,0.08);opacity:0.75;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);margin-right:10px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.ans.picked .badge{background:var(--accent);color:#06121D;border-color:var(--accent);}
.scene{font-size:1.15rem;line-height:1.5;margin:4px 0 10px;}
.meters{display:grid;gap:10px;}
.meter{font-size:0.95rem;}
.mtrack{height:10px;border-radius:5px;background:var(--bg-panel-raised);overflow:hidden;margin-top:4px;}
.mtrack i{display:block;height:100%;background:var(--accent);transition:width .4s ease;}
.tally{display:grid;gap:8px;margin-top:8px;}
.trow{padding:10px 12px;border-radius:10px;border:1px solid var(--line);}
.trow.dec{border-color:var(--accent);background:rgba(255,255,255,0.05);}
.trow .n,.opt .n{font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-right:8px;}
.did{border-color:var(--accent);}
ul.plain{margin:0;padding-left:20px;line-height:1.6;}
.pts{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;color:var(--muted);margin-left:6px;white-space:nowrap;}
.pts.top{color:var(--accent);font-weight:700;}

  var o = {method: method, cache: 'no-store'}; if (v !== undefined) o.body = JSON.stringify(v);
  return fetch(DBURL + '/' + p + '.json', o).then(function(r){ return r.json(); }).catch(function(){ return null; });
}
function jget(c,p){ return req('GET',c,p); }
function jput(c,p,v){ return req('PUT',c,p,v); }
function jpatch(c,p,v){ return req('PATCH',c,p,v); }
function jpost(c,p,v){ return req('POST',c,p,v); }
var TS = {".sv":"timestamp"};
function ranked(players){ var a=[]; for (var k in (players||{})) a.push({id:k, name:players[k].name, score:players[k].score||0}); a.sort(function(x,y){ return y.score-x.score || String(x.name).localeCompare(String(y.name)); }); return a; }
var MEM={};
function store(k, v){ if (FAKE){ if (v===undefined) return MEM[k]||null; MEM[k]=v; return; } try{ if (v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); }catch(e){ return null; } }
function optsOf(q){ return CFG.kind==='tf' ? ['True','False'] : q.options; }
function correctIdx(q){ return CFG.kind==='tf' ? (q.answer?0:1) : q.answer; }
function QA(m){ var ids=m&&m.qids; return CFG.questions[ids?ids[m.q]:m.q]; }
function QN(m){ return (m&&m.qids)?m.qids.length:CFG.questions.length; }

function ctxHtml(q){ if(!q||(!q.story&&!q.ctx)) return ''; return '<div class="ctx"><div class="ctx-h">The story</div>'+(q.story?'<b>'+esc(q.story)+'</b>':'')+(q.ctx?'<p>'+esc(q.ctx)+'</p>':'')+'</div>'; }

</script>
<script>(function(){
var seq=[], seqQ=-1;
var app=document.getElementById('app'), Q=CFG.questions, code='', pid='', room=null, busy=false, lastKey='', sending=false;
function param(n){ try{ return new URLSearchParams(location.search).get(n); }catch(e){ return null; } }
code=(param('g')||'').toUpperCase();
if (!code && FAKE && FAKE.latestCode) code=FAKE.latestCode(CFG.root);
function me(){ return (room&&room.players||{})[pid]; }
function rankOf(){ var r=ranked(room.players); for (var i=0;i<r.length;i++) if (r[i].id===pid) return i+1; return 0; }
function joinScreen(msg){
  app.innerHTML='<div class="ph"><div class="eyebrow">'+esc(CFG.title)+'</div><h1>Join the game</h1><div class="card">'+
    (code?'':'<input type="text" id="cd" maxlength="4" placeholder="Game code" autocapitalize="characters">')+
    '<input type="text" id="nm" maxlength="20" placeholder="Your first name" autocomplete="off">'+
    '<button class="btn primary big" data-a="join">Join</button>'+(msg?'<p class="bad">'+esc(msg)+'</p>':'')+'</div></div>';
}
function render(){
  var m=room.meta, p=me(), h='';
  if (!p){ store('pid_'+code,''); pid=''; joinScreen('You were removed from this game. Join again.'); return; }
  var head='<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="muted">'+esc(p.name)+'</span><span class="muted">'+(p.score||0).toLocaleString()+' points</span></div>';
  if (m.phase==='lobby') h='<div class="card center"><h2>You are in</h2><p class="muted">Watch the screen. The game starts soon</p></div>';
  else if (m.phase==='question'){
    var q=QA(m), mine=((room.ans||{})[m.q]||{})[pid];
    if (mine) h='<div class="card center"><div class="eyebrow">Question '+(m.q+1)+' of '+QN(m)+'</div><h2>Answer locked in</h2>'+(CFG.kind==='order'?'':'<p class="muted">You picked: '+esc(optsOf(q)[mine.i])+'</p>')+'<p class="muted">Waiting for the reveal</p></div>';
    else if (CFG.kind==='order'){
      if (seqQ!==m.q){ seq=[]; seqQ=m.q; }
      h='<div class="card"><div class="eyebrow">Question '+(m.q+1)+' of '+QN(m)+'</div><div class="q" style="font-size:1.15rem">'+esc(q.text)+'</div><div class="muted">Tap the events from first to last</div></div>';
      h+=q.shown.map(function(k,i){ var pos=seq.indexOf(i); return '<button class="ans'+(pos>=0?' picked':'')+'" data-a="seq" data-i="'+i+'"'+(pos>=0?' disabled':'')+'><span class="badge">'+(pos>=0?pos+1:'')+'</span>'+esc(q.items[k])+'</button>'; }).join('');
      h+='<div class="row"><button class="btn" data-a="undo"'+(seq.length?'':' disabled')+' style="flex:1">Undo</button><button class="btn primary" data-a="lock"'+(seq.length===q.items.length?'':' disabled')+' style="flex:2">Lock in my order</button></div>';
    }
    else {
      h='<div class="card"><div class="eyebrow">Question '+(m.q+1)+' of '+QN(m)+'</div>'+(q.verse?'<div class="muted">'+esc(q.prompt||CFG.prompt||'')+'</div><div class="verse" style="font-size:1.1rem">&ldquo;'+esc(q.verse)+'&rdquo;</div>':q.emoji?'<div class="muted">'+esc(q.prompt||CFG.prompt||'')+'</div><div class="emoji" style="font-size:2.6rem">'+esc(q.emoji)+'</div>':'<div class="q" style="font-size:1.2rem">'+esc(q.text)+'</div>')+'</div>';
      if (CFG.kind==='tf') h+='<button class="ans t" data-a="pick" data-i="0">True</button><button class="ans f" data-a="pick" data-i="1">False</button>';
      else h+=q.options.map(function(o,i){ return '<button class="ans" data-a="pick" data-i="'+i+'"><b>'+'ABCD'[i]+'</b> &nbsp;'+esc(o)+'</button>'; }).join('');
    }
  } else if (m.phase==='reveal'){
    var q=QA(m), ok=p.last===1;
    h='<div class="card center"><div class="result-big '+(ok?'good':'bad')+'">'+(ok?'Correct':'Not quite')+'</div>'+(CFG.kind==='order'?'<p>'+(p.hits||0)+' of '+q.items.length+' in the right spot</p><p>+'+(p.gain||0)+' points</p><p class="muted">The correct order is on the screen</p>':ok?'<p>+'+(p.gain||0)+' points</p>':'<p class="muted">Answer: '+esc(optsOf(q)[correctIdx(q)])+'</p>')+
      '<p class="muted">'+esc(q.ref)+'</p>'+ctxHtml(q)+'<p class="muted">You are in place '+rankOf()+' of '+Object.keys(room.players).length+'</p></div>';
  } else if (m.phase==='final'){
    h='<div class="card center"><h2>Game over</h2><div class="result-big">'+(p.score||0).toLocaleString()+'</div><p class="muted">points, place '+rankOf()+' of '+Object.keys(room.players).length+'</p><p class="muted">Look at the screen for the podium</p></div>';
  }
  app.innerHTML='<div class="ph">'+head+h+'</div>';
}
function poll(){
  if (busy || !code || !pid) return; busy=true;
  jget(code,'').then(function(d){ busy=false; if (!d || !d.meta) return; room=d;
    var m=d.meta, p=me(), mine=p&&((d.ans||{})[m.q]||{})[pid];
    var k=[m.phase,m.q,!!p,!!mine,p&&p.score,p&&p.last,rankOf()].join('~'); if (k!==lastKey){ lastKey=k; render(); }
  });
}
app.addEventListener('click', function(e){
  var b=e.target.closest('[data-a]'); if (!b) return; var a=b.getAttribute('data-a');
  if (a==='join'){
    var nm=(document.getElementById('nm').value||'').trim(), cd=document.getElementById('cd');
    if (cd) code=(cd.value||'').trim().toUpperCase();
    if (!nm || !code) return; b.disabled=true;
    jget(code,'meta').then(function(m){
      if (!m){ joinScreen('That game code was not found'); return; }
      return jpost(code,'players',{name:nm, score:0}).then(function(r){ pid=r&&r.name; store('pid_'+code,pid); lastKey=''; poll(); });
    });
  } else if (a==='seq'){ var i=parseInt(b.getAttribute('data-i'),10); if (seq.indexOf(i)<0) seq.push(i); render();
  } else if (a==='undo'){ seq.pop(); render();
  } else if (a==='lock' && !sending){
    sending=true; var q=room.meta.q; b.disabled=true;
    jput(code,'ans/'+q+'/'+pid,{seq:seq.slice(), t:TS}).then(function(){ sending=false; lastKey=''; poll(); });
  } else if (a==='pick' && !sending){
    sending=true; var i=parseInt(b.getAttribute('data-i'),10), q=room.meta.q;
    Array.prototype.forEach.call(app.querySelectorAll('[data-a=pick]'),function(x){ x.disabled=true; });
    b.style.outline='3px solid var(--accent)';
    jput(code,'ans/'+q+'/'+pid,{i:i, t:TS}).then(function(){ sending=false; lastKey=''; poll(); });
  }
});
if (code){ pid=store('pid_'+code)||''; }
if (pid) poll(); else joinScreen();
setInterval(poll, 1200);
})();
</script><script>
/* Site helper: an "All games" button for the teacher's screen, and confetti whenever a final standings screen appears. */
(function () {
  var inFrame = false; try { inFrame = window.parent !== window; } catch (e) { inFrame = true; }
  function isPlayer() { return /(^|\/)(play|wordle-play|clues-play)\.html$/.test(location.pathname) || /[?&](play|join)=/.test(location.search) || location.hash === '#play'; }
  var css = document.createElement('style');
  css.textContent = '#sgHome{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:9998;display:inline-flex;align-items:center;gap:6px;' +
    'font:800 13px/1 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#EEF3FB;background:rgba(13,21,40,.88);border:1px solid rgba(160,185,230,.3);' +
    'border-radius:999px;padding:8px 13px;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}' +
    '#sgHome:hover{border-color:#1FB5A8}#sgHome:focus-visible{outline:3px solid #fff;outline-offset:2px}' +
    'body.sg-home{padding-top:48px!important;box-sizing:border-box}@media (max-width:700px){#sgHome{font-size:12px;padding:7px 11px}}';
  document.head.appendChild(css);
  if (!inFrame) {

    a.setAttribute('aria-label', 'Back to all seminary games');
    document.body.appendChild(a);
    /* shown on every teacher or shared screen; hidden only on student-only pages viewed on a phone */
    var hide = function () { return isPlayer() && innerWidth <= 700; };
    var sync = function () { var h = hide(); a.hidden = h; a.style.display = h ? 'none' : ''; document.body.classList.toggle('sg-home', !h); };
    sync(); window.addEventListener('hashchange', sync); window.addEventListener('resize', sync);
    /* full-screen layouts: make room for the button strip so the page does not scroll */
    var fit = function () {
      if (!document.body.classList.contains('sg-home')) return;
      var H = innerHeight;
      [].forEach.call(document.querySelectorAll('body > *, body > * > *, body > * > * > *'), function (el) {
        if (el.id === 'sgHome' || el.tagName === 'SCRIPT' || el.tagName === 'STYLE') return;
        var mh = getComputedStyle(el).minHeight;
        if (/px$/.test(mh) && Math.abs(parseFloat(mh) - H) <= 2) el.style.minHeight = 'calc(100vh - 48px)';
      });
    };
    fit(); window.addEventListener('resize', fit); window.addEventListener('load', fit);
    var ft = null; new MutationObserver(function () { clearTimeout(ft); ft = setTimeout(fit, 200); }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden', 'style'] });
  }

  /* ---------- confetti ---------- */
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function confetti() {
    if (reduce || window.SG_NO_CONFETTI || document.getElementById('sgConfetti')) return;
    var c = document.createElement('canvas'), dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    c.id = 'sgConfetti'; c.setAttribute('aria-hidden', 'true');
    c.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999';
    c.width = W * dpr; c.height = H * dpr; document.body.appendChild(c);
    var x = c.getContext('2d'); x.scale(dpr, dpr);
    var cols = ['#F0545C', '#3E8EF7', '#1FB5A8', '#F4B740', '#8B7CF6', '#E57AC2', '#FFFFFF'], P = [];
    for (var i = 0; i < 170; i++) P.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      vx: -1.5 + Math.random() * 3, vy: 2 + Math.random() * 3.5, r: Math.random() * 6.3, vr: -0.2 + Math.random() * 0.4, c: cols[i % cols.length] });
    var t0 = performance.now();
    (function frame(t) {
      var age = t - t0; x.clearRect(0, 0, W, H);
      P.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.r += p.vr;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = age > 3800 ? Math.max(0, 1 - (age - 3800) / 700) : 1; x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });

  }
  new MutationObserver(function () { clearTimeout(timer); timer = setTimeout(check, 250); }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden', 'style'] });
  setTimeout(check, 600);
})();
