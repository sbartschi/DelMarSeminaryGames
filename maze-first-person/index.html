    if (st === "open" && waiting.length) h += "<p class=\"muted\" style=\"margin-top:10px\">Still playing: " + waiting.join(", ") + "</p>";
    h += "<div class=\"row\" style=\"margin-top:10px\">" + "<button class=\"btn\" data-act=\"reset\" type=\"button\">" + (resetArm ? "Tap again to erase everything" : "Reset game") + "</button></div></div>";
    h += "</div><div class=\"card\"><div class=\"row\" style=\"justify-content:space-between\"><h2 style=\"margin:0\">Leaderboard</h2><div class=\"tabs\" style=\"margin:0\">" +
      "<button class=\"tab " + (boardMode === "total" ? "sel" : "") + "\" data-act=\"bm\" data-m=\"total\" type=\"button\">Total</button>" +
      "<button class=\"tab " + (boardMode === "round" ? "sel" : "") + "\" data-act=\"bm\" data-m=\"round\" type=\"button\">This round</button></div></div>" +
      "<p class=\"muted\">" + n + " player" + (n === 1 ? "" : "s") + " joined. Finish is 300 points, minus 25 per wrong turn, plus 50 per golden fruit and 150 for the treasure chest. The three fastest finishers each round earn 200, 100, and 50 bonus points.</p>" + boardHtml(0, "") + "</div></div>";
    return h;
  }
  function drawQr() {
    var link = location.href.split("#")[0], holder = $("#qrHolder");
    if (!holder || typeof QRCode === "undefined") return;
    holder.innerHTML = "<div class=\"qr-box\" id=\"qrBox\"></div><p class=\"muted\" style=\"text-align:center\">or go to this page's link directly</p>";
    new QRCode($("#qrBox"), { text: link, width: 220, height: 220 });
  }

  /* ---------- play ---------- */
  function startPlay() {
    if (session.status !== "open" || !GAMES[session.game] || submitted(me, session.round)) return;
    var game = session.game;
    playing = { round: session.round, game: game };
    var cfg = "window.IR_CFG={level:" + session.round + ",seed:" + ((session.seed | 0) || 12345) + "};";
    $("#frame").srcdoc = GAMES[game].src.replace("/*IRCFG*/", cfg);
    $("#playinfo").textContent = me + "  |  Round " + session.round + "  |  " + GAMES[game].label;
    view = "play"; $("#playview").classList.remove("hidden"); $("#main").classList.add("hidden");
  }
  function closePlay() {
    playing = null; view = "lobby"; $("#frame").srcdoc = "";
    $("#playview").classList.add("hidden"); $("#main").classList.remove("hidden"); render();
  }
  window.addEventListener("message", function (e) {
    if (!playing || e.source !== $("#frame").contentWindow) return;
    var d = e.data || {};
    if (d.type === "ironrod-score") {
      var num = function (v, lo, hi) { v = +v; return isFinite(v) ? Math.max(lo, Math.min(hi, Math.round(v))) : 0; };
      var rec = { score: num(d.score, 0, 2000), time: num(d.time, 0, 3600000), wrong: num(d.wrong, 0, 999), treasure: num(d.treasure, 0, 1), items: num(d.items, 0, 99), nItems: num(d.nItems, 0, 99), game: playing.game };
      Store.setScore(me, playing.round, rec).then(function () { writeErr = ""; render(); }).catch(function () {
        writeErr = "Your score could not be saved. Ask your teacher to open access for players.";
        banner();
      });
    } else if (d.type === "ironrod-exit") closePlay();
  });

  /* ---------- actions ---------- */
  function setName(n) {
    n = String(n || "").trim().slice(0, 20); if (!n) return;
    me = n; lsSet("ir-name", me);
    Store.join(me).catch(function () { writeErr = "Could not join. Ask your teacher to open access for players."; banner(); });
    render();
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t) return;
    var a = t.getAttribute("data-act");
    if (a === "name") setName(t.getAttribute("data-name"));
    else if (a === "custom") setName(($("#customName") || {}).value);
    else if (a === "switch") { me = ""; lsSet("ir-name", ""); render(); }
    else if (a === "pickgame") doSetSession({ round: 1, status: "lobby", game: t.getAttribute("data-game"), seed: 0 });
    else if (a === "changegame") doSetSession({ round: 1, status: "setup", game: "", seed: 0 });
    else if (a === "play") startPlay();
    else if (a === "quit") closePlay();
    else if (a === "tohost") { hostView = true; render(); }
    else if (a === "toplayer") { hostView = false; render(); }
    else if (a === "bm") { boardMode = t.getAttribute("data-m"); render(); }
    else if (a === "qr") { var v = ($("#linkInput") || {}).value || ""; if (v.trim()) { lsSet("ir-link", v.trim()); drawQr(); } }
    else if (a === "open") doSetSession({ round: session.round, status: "open", game: session.game, seed: 1 + Math.floor(Math.random() * 2000000000) });
    else if (a === "results") doSetSession({ round: session.round, status: "results", game: session.game, seed: session.seed });
    else if (a === "next") doSetSession({ round: Math.min(ROUNDS, session.round + 1), status: "lobby", game: session.game, seed: 0 });
    else if (a === "reset") {
      if (!resetArm) { resetArm = true; render(); setTimeout(function () { resetArm = false; render(); }, 4000); }
      else { resetArm = false; Store.reset(); render(); }
    }
  });

  /* ---------- start ---------- */
  initStore().then(function () {
    ready = true; view = "lobby";
    if (/[?&]host=1/.test(location.search) && canHost) hostView = true;
    Store.onSession(function (s) { session = s || DEFAULT_SESSION; if (view !== "play") render(); });
    Store.onPlayers(function (l) { players = l || []; if (view !== "play") render(); });
    if (me) Store.join(me).catch(function () {});
    render();
  });
  render();
})();
</script>
</body>
</html>
