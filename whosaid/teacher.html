d, and merciful, slow to anger, and of great kindness.", "prompt": "Who said it?", "story": "Jonah and Nineveh (Jonah 1 to 4)", "ctx": "The Lord sent Jonah to warn Nineveh, an enemy city, but he fled by ship toward Tarshish. In a storm he was thrown overboard and swallowed by a great fish, where he prayed for three days and three nights. When he finally preached, the whole city repented and was spared. Jonah was angry, admitting he had run because he knew the Lord would be merciful."}, {"options": ["Job", "The Lord", "Jeremiah", "Nehemiah"], "answer": 0, "ref": "Job 1:21", "expl": "Job said this right after losing his children and possessions", "verse": "The LORD gave, and the LORD hath taken away; blessed be the name of the LORD.", "prompt": "Who said it?", "story": "Job’s trial begins (Job 1 to 2)", "ctx": "Job was a perfect and upright man with great wealth and ten children. Satan claimed Job was faithful only because he was blessed, so the Lord allowed Job to be tried. In one day he lost his animals, servants, and children, and later his health. Job worshipped and said, “The LORD gave, and the LORD hath taken away,” and he did not curse God."}, {"options": ["The Lord", "Daniel", "Jeremiah", "Job"], "answer": 1, "ref": "Daniel 5:25-27", "expl": "Daniel interpreted the writing on the wall for King Belshazzar", "verse": "TEKEL; Thou art weighed in the balances, and art found wanting.", "prompt": "Who said it?", "story": "The writing on the wall (Daniel 5)", "ctx": "King Belshazzar of Babylon held a great feast and drank from the sacred vessels taken from the temple in Jerusalem. Fingers of a man’s hand appeared and wrote on the wall, and only Daniel could read it: the kingdom had been weighed and found wanting. That very night Belshazzar was slain."}, {"options": ["King Ahasuerus", "Shadrach, Meshach, and Abed-nego", "Mordecai", "Job"], "answer": 0, "ref": "Esther 6:6", "expl": "The king asked Haman, who assumed the honor was for himself; it was for Mordecai", "ver ra", "Hezekiah"], "answer": 0, "ref": "Isaiah 38:5", "expl": "The Lord answered Hezekiah’s prayer through Isaiah", "verse": "I have heard thy prayer, I have seen thy tears: behold, I will add unto thy days fifteen years.", "prompt": "Who said it?", "story": "Hezekiah’s prayer for healing (Isaiah 38; 2 Kings 20)", "ctx": "Righteous King Hezekiah became deathly ill, and Isaiah told him to set his house in order. Hezekiah turned his face to the wall and prayed with tears. Before Isaiah had even left the palace, the Lord sent him back to promise fifteen more years, with the sun’s shadow going backward as a sign."}, {"options": ["Nehemiah", "Ezra", "Daniel", "Mordecai"], "answer": 2, "ref": "Daniel 1:12", "expl": "Daniel asked for a ten-day test instead of the king’s food", "verse": "Let them give us pulse to eat, and water to drink.", "prompt": "Who said it?", "story": "Daniel’s food test (Daniel 1)", "ctx": "Daniel and three friends were young Jewish captives chosen for training in the Babylonian king’s court. Rather than defile themselves with the king’s food and wine, they asked to eat pulse (vegetables) and drink water for ten days. At the end they were healthier than the others, and God gave them knowledge and wisdom."}, {"options": ["Amos", "Isaiah", "Jeremiah", "Jonah"], "answer": 2, "ref": "Jeremiah 20:9", "expl": "Jeremiah could not stop speaking the Lord’s word, even when mocked", "verse": "His word was in mine heart as a burning fire shut up in my bones.", "prompt": "Who said it?", "story": "The call of Jeremiah (Jeremiah 1)", "ctx": "The Lord told Jeremiah that He knew him and ordained him a prophet before he was born. Jeremiah protested that he was only a child and could not speak. The Lord touched his mouth, put His words there, and told him not to be afraid. Jeremiah prophesied for about forty years, in the same era as Lehi."}, {"options": ["Jeremiah", "Job", "Jonah", "Elijah"], "answer": 2, "ref": "Jonah 4:3", "expl": "Jonah was angry that the Lord spare <script>(function(){

      S.scores = S.teams.map(function () { return 0; }); S.ids = draw(qn === 'all' ? 'all' : parseInt(qn, 10)); S.i = 0; S.secs = parseInt(secs, 10); S.started = true; question();
    };
  }
  function scoreBar() { return '<div class="score">' + S.teams.map(function (t, i) { return '<div class="chip" style="--c:' + COLORS[i] + '"><div class="n">' + esc(t) + '</div><div class="s">' + S.scores[i] + '</div></div>'; }).join('') + '</div>'; }
  function question() {
    S.got = {}; S.revealed = false; S.left = S.secs; S.paused = false; render();
    stopClock(); if (S.secs > 0) S.timer = setInterval(function () { if (S.paused || S.revealed) return; S.left--; paintClock(); if (S.left <= 0) stopClock(); }, 1000);
  }
  function stopClock() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
  function paintClock() { var c = root.querySelector('.clock'); if (!c) return; c.textContent = S.left > 0 ? (S.paused ? 'Paused ' : '') + S.left + 's' : 'Time!'; c.classList.toggle('out', S.left <= 0); }
  function render() {
    var q = Q[S.ids[S.i]], o = opts(q), r = right(q), rv = S.revealed, h = '<div class="w">' + scoreBar();
    h += '<div class="meta"><span>Question ' + (S.i + 1) + ' of ' + S.ids.length + '</span>' + (S.secs > 0 ? '<span class="row"><span class="clock"></span><button class="b" id="tmPause">' + (S.paused ? 'Resume' : 'Pause') + '</button><button class="b" id="tmMore">+10 sec</button></span>' : '') + '</div>';
    h += '<div class="card"><div class="eyebrow">' + esc(q.round || q.prompt || (KIND === 'tf' ? 'True or false' : KIND === 'order' ? 'Put these in order' : (KIND === 'match' ? 'Who said or wrote this?' : 'Question'))) + '</div>';
    if (q.emoji) h += '<div class="emoji">' + esc(q.emoji) + '</div>';
    if (q.verse) h += '<div class="verse">“' + esc(q.verse) + '”</div>';
    if (q.text) h += '<div class="' + (KIND === 'match' ? 'verse' : 'q') + '">' + (KIND === 'match' ? '“' + esc(q.text) + '”' : esc(q.text)) + '</div>';
    h += '<div class="opts">' + o.map(function (t, k) { var cls = 'opt' + (rv && KIND !== 'order' ? (k === r ? ' ok' : ' dim') : ''); return '<div class="' + cls + '"><i>' + 'ABCDEF'[k] + '</i>' + esc(t) + '</div>'; }).join('') + '</div>';
    if (rv) {
      var label = KIND === 'order' ? '' : '<b>Answer: ' + esc(o[r]) + '</b>';
      h += '<div class="ans">' + label + (q.ref ? (label ? ' &nbsp;' : '') + '<span style="color:#A3B2CE">' + esc(q.ref) + '</span>' : '') + (q.expl ? '<div style="margin-top:4px">' + esc(q.expl) + '</div>' : '') + '</div>';
      if (KIND === 'order') h += '<ol class="order">' + q.items.map(function (it, k) { return '<li>' + esc(it) + (q.dates ? '<span class="when">' + esc(q.dates[k]) + '</span>' : '') + '</li>'; }).join('') + '</ol>' + (typeof eraSvg === 'function' && q.years ? eraSvg(q, false) : '');
      if (q.story || q.ctx) h += '<div class="ctx"><b>' + esc(q.story || '') + '</b><p>' + esc(q.ctx || '') + '</p></div>';
    }
    h += '<h2 style="margin-top:16px">Who got it right? <span class="sub" style="font-weight:400;font-size:.9rem">tap to give a point, tap again to take it back</span></h2><div class="who">' +
      S.teams.map(function (t, i) { return '<button class="b' + (S.got[i] ? ' got' : '') + '" style="--c:' + COLORS[i] + '" data-t="' + i + '">' + (S.got[i] ? '✓ ' : '') + esc(t) + '</button>'; }).join('') + '</div>';
    h += '<div class="row" style="margin-top:14px">' + (rv ? '' : '<button class="b go big" id="tmReveal">Reveal answer</button>') + '<button class="b' + (rv ? ' go' : '') + ' big" id="tmNext">' + (S.i + 1 >= S.ids.length ? 'Final standings' : 'Next question') + '</button></div>';
    h += '<p class="keys">Keyboard: Space pauses the timer, R reveals, N goes to the next question.</p></div></div>';
    root.innerHTML = h; paintClock(); bind();
  }
  function bind() {
    var x;
    if ((x = root.querySelector('#tmPause'))) x.onclick = togglePause;
    if ((x = root.querySelector('#tmMore'))) x.onclick = function () { S.left = Math.max(S.left, 0) + 10; if (!S.timer && S.secs > 0) S.timer = setInterval(function () { if (S.paused || S.revealed) return; S.left--; paintClock(); if (S.left <= 0) stopClock(); }, 1000); paintClock(); };
    if ((x = root.querySelector('#tmReveal'))) x.onclick = reveal;
    root.querySelector('#tmNext').onclick = next;
    root.querySelector('.who').onclick = function (e) { var b = e.target.closest('[data-t]'); if (!b) return; var t = +b.getAttribute('data-t');
      S.got[t] = !S.got[t]; S.scores[t] += S.got[t] ? 1 : -1; var keep = S.paused; render(); S.paused = keep; };
  }
  function togglePause() { S.paused = !S.paused; var b = root.querySelector('#tmPause'); if (b) b.textContent = S.paused ? 'Resume' : 'Pause'; paintClock(); }
  function reveal() { if (S.revealed) return; S.revealed = true; stopClock(); render(); }
  function next() { stopClock(); if (S.i + 1 >= S.ids.length) return final(); S.i++; question(); }
  function final() {
    var order = S.teams.map(function (t, i) { return i; }).sort(function (a, b) { return S.scores[b] - S.scores[a]; });
    root.innerHTML = '<div class="w"><h1>Final standings</h1><div class="card">' + order.map(function (i, k) { return '<div class="stand"><span>' + (k + 1) + '. ' + esc(S.teams[i]) + '</span><b>' + S.scores[i] + '</b></div>'; }).join('') + '</div>' +
      '<div class="row"><button class="b go big" id="tmAgain">Play again</button><button class="b big" id="tmSetup">Change teams</button></div></div>';
    root.querySelector('#tmAgain').onclick = function () { S.scores = S.teams.map(function () { return 0; }); S.ids = draw(S.ids.length); S.i = 0; question(); };
    root.querySelector('#tmSetup').onclick = function () { S.started = false; setup(); };
  }
  document.addEventListener('keydown', function (e) {
    if (!document.body.classList.contains('tm-on') || !S.started || /input|textarea/i.test((e.target && e.target.tagName) || '') || !root.querySelector('#tmNext')) return;
    if (e.key === ' ') { e.preventDefault(); if (S.secs > 0 && !S.revealed) togglePause(); }
    else if (e.key === 'r' || e.key === 'R') reveal(); else if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') next();
  });
  if (/[?&]mode=teams/.test(location.search)) mode('teams');
})();

</script>
<script>
/* Site helper: an "All games" button for the teacher's screen, and confetti whenever a final standings screen appears. */
(function () {
  var inFrame = false; try { inFrame = window.parent !== window; } catch (e) { inFrame = true; }
  function isPlayer() { return /(^|\/)(play|wordle-play|clues-play)\.html$/.test(location.pathname) || /[?&](play|join)=/.test(location.search) || location.hash === '#play'; }
  var css = document.createElement('style');
  css.textContent = '#sgHome{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:9998;display:inline-flex;align-items:center;gap:6px;' +
    'font:800 13px/1 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#EEF3FB;background:rgba(13,21,40,.88);border:1px solid rgba(160,185,230,.3);' +
    'border-radius:999px;padding:8px 13px;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}' +
    '#sgHome:hover{border-color:#1FB5A8}#sgHome:focus-visible{outline:3px solid #fff;outline-offset:2px}' +
    'body.sg-home{padding-top:48px!important;box-sizing:border-box}@media (max-width:700px){#sgHome{font-size:12px;padding:7px 11px}}';
  document.head.appendChild(css);
  if (!inFrame) {
    var a = document.createElement('a'); a.id = 'sgHome'; a.href = '../'; a.textContent = '\u2190 All games';
    a.setAttribute('aria-label', 'Back to all seminary games');
    document.body.appendChild(a);
    /* shown on every teacher or shared screen; hidden only on student-only pages viewed on a phone */
    var hide = function () { return isPlayer() && innerWidth <= 700; };
    var sync = function () { var h = hide(); a.hidden = h; a.style.display = h ? 'none' : ''; document.body.classList.toggle('sg-home', !h); };
    sync(); window.addEventListener('hashchange', sync); window.addEventListener('resize', sync);
    /* full-screen layouts: make room for the button strip so the page does not scroll */
    var fit = function () {
      if (!document.body.classList.contains('sg-home')) return;
      var H = innerHeight;
      [].forEach.call(document.querySelectorAll('body > *, body > * > *, body > * > * > *'), function (el) {
        if (el.id === 'sgHome' || el.tagName === 'SCRIPT' || el.tagName === 'STYLE') return;
        var mh = getComputedStyle(el).minHeight;
        if (/px$/.test(mh) && Math.abs(parseFloat(mh) - H) <= 2) el.style.minHeight = 'calc(100vh - 48px)';
      });
    };
    fit(); window.addEventListener('resize', fit); window.addEventListener('load', fit);
    var ft = null; new MutationObserver(function () { clearTimeout(ft); ft = setTimeout(fit, 200); }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden', 'style'] });
  }

  /* ---------- confetti ---------- */
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function confetti() {
    if (reduce || window.SG_NO_CONFETTI || document.getElementById('sgConfetti')) return;
    var c = document.createElement('canvas'), dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    c.id = 'sgConfetti'; c.setAttribute('aria-hidden', 'true');
    c.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999';
    c.width = W * dpr; c.height = H * dpr; document.body.appendChild(c);
    var x = c.getContext('2d'); x.scale(dpr, dpr);
    var cols = ['#F0545C', '#3E8EF7', '#1FB5A8', '#F4B740', '#8B7CF6', '#E57AC2', '#FFFFFF'], P = [];
    for (var i = 0; i < 170; i++) P.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      vx: -1.5 + Math.random() * 3, vy: 2 + Math.random() * 3.5, r: Math.random() * 6.3, vr: -0.2 + Math.random() * 0.4, c: cols[i % cols.length] });

        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = age > 3800 ? Math.max(0, 1 - (age - 3800) / 700) : 1; x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
      if (age < 4500) requestAnimationFrame(frame); else c.remove();
    })(t0);
  }
  window.sgConfetti = confetti;
  var FINAL = /^\s*(final (standings|results|rank|leaderboard|scores)|game over)\b/i, was = false, timer = null;
  function check() {
    var els = document.querySelectorAll('h1,h2,h3,.eyebrow,.title,.big'), now = false;
    for (var i = 0; i < els.length && !now; i++) { var e = els[i]; if (e.offsetParent !== null && FINAL.test(e.textContent || '')) now = true; }
    if (now && !was) confetti();
    was = now;
  }
  new MutationObserver(function () { clearTimeout(timer); timer = setTimeout(check, 250); }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden', 'style'] });
  setTimeout(check, 600);
})();

</script>
