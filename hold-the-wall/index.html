.lobTop{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.ahead{display:flex;align-items:center;font-size:1.15rem}.ahead .dot{background:var(--c)}.ahead .rank{margin-left:auto;color:var(--muted);font-weight:700}.ahead .score{margin-left:10px;font-weight:800;color:var(--gold)}

.phase{font-weight:700;text-align:center}

.astat{text-align:center}
.feed{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:1.05rem;min-height:3em}
.frow{padding:.2em 0;display:flex;align-items:center}
.over{text-align:center;max-width:820px;margin:0 auto}.podium{display:flex;gap:20px;justify-content:center;margin:20px 0}

.medal{font-size:4rem}.pts{font-size:1.6rem;font-weight:800;color:var(--gold)}
.orows{text-align:left;margin-bottom:20px;font-size:1.05rem}

.gm[hidden]{display:none}
.gm-hud{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:8px;line-height:1.4}

.gm .dp.on,.gm #bAct.on{background:var(--gacc);color:#1d1b16;transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.gm .dp[data-d=up]{grid-column:2;grid-row:1}.gm .dp[data-d=left]{grid-column:1;grid-row:2}.gm .dp[data-d=right]{grid-column:3;grid-row:2}.gm .dp[data-d=down]{grid-column:2;grid-row:2}

.gm #bAct{font-family:inherit;font-size:12px;height:calc(var(--s,66px) + 4px);min-height:66px;background:#c0392b;color:#fff;border:0;box-shadow:3px 3px 0 #000;touch-action:none;cursor:pointer;border-radius:0}

.gm .tl.on{background:var(--gacc);box-shadow:0 0 0 2px #fff}

.gm-down.hidden{display:none}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('

  function mvp(T, key) { var best = null; for (var k in T.ps) if (!best || T.ps[k][key] > best[key] || (key === 'b' && T.ps[k].b + T.ps[k].r > best.b + best.r)) best = T.ps[k]; return best; }
  root.innerHTML = '<div class="over"><h1>Game over</h1><div class="podium">' + top.map(function (r, i) {
    return '<div class="pcard' + (i === 0 ? ' p1' : '') + '" style="--c:' + esc(r.tm.color) + '"><div class="medal">' + medal[i] + '</div><h2>' + esc(r.tm.name) + '</h2><div class="pts">' + r.sc + ' pts</div><p class="muted">' + (r.T.ph === 'won' ? 'Held every wave' : 'Fell on wave ' + r.T.fw) + '</p></div>';
  }).join('') + '</div><h3>All teams</h3><div class="orows">' + rk.map(function (r, i) {
    var kd = mvp(r.T, 'k'), bd = mvp(r.T, 'b');
    return '<div class="lrow"><span class="dot" style="background:' + esc(r.tm.color) + '"></span><span class="lname">#' + (i + 1) + ' ' + esc(r.tm.name) + '</span><span class="muted small">waves ' + r.T.cl + '/' + r.T.nw + ', defeated ' + r.T.k + (kd && kd.k ? ', top defender ' + esc(kd.name) + ' (' + kd.k + ')' : '') + (bd && (bd.b + bd.r) ? ', top builder ' + esc(bd.name) + ' (' + (bd.b + bd.r) + ')' : '') + '</span><b>&nbsp;' + r.sc + '</b></div>';
  }).join('') + '</div><button class="btn big" data-act="new" type="button">Play again</button></div>';
}

/* ---------- Clicks ---------- */
el.addEventListener('change', function (e) {
  var tn = e.target.closest ? e.target.closest('.tname') : null;
  if (tn) db.patch(H.code + '/teams/' + tn.getAttribute('data-team'), { name: tn.value.trim() || 'Team' }).then(function () { H.sig = ''; lobbyTick(); });
});
el.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-act]') : null; if (!b) return;
  var a = b.getAttribute('data-act');
  function refresh() { H.sig = ''; return lobbyTick(); }
  if (a === 'cycle') {
    var pid = b.getAttribute('data-pid'), p = H.players[pid], i = H.teams.map(function (x) { return x.id; }).indexOf(p.team);
    db.patch(H.code + '/players/' + pid, { team: H.teams[(i + 1) % H.teams.length].id }).then(refresh);
  } else if (a === 'addteam') {
    if (H.teams.length >= 6) return;
    var used = H.teams.map(function (x) { return x.color; }), names = H.teams.map(function (x) { return x.name; });
    var color = WH.COLORS.filter(function (c) { return used.indexOf(c) < 0; })[0] || WH.COLORS[0], nm = WH.TEAM_NAMES.filter(function (n) { return names.indexOf(n) < 0; })[0] || 'Team ' + (H.teams.length + 1);
    db.put(H.code + '/teams/t' + (Date.now() % 100000), { name: nm, color: color, order: H.teams.length + 1 }).then(refresh);
  } else if (a === 'rmteam') {
    if (H.teams.length <= 1) return; var tid = b.getAttribute('data-team');
    var movers = Object.keys(H.players).filter(function (k) { return H.players[k].team === tid; }), rest = H.teams.filter(function (x) { return x.id !== tid; });
    Promise.all(movers.map(function (k, i) { return db.patch(H.code + '/players/' + k, { team: rest[i % rest.length].id }); })).then(function () { return db.del(H.code + '/teams/' + tid); }).then(refresh);
  } else if (a === 'bots') {
    var counts = {}; H.teams.forEach(function (x) { counts[x.id] = 0; }); Object.keys(H.players).forEach(function (k) { if (counts[H.players[k].team] != null) counts[H.players[k].team]++; });
    Promise.all(WH.BOT_NAMES.map(function (n, i) { var least = H.teams.slice().sort(function (x, y) { return counts[x.id] - counts[y.id]; })[0]; counts[least.id]++; return db.put(H.code + '/players/bot' + (i + 1) + '_' + (H.bots++), { name: n, team: least.id, bot: true, t: now() }); })).then(refresh);
  } else if (a === 'clearbots') {
    Promise.all(Object.keys(H.players).filter(function (k) { return H.players[k].bot; }).map(function (k) { return db.del(H.code + '/players/' + k); })).then(refresh);
  } else if (a === 'waves') { H.waves = +b.getAttribute('data-n'); H.sig = ''; db.patch(H.code + '/meta', { waves: H.waves }).then(refresh); }
  else if (a === 'diff') { H.diff = b.getAttribute('data-d'); H.sig = ''; db.patch(H.code + '/meta', { diff: H.diff }).then(refresh); }
  else if (a === 'start') start();
  else if (a === 'pause') { H.paused = !H.paused; renderPlay(); }
  else if (a === 'end') { if (b.getAttribute('data-arm')) finish(); else { b.setAttribute('data-arm', '1'); b.textContent = 'Tap again to end'; setTimeout(function () { b.removeAttribute('data-arm'); b.textContent = 'End game'; }, 3500); } }
  else if (a === 'new') { H.stop = false; H.state = 'lobby'; H.players = {}; newGame(); }
});

if (!opts.manual) init();
return { state: H, stop: stop, start: start, init: init, newGame: newGame, tick: tick, code: function () { return H.code; } };
};
</script>
<script>(function(){
  var db = WH.restDb(WH.DEFAULT_DB, WH.DEFAULT_ROOT), app = document.getElementById('app');
  var play = WH.param('play'), join = WH.param('join');
  if (play !== null || join !== null) WH.mountPhone(app, db, { prefillCode: play || '' });
  else WH.mountHost(app, db, {});
})();</script>
