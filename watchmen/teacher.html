<style>:root{--bg-page:#0E1B2B;--bg-panel:#16273B;--bg-panel-raised:#1E3450;--ink:#F1F6FB;--muted:#9FB4C9;--line:rgba(241,246,251,0.14);--accent:#F2C14E;--ok:#3FA66B;--bad:#C65B5B;color-scheme:dark;}

.result-big{font-family:'Fraunces',Georgia,serif;font-size:2.2rem;font-weight:700;margin:6px 0;}
.good{color:var(--ok);} .bad{color:var(--bad);}
.reveal{background:var(--bg-panel-raised);border-radius:12px;padding:14px 16px;margin-top:6px;}

.ph{max-width:480px;margin:0 auto;}
.center{text-align:center;}

.emoji{font-size:4rem;line-height:1.3;text-align:center;margin:10px 0 18px;letter-spacing:0.1em;}
.order{margin:0 0 6px;padding-left:28px;font-size:1.15rem;line-height:1.7;}

.ans.picked{border-color:var(--accent);background:rgba(255,255,255,0.08);opacity:0.75;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);margin-right:10px;font-weight:700;font-family:'IBM Plex Mono',monospace;}

.scene{font-size:1.15rem;line-height:1.5;margin:4px 0 10px;}

.mtrack{height:10px;border-radius:5px;background:var(--bg-panel-raised);overflow:hidden;margin-top:4px;}
.mtrack i{display:block;height:100%;background:var(--accent);transition:width .4s ease;}
.tally{display:grid;gap:8px;margin-top:8px;}
.trow{padding:10px 12px;border-radius:10px;border:1px solid var(--line);}
.trow.dec{border-color:var(--accent);background:rgba(255,255,255,0.05);}
.trow .n,.opt .n{font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-right:8px;}
.did{border-color:var(--accent);}
ul.plain{margin:0;padding-left:20px;line-height:1.6;}
.pts{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;color:var(--muted);margin-left:6px;white-space:nowrap;}
.pts.top{color:var(--accent);font-weight:700;}
.night{--bg-page:#0A1230;--bg-panel:#121C42;--bg-panel-raised:#1D2A5C;--ink:#EEF2FF;--muted:#A9B4DA;--line:rgba(238,242,255,0.14);--accent:#F2C14E;color-scheme:dark;}
.day{--bg-page:#F4EBD7;--bg-panel:#FFFDF7;--bg-panel-raised:#F2E6CB;--ink:#2A2416;--muted:#6B604A;--line:rgba(42,36,22,0.16);--accent:#B5651D;color-scheme:light;}
.day .btn.primary{color:#fff;}
body{transition:background .6s ease,color .6s ease;}
.scene-art{display:block;width:100%;height:auto;border-radius:14px;margin-bottom:14px;}
.phase{display:flex;align-items:center;gap:12px;margin:0 0 8px;}
.phase .big{font-family:'Fraunces',Georgia,serif;font-size:2.4rem;font-weight:700;}
.pill{display:inline-block;border-radius:20px;padding:4px 12px;font-size:0.85rem;background:var(--bg-panel-raised);margin:3px;}
.pill.out{text-decoration:line-through;opacity:0.55;}
.rolecard{border:2px solid var(--accent);border-radius:14px;padding:16px;background:var(--bg-panel);margin-bottom:14px;}
.rolecard .rn{font-family:'Fraunces',Georgia,serif;font-size:1.8rem;font-weight:700;color:var(--accent);}
.news{font-size:1.25rem;line-height:1.5;}
.note{background:var(--bg-panel-raised);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:0.95rem;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ans.sel{outline:3px solid var(--accent);}
.ans small{display:block;color:var(--muted);font-size:0.8rem;margin-top:3px;}
.clock{font-family:'IBM Plex Mono',monospace;font-size:2rem;color:var(--accent);}

var ROLE={israelite:{name:'Israelite',team:'israel',desc:'You are a faithful Israelite. At night, tap Pray for Israel. During the day, listen carefully and vote to cast out the Deceivers.',ref:'Ezekiel 33:2'},

  if (night){
    var st=[[40,20],[90,50],[150,15],[210,40],[260,12],[330,30],[390,18],[450,45],[520,22],[570,55],[120,70],[480,70],[300,60],[20,60]];
    s+='<rect width="'+w+'" height="'+h+'" fill="url(#gn)"/>';

    s+='<circle cx="500" cy="'+(h*0.3)+'" r="'+(h*0.16)+'" fill="#F4E9C1"/><circle cx="'+(500+h*0.07)+'" cy="'+(h*0.26)+'" r="'+(h*0.15)+'" fill="#1A2453"/>';

<script>(function(){

function lb(pl){ var r=ranked(pl), h='<table class="lb"><tr><th>#</th><th>Name</th><th>Role</th><th>Score</th></tr>'; r.forEach(function(p,i){ h+='<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+esc(ROLE[pl[p.id].role].name)+'</td><td>'+p.score.toLocaleString()+'</td></tr>'; }); return h+'</table>'; }

function winner(pl){ var d=0,o=0; alivePl(pl).forEach(function(id){ if (pl[id].role==='deceiver') d++; else o++; }); if (d===0) return 'israel'; if (d>=o) return 'deceivers'; return ''; }
function header(night, label, sub){ return sceneSvg(night,true)+'<div class="phase"><span class="big">'+label+'</span></div>'+(sub?'<p class="muted">'+sub+'</p>':''); }
function render(){
  if (!room) return;

      '<div class="card"><div class="qr-box" id="qr"></div><div class="code">'+code+'</div><div class="muted center">Or open the play page and type this code</div></div>'+

    var vd=m.verdict||{}, tl=vd.tally||{}, rows=Object.keys(tl).sort(function(a,b){ return tl[b]-tl[a]; }).map(function(k){ return '<tr><td>'+(k==='skip'?'Skip':esc(nameOf(pl,k)))+'</td><td>'+tl[k]+'</td></tr>'; }).join('');

  } else if (m.phase==='final'){
    var w=m.win; setTime(w!=='israel');
    h=header(w!=='israel', w==='israel'?'Israel is safe':'The Deceivers win', w==='israel'?'Every Deceiver was found and cast out.':'The Deceivers now equal the faithful who remain.')+
      '<div class="card"><h2>Everyone\'s role</h2>'+roster(pl,true)+'</div>'+
      '<div class="card"><h2>Leaderboard</h2>'+lb(pl)+'<p class="muted">1,000 points for the winning team, 200 for each vote an Israelite cast against a real Deceiver, and 300 for each Deceiver the Prophet discovered.</p></div>'+
      '<div class="card"><h2>Discuss</h2><ul class="plain"><li>How did you decide whom to trust when more than one person claimed to be the Prophet?</li><li>Jeremiah warned of prophets who "speak a vision of their own heart, and not out of the mouth of the LORD" (Jeremiah 23:16). How can we tell true counsel from false today?</li><li>What does a watchman owe the people, and who are the watchmen in our lives (Ezekiel 33:7)?</li></ul></div>'+

function keyOf(){ var m=room.meta, pl=room.players||{}, n=m.n; return [m.phase,n,peek,Object.keys(pl).length,alivePl(pl).length,Object.keys(((room.act||{})[n])||{}).length,Object.keys(((room.vote||{})[n])||{}).length,m.phase==='day'?Math.ceil((dayEnd-Date.now())/1000):''].join('~'); }

  jget(code,'').then(function(d){ busy=false; if (!d||!d.meta) return; room=d;
    var m=d.meta, pl=d.players||{}, al=alivePl(pl);

}
function start(){
  var pl=room.players||{}, ids=shuffle(Object.keys(pl)), c=counts(ids.length), roles=[], upd={};

  ids.forEach(function(id,i){ upd['players/'+id+'/role']=roles[i]||'israelite'; upd['players/'+id+'/alive']=true; upd['players/'+id+'/score']=0; });
  upd['meta/phase']='night'; upd['meta/n']=1;

}
function sunrise(){
  acting=true;
  var m=room.meta, pl=room.players||{}, a=(room.act||{})[m.n]||{}, al=alivePl(pl), upd={}, tally={}, prot=null;
  al.forEach(function(id){ var r=pl[id].role, t=(a[id]||{}).t;
    if (r==='deceiver' && t && pl[t] && pl[t].alive!==false) tally[t]=(tally[t]||0)+1;
    if (r==='shepherd' && t) prot=t; });
  var best=0, tops=[]; for (var k in tally){ if (tally[k]>best){ best=tally[k]; tops=[k]; } else if (tally[k]===best) tops.push(k); }
  var target=tops.length?tops[Math.floor(Math.random()*tops.length)]:null, news={};
  if (target && target===prot) news.saved=true; else if (target){ news.captive=target; upd['players/'+target+'/alive']=false; }
  al.forEach(function(id){ var r=pl[id].role, t=(a[id]||{}).t; if (!t||!pl[t]) return;
    if (r==='prophet'){ var dec=pl[t].role==='deceiver'; upd['players/'+id+'/notes/'+m.n]='Night '+m.n+': the Lord showed you that '+pl[t].name+(dec?' IS a Deceiver':' is on Israel\'s side'); if (dec) upd['players/'+id+'/score']=(pl[id].score||0)+300; }
    if (r==='watchman'){ var out=['deceiver','prophet','shepherd'].indexOf(pl[t].role)>=0; upd['players/'+id+'/notes/'+m.n]='Night '+m.n+': '+pl[t].name+(out?' went out in the night':' stayed home all night'); }
    if (r==='shepherd') upd['players/'+id+'/lastProt']=t; });
  upd['meta/news']=news;

}
function closeVote(){

  var m=room.meta, pl=room.players||{}, v=(room.vote||{})[m.n]||{}, al=alivePl(pl), tally={}, upd={};
  al.forEach(function(id){ var t=(v[id]||{}).t; if (!t) return; tally[t]=(tally[t]||0)+1;
    if (t!=='skip' && pl[t] && pl[t].role==='deceiver' && pl[id].role!=='deceiver') upd['players/'+id+'/score']=(pl[id].score||0)+200; });
  var best=0, tops=[]; for (var k in tally){ if (tally[k]>best){ best=tally[k]; tops=[k]; } else if (tally[k]===best) tops.push(k); }
  var vd={tally:tally}; if (tops.length===1 && tops[0]!=='skip'){ vd.out=tops[0]; upd['players/'+tops[0]+'/alive']=false; } else if (tops.length>1) vd.tie=true;

  var w=winner(pl2); if (w) finalize(upd,pl2,w); else upd['meta/phase']='verdict';
  jpatch(code,'',upd).then(function(){ acting=false; lastKey=''; poll(); });
}
function finalize(upd,pl2,w){ for (var id in pl2){ var team=ROLE[pl2[id].role].team, sc=upd['players/'+id+'/score']!=null?upd['players/'+id+'/score']:(pl2[id].score||0); if (team===w) sc+=1000; upd['players/'+id+'/score']=sc; } upd['meta/phase']='final'; upd['meta/win']=w; }
app.addEventListener('click', function(e){
  var b=e.target.closest('[data-a]'); if (!b||b.disabled) return; var a=b.getAttribute('data-a');
  if (a==='peek'){ peek=!peek; lastKey=''; render(); return; }
  b.disabled=true;
  if (a==='start') start();
  else if (a==='sunrise'){ if (!acting) sunrise(); }
  else if (a==='vote') jpatch(code,'meta',{phase:'vote'}).then(poll);
  else if (a==='close'){ if (!acting) closeVote(); }
  else if (a==='nextnight') jpatch(code,'meta',{phase:'night', n:room.meta.n+1, news:null, verdict:null}).then(poll);
  else if (a==='again') newGame().then(poll);
});
newGame().then(function(){ poll(); setInterval(poll,1200); });
})();

/* Site helper: an "All games" button for the teacher's screen, and confetti whenever a final standings screen appears. */
(function () {
