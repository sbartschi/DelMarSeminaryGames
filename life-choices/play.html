<!DOCTYPE html>
<html lang="en">
<head>
<script>/* Practice mode: when this page runs inside the site's practice page, use its pretend database and give this screen its own storage. Does nothing otherwise. */
(function(){try{var P=window.parent!==window&&window.parent.PRACTICE;if(!P)return;window.fetch=P.fetch;var s=P.storage(window.name||location.href);Object.defineProperty(window,'localStorage',{configurable:true,get:function(){return s.local;}});Object.defineProperty(window,'sessionStorage',{configurable:true,get:function(){return s.session;}});}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Life Choices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1FF; --surface:#FFFFFF; --ink:#1A1744; --muted:#625F8F; --line:#D9D5F4; --soft:#ECE8FF;
  --accent:#5B3DF5; --accent-ink:#FFFFFF; --gold:#F5B700; --gold-ink:#2A2100; --mint:#14A87E; --coral:#E8456B; --sky:#2E8BFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0D2B; --surface:#1B1845; --ink:#F2F0FF; --muted:#ABA8D8; --line:#332F6D; --soft:#26225A;
    --accent:#9380FF; --accent-ink:#0F0D2B; --gold:#FFC933; --gold-ink:#2A2100; --mint:#34D3A0; --coral:#FF6B8E; --sky:#5CA9FF;
    color-scheme:dark;
  }
}
[data-theme="dark"]{
  --bg:#0F0D2B; --surface:#1B1845; --ink:#F2F0FF; --muted:#ABA8D8; --line:#332F6D; --soft:#26225A;
  --accent:#9380FF; --accent-ink:#0F0D2B; --gold:#FFC933; --gold-ink:#2A2100; --mint:#34D3A0; --coral:#FF6B8E; --sky:#5CA9FF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

/* ================= HOST SCREEN ================= */
.hs-wrap{container-type:inline-size; width:100%}
.hs{
  font-size:max(11px,1.25cqw); line-height:1.3;
  background:var(--bg); color:var(--ink);
  min-height:100%; display:flex; flex-direction:column; gap:1em; padding:1.1em 1.8em 1.4em;
}
.hs-top{display:flex; align-items:center; justify-content:space-between; gap:1em}
.hs-logo{font-size:1.5em; font-weight:800; letter-spacing:-.02em}
.hs-logo span{color:var(--accent)}
.hs-pips{display:flex; align-items:center; gap:.45em}
.pip{width:2em; height:2em; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:.95em; background:var(--soft); color:var(--muted); border:2px solid transparent}
.pip.done{background:var(--mint); color:#fff}
.pip.now{background:var(--gold); color:var(--gold-ink); border-color:var(--ink); transform:scale(1.15)}
.hs-count{font-weight:600; color:var(--muted)}
.hs-main{flex:1; display:flex; flex-direction:column; gap:1em; min-height:0}
.hs-title{font-size:2.5em; font-weight:800; letter-spacing:-.02em; line-height:1.05; margin:0}
.hs-sub{font-size:1.3em; color:var(--muted); margin:.15em 0 0}
.hs-foot{display:flex; align-items:center; justify-content:space-between; gap:1em; flex-wrap:wrap}
.hs-btn{font:inherit; font-size:1.4em; font-weight:800; border:0; border-radius:.7em; padding:.6em 1.3em; background:var(--accent); color:var(--accent-ink); cursor:pointer; box-shadow:0 .2em 0 rgba(0,0,0,.18)}
.hs-btn:hover{filter:brightness(1.08)}
.hs-btn:active{transform:translateY(.1em); box-shadow:0 .1em 0 rgba(0,0,0,.18)}
.hs-btn.gold{background:var(--gold); color:var(--gold-ink)}
.hs-btn.ghost{background:var(--surface); color:var(--ink); border:2px solid var(--line); box-shadow:none; font-size:1em; font-weight:600; padding:.55em 1em}
.hs-btn[disabled]{opacity:.45; cursor:default}
.hs-toast{position:fixed; left:50%; bottom:1.5em; transform:translateX(-50%); background:var(--coral); color:#fff; padding:.6em 1.2em; border-radius:.7em; font-weight:700; z-index:9; font-size:1.1em}
.hs-offline{background:var(--coral); color:#fff; padding:.3em .8em; border-radius:.5em; font-weight:700; font-size:.9em}

/* lobby */
.hs-lobby{display:grid; grid-template-columns:minmax(14em,23em) minmax(0,1fr); gap:2em; align-items:start}
.hs-qr{background:#fff; border-radius:1em; padding:1em; box-shadow:0 .3em 1.2em rgba(40,20,120,.18)}
.hs-qr svg{display:block; width:100%; height:auto}
.hs-url{margin-top:.8em; font-weight:700; font-size:1.1em; word-break:break-all}
.hs-steps{color:var(--muted); font-size:1.05em; margin:.4em 0 0; padding-left:1.2em}
.hs-names{display:flex; flex-wrap:wrap; gap:.5em; margin-top:.8em}
.tag{background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:.3em .9em; font-weight:700; font-size:1.15em; animation:pop .35s cubic-bezier(.2,1.4,.4,1) both; display:inline-flex; gap:.4em; align-items:center}
.tag button{border:0; background:none; color:var(--muted); font-size:1em; cursor:pointer; padding:0; line-height:1}
@keyframes pop{from{transform:scale(.4); opacity:0}}
.hs-empty{color:var(--muted); font-size:1.2em; margin-top:.8em}
.hs-panel{background:var(--surface); border:2px solid var(--line); border-radius:1em; padding:1em 1.2em}
.hs-panel h3{margin:0 0 .6em; font-size:1.2em}
.hs-set{display:grid; grid-template-columns:repeat(auto-fill,minmax(15em,1fr)); gap:.7em 1.2em}
.hs-set label{display:block; font-size:.85em; color:var(--muted); margin-bottom:.15em}
.hs-set input,.hs-set select{width:100%; font:inherit; font-size:1em; padding:.4em .5em; border-radius:.4em; border:2px solid var(--line); background:var(--bg); color:var(--ink)}
.hs-note{font-size:.85em; color:var(--muted); margin:.6em 0 0}

/* choosing */
.hs-prompts{display:flex; flex-wrap:wrap; gap:.6em; margin-top:.6em}
.hs-prompt{background:var(--gold); color:var(--gold-ink); font-weight:800; border-radius:.6em; padding:.35em .9em; font-size:1.2em}
.hs-meter{height:1em; border-radius:.5em; background:var(--soft); overflow:hidden}
.hs-meter i{display:block; height:100%; background:var(--mint); transition:width .4s}
.hs-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(11em,1fr)); gap:.6em}
.pchip{background:var(--surface); border:2px solid var(--line); border-radius:.8em; padding:.55em .8em; font-weight:700; display:flex; justify-content:space-between; gap:.5em; align-items:center}
.pchip.done{border-color:var(--mint)}
.pchip .st{color:var(--muted); font-weight:600}
.pchip.done .st{color:var(--mint); font-weight:800}

/* reveal */
.hs-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(15em,1fr)); gap:.7em}
.pcard{background:var(--surface); border:2px solid var(--line); border-radius:.9em; padding:.7em .9em; animation:pop .4s both}
.pcard h4{margin:0 0 .35em; font-size:1.2em}
.chip{display:inline-block; background:var(--soft); border-radius:.5em; padding:.2em .6em; margin:0 .3em .3em 0; font-size:.95em; font-weight:600}
.chip.yes{background:color-mix(in srgb,var(--mint) 25%,transparent)}
.chip.no{background:color-mix(in srgb,var(--coral) 18%,transparent)}
.pcard .pay{display:flex; align-items:center; gap:.4em; font-size:.85em; color:var(--muted); margin-top:.3em}
.pcard .pay input{width:7em; font:inherit; padding:.2em .4em; border:2px solid var(--line); border-radius:.4em; background:var(--bg); color:var(--ink)}
.pcard .miss{color:var(--coral); font-weight:700; font-size:.85em}

/* leaderboard */
.hs-seg{display:inline-flex; border:2px solid var(--line); border-radius:.7em; overflow:hidden}
.hs-seg button{font:inherit; font-size:1em; font-weight:700; padding:.4em 1em; border:0; background:var(--surface); color:var(--ink); cursor:pointer}
.hs-seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.lb{display:flex; flex-direction:column; gap:.3em; flex:1; justify-content:flex-start}
.lb-row{display:grid; grid-template-columns:2.2em 10em minmax(0,1fr) 9em 5em; align-items:center; gap:.7em; min-height:2.2em}
.lb.dense .lb-row{min-height:1.6em; gap:.5em; font-size:.82em}
.lb-rank{font-weight:800; font-size:1.2em; text-align:center; color:var(--muted)}
.lb-row:nth-child(1) .lb-rank{color:var(--gold)}
.lb-name{line-height:1.1; overflow:hidden}
.lb-name b{display:block; font-size:1.15em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lb-name small{color:var(--muted); font-size:.8em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block}
.lb-bar{position:relative; height:1.6em; background:var(--soft); border-radius:.4em; overflow:hidden}
.lb-zero{position:absolute; top:0; bottom:0; width:2px; background:var(--ink); opacity:.5; z-index:2}
.lb-fill{position:absolute; top:0; bottom:0; border-radius:.3em}
.lb-fill.pos{background:var(--mint); transform-origin:left center}
.lb-fill.neg{background:var(--coral); transform-origin:right center}
.enter .lb-fill{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.lb-val{font-weight:800; font-size:1.2em; text-align:right}
.lb-val.neg{color:var(--coral)}
.lb-delta{font-size:.8em; text-align:right; color:var(--muted); font-weight:600; line-height:1.1}
.lb-delta.up{color:var(--mint)} .lb-delta.dn{color:var(--coral)}
.hs-table{width:100%; border-collapse:collapse; font-size:.95em}
.hs-table th,.hs-table td{padding:.4em .6em; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; font-weight:400}
.hs-table th{color:var(--muted); font-size:.85em}
.hs-table td:nth-child(-n+3),.hs-table th:nth-child(-n+3){text-align:left}
.hs-table td:last-child,.hs-table th:last-child{text-align:left; white-space:normal; min-width:18em}
.hs-table td b{font-weight:800}
.hs-scroll{overflow:auto; max-height:60vh}

/* final */
.hs-podium{display:flex; align-items:flex-end; justify-content:center; gap:1.2em; margin:.5em 0 1em}
.pod{width:14em; text-align:center; border-radius:1em 1em 0 0; padding:.8em .6em; color:#fff; animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.pod .nm{font-size:1.6em; font-weight:800}
.pod .am{font-size:1.2em; font-weight:700}
.pod .cr{opacity:.9; font-size:.9em}
.pod.p1{height:12em; background:var(--gold); color:var(--gold-ink)}
.pod.p2{height:9em; background:var(--sky); animation-delay:.2s}
.pod.p3{height:7em; background:var(--mint); animation-delay:.4s}
.pod .medal{font-size:2.2em}
@keyframes rise{from{transform:translateY(3em) scaleY(.2); opacity:0}}

/* ================= PHONE ================= */
.ph{
  font-size:17px; line-height:1.35; background:var(--bg); color:var(--ink);
  min-height:100%; display:flex; flex-direction:column; padding:18px 16px 24px; gap:14px;
}
.ph-top{display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--muted); font-weight:600}
.ph h1{font-size:30px; line-height:1.05; margin:0; font-weight:800; letter-spacing:-.02em}
.ph h2{font-size:22px; margin:0; font-weight:800}
.ph p{margin:0}
.ph .muted{color:var(--muted)}
.ph input[type=text]{width:100%; font:inherit; font-size:20px; padding:14px 14px; border-radius:14px; border:2px solid var(--line); background:var(--surface); color:var(--ink)}
.ph input[type=text]:focus-visible,.ph button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.ph-btn{font:inherit; font-size:20px; font-weight:800; border:0; border-radius:16px; padding:16px; background:var(--accent); color:var(--accent-ink); cursor:pointer; width:100%; box-shadow:0 4px 0 rgba(0,0,0,.2)}
.ph-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.2)}
.ph-btn[disabled]{opacity:.4; box-shadow:none}
.ph-btn.ghost{background:var(--surface); color:var(--ink); border:2px solid var(--line); box-shadow:none; font-size:16px; font-weight:600}
.ph-card{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:16px}
.ph-q{font-size:20px; font-weight:800; margin:6px 0 10px}
.ph-opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.ph-opt{font:inherit; font-size:16px; font-weight:700; border:2px solid var(--line); background:var(--surface); color:var(--ink); border-radius:14px; padding:12px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; min-height:78px; text-align:center}
.ph-opt .ic{font-size:26px}
.ph-opt.on{border-color:var(--accent); background:var(--soft); box-shadow:0 0 0 3px var(--accent)}
.ph-yn{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.ph-yn .ph-opt{min-height:64px; font-size:17px}
.ph-center{text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; margin:auto 0; padding:10px}
.ph-big{font-size:56px; line-height:1}
.ph-stat{font-size:34px; font-weight:800}
.ph-err{color:var(--coral); font-weight:700; min-height:1.3em}
.ph-sticky{margin-top:auto}

.hs-codebox{background:var(--surface); border:2px solid var(--line); border-radius:1em; padding:.6em 1em; margin-top:.8em; display:flex; flex-direction:column; align-items:center}
.hs-codebox span{font-size:.9em; color:var(--muted); font-weight:600}
.hs-codebox b{font-size:3em; letter-spacing:.2em; line-height:1.1; font-weight:800; color:var(--accent)}
.hs-gh{margin:.9em 0 .4em; font-size:1em; color:var(--accent)}
.ph-code{text-transform:uppercase; letter-spacing:.3em; text-align:center}

.hs-split{display:grid; grid-template-columns:minmax(0,1fr) 22em; gap:1.2em; align-items:start; flex:1}
.hs-focus{position:sticky; top:1em}
.hs-notes{margin:.3em 0 0; padding-left:1.2em; font-size:.95em}
.hs-notes li{margin:.3em 0}
.lb-row{cursor:pointer}
.lb-row.sel{background:var(--soft); border-radius:.5em}
.ph-notes{text-align:left}
.ph-notes ul{margin:0; padding-left:18px; font-size:15px}
.ph-notes li{margin:5px 0}
@media (max-width:900px){.hs-split{grid-template-columns:minmax(0,1fr)}}

.ph-opt .cur{font-style:normal; font-size:12px; color:var(--muted); font-weight:600}

.hs-chart{background:var(--surface); border:2px solid var(--line); border-radius:1em; padding:.8em 1em 1em; margin-top:1em}
.hs-chart h3{margin:0 0 .4em; font-size:1.2em}
.hs-chart svg{display:block; width:100%; height:auto; overflow:visible}
.ch-axis{font-size:15px; fill:var(--muted); font-family:inherit}
.ch-label{font-size:17px; font-weight:700; font-family:inherit}
.hs-legend{display:flex; flex-wrap:wrap; gap:.35em .5em; margin-top:.6em}
.hs-legend button{font:inherit; font-size:.9em; border:2px solid var(--line); background:var(--bg); color:var(--ink); border-radius:999px; padding:.15em .7em; cursor:pointer; display:inline-flex; align-items:center; gap:.4em}
.hs-legend button.on{border-color:var(--ink); font-weight:700}
.hs-legend i{width:.8em; height:.8em; border-radius:50%; display:inline-block}
.hs-foot{position:sticky; bottom:0; background:var(--bg); padding:.7em 0 .3em; z-index:5}

.confetti{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:60}
.confetti i,.confetti span{position:absolute; top:-6vh; animation-name:confall; animation-timing-function:linear; animation-fill-mode:both; border-radius:2px}
@keyframes confall{from{transform:translate3d(0,0,0) rotate(0deg); opacity:1} 85%{opacity:1} to{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot)); opacity:.9}}
.hs-stats{display:flex; flex-wrap:wrap; gap:.5em; margin-bottom:.8em}
.hs-stat{background:var(--surface); border:2px solid var(--line); border-radius:.7em; padding:.3em .8em; display:flex; flex-direction:column; line-height:1.15}
.hs-stat small{color:var(--muted); font-size:.75em}
.hs-stat b{font-size:1.05em}
.hs-table.recap td,.hs-table.recap th{text-align:left; white-space:nowrap; font-size:.85em}
.hs-table.recap td:last-child,.hs-table.recap th:last-child{min-width:0; white-space:nowrap}
.hs-table.recap td.yes{color:var(--mint); font-weight:700}
.hs-table.recap td.no{color:var(--muted)}

.hs-wrap{position:relative}
.hs-wrap.inside .hs{min-height:640px}
.hs-modal{position:fixed; inset:0; background:rgba(8,6,32,.78); display:grid; place-items:center; z-index:40; padding:1em}
.hs-modal.inside{position:absolute}
.hs-modal-card{background:var(--surface); border-radius:1.2em; padding:1em 2em 1.4em; text-align:center; width:min(94%, 34em); max-height:96%; overflow:auto; box-shadow:0 1em 3em rgba(0,0,0,.45)}
.hs-modal-card h2{margin:.1em 0 .4em; font-size:1.6em}
.wheel-box{position:relative; width:min(100%, 24em); margin:.3em auto .6em}
.wheel-spin{transition:transform 6s cubic-bezier(.12,.62,.12,1); will-change:transform}
.wheel-spin svg{display:block; width:100%; height:auto; filter:drop-shadow(0 .3em .5em rgba(0,0,0,.35))}
.wheel-pointer{position:absolute; top:-.55em; left:50%; transform:translateX(-50%); font-size:2.4em; line-height:1; color:var(--coral); text-shadow:0 2px 0 #fff}
.wheel-out{font-size:1.6em; font-weight:800; margin:.2em 0}
@media (prefers-reduced-motion:reduce){.wheel-spin{transition-duration:.01s}}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{padding:16px}
.pv-wrap{max-width:1300px;margin:0 auto}
.pv-wrap h1{font-size:26px;margin:0 0 4px;font-weight:800}
.pv-note{color:var(--muted);margin:0 0 14px;max-width:80ch}
.pv-tv{border:6px solid var(--ink);border-radius:14px;overflow:auto;height:min(78vh,720px);background:var(--bg)}
.pv-label{font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pv-add{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 14px;cursor:pointer}
.pv-phones{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px}
.pv-phone{flex:0 0 310px;height:600px;border:8px solid var(--ink);border-radius:30px;overflow:auto;background:var(--bg)}

.ph-opt .fx{display:flex;flex-direction:column;gap:3px;margin-top:6px;width:100%}.ph-opt .fx i{font-style:normal;font-size:12.5px;font-weight:600;line-height:1.3;padding:3px 6px;border-radius:8px;background:rgba(98,95,143,.10);color:var(--muted)}.ph-opt .fx i.up{background:rgba(20,168,126,.13);color:var(--mint)}.ph-opt .fx i.down{background:rgba(232,69,107,.11);color:var(--coral)}

</style>

<body>
<div id="ph"></div>
<script>
/* Life Choices: game engine (runs in the teacher's browser; the preview page runs it the same way) */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.LifeEngine = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  var YEARS = 5, TOTAL = 6, START_AGE = 18;

  /* Approximate typical annual pay, rounded (BLS national medians, with California minimum-wage floors). */
  var CAREERS = [
    { id: "doctor",      name: "Doctor",             icon: "🩺", pay: 140000, ramp: [0.15, 0.6] },
    { id: "lawyer",      name: "Lawyer",             icon: "⚖️", pay: 118000, ramp: [0.3, 0.85] },
    { id: "software",    name: "Software developer", icon: "💻", pay: 104000, ramp: [0.75] },
    { id: "analyst",     name: "Financial analyst",  icon: "📈", pay: 90000, ramp: [0.75] },
    { id: "nurse",       name: "Registered nurse",   icon: "🏥", pay: 82000, ramp: [0.75] },
    { id: "accountant",  name: "Accountant",         icon: "🧮", pay: 76000, ramp: [0.8] },
    { id: "police",      name: "Police officer",     icon: "🚓", pay: 72000 },
    { id: "teacher",     name: "Elementary teacher", icon: "🍎", pay: 68000, ramp: [0.75] },
    { id: "electrician", name: "Electrician",        icon: "⚡", pay: 66000 },
    { id: "firefighter", name: "Firefighter",        icon: "🚒", pay: 64000 },
    { id: "artist",      name: "Artist",             icon: "🎨", pay: 58000 },
    { id: "mechanic",    name: "Auto mechanic",      icon: "🔧", pay: 58000 },
    { id: "fastfood",    name: "Fast food worker",   icon: "🍔", pay: 52000 },
    { id: "retail",      name: "Retail salesperson", icon: "🛍️", pay: 50000 },
    { id: "entrepreneur", name: "Entrepreneur",      icon: "🌟", pay: 60000, ramp: [0.2, 0.25, 0.3, 2, 2], alwaysRamp: true, rampNote: "Startup years" }
  ];

  function usd(n) { var v = Math.round(Math.abs(n)); return (n < 0 && v > 0 ? "-" : "") + "$" + v.toLocaleString("en-US"); }

  function clean(s, max) { return String(s == null ? "" : s).replace(/[<>]/g, "").replace(/\s+/g, " ").trim().slice(0, max); }
  function rid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
  function careerById(id) { for (var i = 0; i < CAREERS.length; i++) if (CAREERS[i].id === id) return CAREERS[i]; return null; }
  function optionById(d, id) { var o = d.options || []; for (var i = 0; i < o.length; i++) if (o[i].id === id) return o[i]; return null; }

  var BOT_NAMES = ["Ava","Ben","Cora","Dev","Eli","Fay","Gus","Hana","Ivan","Jade","Kai","Lena","Milo","Nia","Omar","Pia","Quin","Remy","Sol","Tess","Uri","Vera","Wes","Xena","Yara","Zane"];

  function newPlayer(id, name, bot) {
    return { id: id, name: name, bot: !!bot, picks: {}, submitted: {}, auto: {}, ledger: [], history: [], scoreHistory: [], netWorth: 0, lifeValue: 0, otherPay: null, rank: 0, eliminated: null };
  }

  function createGame() {
    var S = { v: 1, phase: "lobby", round: 0, players: [], settings: JSON.parse(JSON.stringify(DEFAULTS)) };
    function bump() { S.v++; }
    function find(pid) { for (var i = 0; i < S.players.length; i++) if (S.players[i].id === pid) return S.players[i]; return null; }
    function roundDef(r) { return ROUNDS[r - 1] || { title: "", decisions: [] }; }

    /* ----- life state built from picks ----- */
    function lifeAt(p, upTo) {
      var life = { careerId: null, careerName: "Undecided", careerRound: null, college: false, marriedRound: null, kidsRound: null, plan: null, investing: false, screened: false, served: false, did: {}, effects: [] }, noSeen = {};

        roundDef(r).decisions.forEach(function (d) {

    }
    function basePay(p, life) {

    }
    function eligible(p, d, round) {

    function decisionsFor(p, round) {

    }

    /* ----- one round of math ----- */
    function computeRound(p, r) {
      var s = S.settings, life = lifeAt(p, r), B = basePay(p, life);
      var cr = life.careerId && life.careerId !== "other" ? careerById(life.careerId) : null;
      var mr = 1, mc = 1, mm = 1, mk = 1, start = null;
      if ((s.useRamp || (cr && cr.alwaysRamp)) && cr && cr.ramp && life.careerRound && cr.ramp[r - life.careerRound] !== undefined) mr = cr.ramp[r - life.careerRound];

      }
      var base5 = B * YEARS, a0 = base5 * mr, a = a0 * mc, b = a * mm, c = b * mk;

      /* pay effects from later choices: a first-round change and a boost that compounds each round after */
      var g = c, payLines = [];
      life.effects.forEach(function (x) {
        var e = x.e, m = 1;
        if (r === x.round && e.incomePct) m *= 1 + e.incomePct / 100;

        if (m !== 1) { payLines.push({ label: e.payNote || "Work choice", delta: g * (m - 1), m: m }); g *= m; }
      });
      var gross = g;
      var perYear = gross / YEARS;
      var tax = s.useTaxes ? annualTax(perYear) * YEARS : 0;
      var take = gross - tax;

      var live = s.livingCostPerYear * (r === 1 ? s.round1LivingPct / 100 : 1) * YEARS;
      var marrExtra = life.marriedRound && r >= life.marriedRound ? s.marriedExtraCostPerYear * YEARS : 0;
      var wedding = life.marriedRound === r ? s.weddingCost : 0;
      var kidsCost = life.kidsRound && r >= life.kidsRound ? s.kidsCostPerYear * YEARS : 0;
      var collegeCost = life.college && r === 1 ? s.collegeCost : 0;

      /* money and life value from later choices */
      var otherCost = 0, otherGain = 0, value = 0, investing = false, extraNotes = [];
      function money(n) { if (n >= 0) otherGain += n; else otherCost += -n; }
      if (r === 1 && !life.college && s.noCollegeBoost > 0) { money(s.noCollegeBoost); extraNotes.push("Head start without college: " + sgn(s.noCollegeBoost)); }
      if (cr && cr.id === "entrepreneur" && life.careerRound && r === life.careerRound + 3 && s.entrepreneurWindfall > 0) { money(s.entrepreneurWindfall); extraNotes.push("Business sale windfall: " + sgn(s.entrepreneurWindfall)); }
      if (life.careerRound === r && B <= s.lowIncomeLimit && s.lowIncomeBoost > 0) { money(s.lowIncomeBoost); extraNotes.push("Career launch fund: " + sgn(s.lowIncomeBoost)); }
      extraNotes.push("Living costs: " + usd(-(live / YEARS)) + " per year");
      if (marrExtra) extraNotes.push("Married household costs: " + usd(-s.marriedExtraCostPerYear) + " per year");
      if (kidsCost) extraNotes.push("Costs of raising kids: " + usd(-s.kidsCostPerYear) + " per year");
      /* health insurance and the accident */
      var insCost = 0, accident = 0;
      if (r >= 2) {
        var plan = life.plan || "basic";
        insCost = (plan === "premium" ? s.insPremiumPerYear : s.insBasicPerYear) * YEARS;
        extraNotes.push("Health insurance (" + (plan === "premium" ? "premium" : "cheap") + " plan): " + usd(-(insCost / YEARS)) + " per year");
        if (r === Math.round(s.accidentRound)) {
          var covered = s.insWaiting === "now" ? plan : (lifeAt(p, r - 1).plan || "basic");
          accident = covered === "premium" ? s.accidentPremium : s.accidentBasic;

        if (e.perYear) { money(e.perYear * YEARS); extraNotes.push((e.yearNote || e.note || "Choice") + ": " + sgn(e.perYear) + " per year"); }
        if (e.perRound) { money(e.perRound); extraNotes.push((e.gainNote || e.note || "Choice") + ": " + sgn(e.perRound)); }

      if (L.exp.college) out.push("College cost: " + usd(-L.exp.college));

    /* ----- picks ----- */

        else if (d.type === "choice") o[d.id] = d.options[Math.floor(Math.random() * d.options.length)].id;

        investBalance: prev ? (prev.investBalance || 0) : 0, value: 0, net: 0, payLines: [], impact: {}, mult: {}, base5: 0, exp: {},
        notes: ["🎡 Eliminated by the wheel in round " + p.eliminated + ". Score stays frozen."] };
    }
    function computeResults() {
      S.players.forEach(function (p) {

        p.ledger[S.round - 1] = L;

    }
    function score(p) { return p.netWorth + p.lifeValue; }

    }
    function choiceText(p, r) {

        } else if (d.type === "yesno" && k[d.id] !== undefined) {

    }

    /* ----- public API ----- */
    function addPlayer(id, nm, bot) { var p = newPlayer(id, nm, bot); S.players.push(p); bump(); return p; }
    function joinAs(hint, name) {

      if (same) {

<script>

        '<p class="muted">Total score</p><div class="ph-stat num" style="color:' + (view.score < 0 ? "var(--coral)" : "var(--mint)") + '">' + money(view.score) + '</div>' +
        (view.eliminated ? '<p class="muted">🎡 Eliminated in round ' + view.eliminated + '</p>' : '') +
        '<p class="muted">Net worth ' + money(view.netWorth) + (view.lifeValue ? ' · life value ' + money(view.lifeValue) : '') + '</p></div>' +
        ((view.notes && view.notes.length) ? '<div class="ph-card ph-notes"><div class="ph-q">What shaped your result</div><ul>' + view.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join("") + '</ul></div>' : "");
    }

    var confettiDone = false;
    function confetti() {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var wrap = document.createElement("div"); wrap.className = "confetti";
      var colors = ["#FFC933", "#34D3A0", "#FF6B8E", "#5CA9FF", "#9380FF", "#FF9F43"], i, el;
      for (i = 0; i < 70; i++) {
        el = document.createElement("i");
        el.style.left = (Math.random() * 100) + "%"; el.style.background = colors[i % colors.length];
        el.style.width = (6 + Math.random() * 6) + "px"; el.style.height = (9 + Math.random() * 9) + "px";
        el.style.animationDelay = (Math.random() * 1.2) + "s"; el.style.animationDuration = (3 + Math.random() * 2) + "s";
        el.style.setProperty("--dx", (Math.random() * 40 - 20) + "vw"); el.style.setProperty("--rot", (360 + Math.random() * 720) + "deg");
        wrap.appendChild(el);
      }
      document.body.appendChild(wrap);
      setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 8000);
    }
    function render() {
      var html;
      if (!pid || !view) html = pid ? '<div class="ph-center"><p class="muted">Loading…</p></div>' : joinScreen();
      else if (view.phase === "lobby") html = lobbyScreen();
      else if (view.phase === "wheel") html = view.eliminated ? eliminatedScreen() : wheelPhoneScreen();
      else if (view.eliminated && (view.phase === "choosing" || view.phase === "reveal")) html = eliminatedScreen();
      else if (view.phase === "choosing") {
        if (!view.decisions.length) html = noDecisionScreen();
        else html = (view.submitted || awaiting > Date.now()) && !editing ? lockedScreen() : formScreen();
      }
      else if (view.phase === "reveal") html = revealScreen();
      else html = resultsScreen(view.phase === "final");
      ph.innerHTML = html;
      if (view && view.phase === "final" && !confettiDone) { confettiDone = true; setTimeout(confetti, 300); }
      if (view && view.phase !== "final") confettiDone = false;
    }

    /* ---------- events ---------- */
    ph.addEventListener("input", function (e) {
      var t = e.target;
      if (t.id === "nm") { nameDraft = t.value; }
      else if (t.id === "oth") {
        draft.careerOther = t.value;
        var b = ph.querySelector("[data-lock]");
        if (b) b.disabled = !complete() || busy;
      }
    });
    ph.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target.id === "nm") { e.preventDefault(); join(); }
    });
    function join() {
      if (busy) return;
      var n = (nameDraft || "").trim();
      if (!n) { err = "Please type a name"; render(); return; }
      busy = true; err = ""; render();
      Promise.resolve(api.player.join(n, null)).then(function (r) {
        busy = false;
        if (r && r.error) { err = r.error; render(); return; }
        pid = r.pid; store.set("pid", pid); store.set("name", r.name);
        since = 0; lastJson = ""; render(); return fetchOnce();
      }).catch(function () { busy = false; err = "Could not reach the game. Check your Wi-Fi."; render(); });
    }
    ph.addEventListener("click", function (e) {
      var t = e.target.closest ? e.target.closest("button") : null;
      if (!t || t.disabled) return;
      if (t.hasAttribute("data-join")) { join(); return; }
      if (t.hasAttribute("data-career")) { draft.career = t.getAttribute("data-career"); render(); return; }
      if (t.hasAttribute("data-choice")) { draft[t.getAttribute("data-choice")] = t.getAttribute("data-val"); render(); return; }
      if (t.hasAttribute("data-yn")) { draft[t.getAttribute("data-yn")] = t.getAttribute("data-val") === "1"; render(); return; }
      if (t.hasAttribute("data-edit")) { editing = true; render(); return; }
      if (t.hasAttribute("data-lock")) {
        busy = true; err = ""; render();
        Promise.resolve(api.player.submit(pid, draft)).then(function (r) {
          busy = false;
          if (r && r.error) { err = r.error; if (r.error === "unknown") { pid = null; store.del("pid"); } render(); return; }
          editing = false; awaiting = Date.now() + 6000; since = 0; lastJson = ""; render();
          setTimeout(function () { if (!(view && view.submitted)) { awaiting = 0; render(); } }, 6200);
          return fetchOnce();
        }).catch(function () { busy = false; err = "Could not send. Try again."; render(); });
      }
    });

    render();
    if (pid) loop();
    else {
      /* start polling once joined */
      var iv = setInterval(function () { if (pid) { clearInterval(iv); loop(); } }, 400);
    }
  }

  root.LifePhone = { mount: mountPhone, localStore: localStore, memoryStore: memoryStore };

<script>
/* Seminary game framework: Firebase Realtime Database bridge (REST, no SDK). The teacher's page runs the game;
   phones send their name and picks to the database and read back their own private view. */
(function (root) {
  "use strict";

  function rid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function newCode() {
    var a = "ABCDEFGHJKLMNPQRSTUVWXYZ", c = "";
    for (var i = 0; i < 4; i++) c += a.charAt(Math.floor(Math.random() * a.length));
    return c;
  }
  function http(method, url, body) {
    var o = { method: method, cache: "no-store" };
    if (body !== undefined) { o.body = JSON.stringify(body); o.headers = { "Content-Type": "application/json" }; }
    return fetch(url, o).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  /* ---------------- teacher side ---------------- */
  function hostBridge(cfg) {
    var db = cfg.dbUrl.replace(/\/$/, "");
    var root0 = cfg.root || "lifeGames";
    var PFX = "life." + root0.replace(/[^A-Za-z0-9]/g, "_") + ".";
    var code = lsGet(PFX + "code") || newCode(); lsSet(PFX + "code", code);
    var game = root.LifeEngine.createGame();
    var meta = { aliases: {}, lastN: {}, handled: {} };
    var written = {};
    var stopped = false;

    function u(path) { return db + "/" + root0 + "/" + code + path + ".json"; }

    function load() {
      try {
        var snap = lsGet(PFX + "snap." + code);
        if (snap) game.restore(JSON.parse(snap));
        var m = lsGet(PFX + "meta." + code);
        if (m) meta = Object.assign(meta, JSON.parse(m));
      } catch (e) {}
    }
    function persist() {
      lsSet(PFX + "snap." + code, JSON.stringify(game.snapshot()));
      lsSet(PFX + "meta." + code, JSON.stringify(meta));
    }

    function writeError(pid, msg) {
      return http("PUT", u("/views/" + pid), { error: msg }).catch(function () {});
    }

    function writeViews() {
      var hv = game.hostView();
      var jobs = [];
      (hv.players || []).forEach(function (p) {
        var view = game.playerView(p.id);
        jobs.push(http("PUT", u("/views/" + p.id), view).catch(function () {}));
        Object.keys(meta.aliases).forEach(function (a) {
          if (meta.aliases[a] === p.id) jobs.push(http("PUT", u("/views/" + a), view).catch(function () {}));
        });
      });
      return Promise.all(jobs);
    }

    function tick() {
      if (stopped) return;
      Promise.all([http("GET", u("/in/joins")), http("GET", u("/in/picks"))]).then(function (r) {
        var joins = r[0] || {}, picks = r[1] || {}, pid;
        for (pid in joins) {
          if (meta.handled[pid]) continue;
          var j = joins[pid] || {};
          var name = String(j.name || "").trim().slice(0, 24) || "Player";
          var existing = null;
          var hv = game.hostView();
          (hv.players || []).forEach(function (p) { if (!existing && p.name === name && !p.bot) existing = p.id; });
          if (existing) {
            meta.aliases[pid] = existing;
          } else {
            var res = game.join(name, pid);
            if (res && res.error) { writeError(pid, res.error); meta.handled[pid] = true; continue; }
          }
          meta.handled[pid] = true;
        }
        for (pid in picks) {
          var pk = picks[pid];
          if (!pk || typeof pk.n !== "number") continue;
          if (meta.lastN[pid] === pk.n) continue;
          var realPid = meta.aliases[pid] || pid;
          game.submit(realPid, pk.picks);
          meta.lastN[pid] = pk.n;
        }
        persist();
        return writeViews();
      }).catch(function () {}).then(function () {
        if (!stopped) setTimeout(tick, 800);
      });
    }

    function beat() {
      if (stopped) return;
      http("PUT", u("/host"), { code: code, t: Date.now() }).catch(function () {}).then(function () {
        if (!stopped) setTimeout(beat, 4000);
      });
    }

    function newGame() {
      var oldSettings = null;
      try { oldSettings = game.hostView().settings; } catch (e) {}
      lsDel(PFX + "snap." + code); lsDel(PFX + "meta." + code);
      code = newCode(); lsSet(PFX + "code", code);
      game = root.LifeEngine.createGame();
      if (oldSettings) game.hostAct("settings", oldSettings);
      meta = { aliases: {}, lastN: {}, handled: {} }; written = {};
      persist();
      http("PUT", u("/host"), { code: code, t: Date.now() }).catch(function () {});
    }

    var api = { host: {
      state: function (since) {
        var v = game.version();
        if (since === v) return Promise.resolve({ v: v, same: true });
        return Promise.resolve({ v: v, view: game.hostView() });
      },
      act: function (action, payload) {
        if (action === "newgame") { newGame(); return Promise.resolve({ ok: true }); }
        var pids = [];
        if (action === "kick" && payload && payload.pid) {
          pids.push(payload.pid);
          Object.keys(meta.aliases).forEach(function (a) { if (meta.aliases[a] === payload.pid) pids.push(a); });
        }
        var r = game.hostAct(action, payload || {});
        if (r && r.error) return Promise.resolve(r);
        persist();
        var jobs = pids.map(function (pid) { return writeError(pid, "unknown"); });
        if (action === "reset") {
          jobs.push(http("DELETE", u("/in")).catch(function () {}));
          meta.lastN = {};
        }
        return Promise.all(jobs).then(writeViews).then(function () { return r; });
      }
    } };

    load();
    http("PUT", u("/host"), { code: code, t: Date.now() }).catch(function () {});
    tick(); beat();
    return {
      api: api,
      code: function () { return code; },
      joinUrl: function () { return location.origin + location.pathname.replace(/teacher\.html$/, "play.html") + "?g=" + code; },
      siteText: function () { return location.host; },
      stop: function () { stopped = true; }
    };
  }

  /* ---------------- phone side ---------------- */
  function normalize(v) {
    if (!v || v.error) return v;
    v.decisions = (v.decisions || []).map(function (d) {
      if (d.options) d.options = Array.isArray(d.options) ? d.options : Object.keys(d.options).map(function (k) { return d.options[k]; });
      return d;
    });
    if (!Array.isArray(v.decisions)) v.decisions = [];
    if (v.picks === undefined) v.picks = null;
    return v;
  }
  function playerApi(cfg, code) {
    var db = cfg.dbUrl.replace(/\/$/, ""), root0 = cfg.root || "lifeGames";
    function u(path) { return db + "/" + root0 + "/" + code + path + ".json"; }
    var lastRound = 0;
    function waitView(pid, tries) {
      return http("GET", u("/views/" + pid)).then(function (v) {
        if (v) { if (v.error) return { error: v.error }; return { pid: pid, name: v.name }; }
        if (tries <= 0) return { error: "The TV screen did not answer. Is it still open?" };
        return new Promise(function (res) { setTimeout(res, 700); }).then(function () { return waitView(pid, tries - 1); });
      });
    }
    return { player: {
      join: function (name, hint) {
        var pid = hint || rid();
        return http("GET", u("/host")).then(function (h) {
          if (!h) return { error: "Game not found. Check the code, and make sure the TV screen is open." };
          return http("PUT", u("/in/joins/" + pid), { name: name, t: Date.now() }).then(function () { return waitView(pid, 20); });
        });
      },
      state: function (pid) {
        return http("GET", u("/views/" + pid)).then(function (v) {
          if (!v) return { v: 0 };
          if (v.error) return { error: "unknown" };
          v = normalize(v); lastRound = v.round || 0;
          return { v: Date.now(), view: v };
        });
      },
      submit: function (pid, picks) {
        return http("PUT", u("/in/picks/" + pid), { n: Date.now(), round: lastRound, picks: picks }).then(function () { return { ok: true }; });
      }
    } };
  }

  root.LifeFirebase = { hostBridge: hostBridge, playerApi: playerApi };
})(typeof self !== "undefined" ? self : this);

</script>
<script>
(function(){
  var CFG = { dbUrl: "https://penny-project-fb5da-default-rtdb.firebaseio.com", root: "seminaryGames/lifechoices" };
  var code = (new URLSearchParams(location.search).get('g') || '').toUpperCase();

    store: LifePhone.localStore('life.' + "seminaryGames/lifechoices".replace(/[^A-Za-z0-9]/g,'_') + '.' + code + '.'),
    pollMs: 1200
  });
})();
