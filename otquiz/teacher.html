<style>
:root{
  --bg-page:#0E1B2B; --bg-panel:#16273B; --bg-panel-raised:#1E3450;
  --ink:#F1F6FB; --muted:#9FB4C9; --line:rgba(241,246,251,0.14);
  --accent:#4FA3D1; --accent-strong:#2E7CB0; --ok:#3FA66B; --bad:#C65B5B;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;background:var(--bg-page);color:var(--ink);
  font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 50px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
h1{font-family:'Fraunces',Georgia,serif;font-size:1.8rem;margin:0 0 6px;}
h2{font-family:'Fraunces',Georgia,serif;font-size:1.3rem;margin:0 0 10px;}
.card{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
.muted{color:var(--muted);font-size:0.92rem;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
input[type=text]{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);flex:1;min-width:160px;}
.btn{font:inherit;font-weight:700;padding:14px 20px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);cursor:pointer;}
.btn.primary{background:var(--accent);border-color:var(--accent-strong);color:#05131F;}
.btn.big{font-size:1.1rem;width:100%;padding:18px;}
.btn[disabled]{opacity:0.4;cursor:default;}
.qr-box{display:flex;justify-content:center;padding:18px;background:#fff;border-radius:14px;margin:14px 0;}
.code{font-family:'IBM Plex Mono',monospace;font-size:2.2rem;letter-spacing:0.15em;text-align:center;color:var(--accent);margin:8px 0;}
.tag{display:inline-block;background:var(--bg-panel-raised);border-radius:20px;padding:6px 14px;margin:4px;font-size:0.9rem;}
.lb{width:100%;border-collapse:collapse;margin-top:10px;}
.lb td,.lb th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:0.95rem;}
.lb th{color:var(--muted);font-weight:600;font-size:0.78rem;text-transform:uppercase;}
.q{font-size:1.4rem;line-height:1.4;margin:10px 0 18px;}
.verse{font-size:1.25rem;line-height:1.5;font-style:italic;margin:10px 0 6px;}
.ref{color:var(--muted);font-size:0.9rem;margin-bottom:16px;}
.ans{display:block;width:100%;text-align:left;font:inherit;font-size:1.05rem;padding:16px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);cursor:pointer;}
.ans.mine{border-color:var(--accent);background:rgba(79,163,209,0.18);}
.ans.correct{border-color:var(--ok);background:rgba(63,166,107,0.22);}
.ans.wrong{border-color:var(--bad);background:rgba(198,91,91,0.2);}
.ans[disabled]{cursor:default;}
.ph{text-align:center;padding:30px 10px;}
.ph .big{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
.ph .ans.t{background:rgba(63,166,107,0.18);border-color:var(--ok);}
.ph .ans.f{background:rgba(198,91,91,0.18);border-color:var(--bad);}
.timer{font-family:'IBM Plex Mono',monospace;font-size:0.95rem;color:var(--muted);margin-bottom:10px;}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:20px 0;}
.podium .spot{background:var(--bg-panel-raised);border-radius:10px 10px 0 0;padding:14px 16px;text-align:center;min-width:90px;}
.podium .spot.g1{min-height:120px;background:linear-gradient(180deg,#F0CB77,#C9A227);color:#2b2418;}
.podium .spot.g2{min-height:90px;}
.podium .spot.g3{min-height:70px;}
footer{text-align:center;color:var(--muted);font-size:0.8rem;margin-top:20px;}
.ctx{margin-top:14px;padding:14px 16px;border-left:4px solid var(--accent);background:rgba(79,163,209,0.12);border-radius:10px;text-align:left;}
.ctx .ctx-h{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
.ctx b{display:block;font-size:1.05rem;margin-bottom:6px;}
.ctx p{margin:0;line-height:1.55;font-size:0.98rem;}
.wrap{max-width:1400px;padding-left:28px;padding-right:28px}.lobby{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:22px;align-items:start}.lobby .qr-box{width:max-content;max-width:100%;margin:6px auto}.lobby .qr-box svg,.lobby .qr-box canvas,.lobby .qr-box img{width:240px!important;height:240px!important;display:block}@media (max-width:860px){.lobby{grid-template-columns:1fr}}</style>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;

tribes, and the Book of Mormon teaches that the Lord will gather them again."}, {"text": "The southern kingdom of Judah was conquered and carried away captive by Assyria.", "answer": false, "ref": "2 Kings 25", "expl": "Judah was conquered by Babylon, not Assyria, more than a century later.", "story": "The fall of Jerusalem (2 Kings 25)", "ctx": "Judah lasted over a century longer than the northern kingdom, but it too turned from the Lord despite Jeremiah\u2019s warnings. Nebuchadnezzar of Babylon besieged Jerusalem, burned the temple, and carried the people captive to Babylon around 586 BC. Lehi\u2019s family had left Jerusalem shortly before, warned by the Lord."}, {"text": "King Cyrus of Persia allowed the Jews to return to Jerusalem after the Babylonian captivity.", "answer": true, "ref": "Ezra 1", "expl": "Cyrus issued a decree letting the Jews return home and rebuild the temple.", "story": "Cyrus lets the Jews return (Isaiah 44 to 45; Ezra 1)", "ctx": "More than a century before he was born, Isaiah recorded the Lord calling Cyrus by name as His \u201cshepherd\u201d who would see that Jerusalem and the temple were rebuilt. Cyrus became king of Persia, conquered Babylon, and issued a decree letting the Jews return home to rebuild."}, {"text": "Jonah gladly obeyed the Lord's command to preach to Nineveh right away.", "answer": false, "ref": "Jonah 1", "expl": "Jonah fled toward Tarshish instead, and was swallowed by a great fish before he obeyed.", "story": "Jonah and Nineveh (Jonah 1 to 4)", "ctx": "The Lord sent Jonah to warn Nineveh, an enemy city, but he fled by ship toward Tarshish. In a storm he was thrown overboard and swallowed by a great fish, where he prayed for three days and three nights. When he finally preached, the whole city repented and was spared. Jonah was angry, admitting he had run because he knew the Lord would be merciful."}, {"text": "Esther risked her life by approaching the king uninvited to save her people.", "answer": true, "ref": "Esther 4-5", "expl": "Esther went to the king without being called, knowing it could cost her life.", "story": "Esther saves her people (Esther 4 to 8)", "ctx": "Haman got a decree to destroy every Jew in Persia. Mordecai urged Esther to plead with the king, reminding her she may have become queen \u201cfor such a time as this.\u201d Anyone who went to the king uninvited could be put to death, so Esther and her people fasted three days. She went in, the king held out his golden sceptre, and her people were saved."}, {"text": "Ruth was an Israelite woman who married Boaz, a Moabite.", "answer": false, "ref": "Ruth 1, 4", "expl": "It was the other way around: Ruth was the Moabite, and Boaz was the Israelite she married.", "story": "Ruth and Naomi (Ruth 1 to 4)", "ctx": "Ruth was a Moabite woman whose Israelite husband died. Instead of going home, she stayed loyal to her mother-in-law Naomi, saying \u201cwhither thou goest, I will go.\u201d In Bethlehem she gleaned grain in the fields of Boaz, a kind relative, who married her. Their great-grandson was King David."}, {"text": "Gideon reduced his army to just 300 men before defeating the Midianites.", "answer": true, "ref": "Judges 7", "expl": "The Lord had Gideon narrow his army to 300 so the victory would be clearly His doing.", "story": "Gideon\u2019s 300 (Judges 6 to 7)", "ctx": "The Midianites were oppressing Israel when an angel called Gideon to deliver them. The Lord told him his army of 32,000 was too large, so Israel would not think they had saved themselves. With just 300 men carrying trumpets and torches hidden in pitchers, Gideon surrounded the enemy camp at night, and the Midianites fled in confusion."}, {"text": "Samson lost his strength when his hair was cut off by his mother.", "answer": false, "ref": "Judges 16", "expl": "It was Delilah who had Samson's hair cut while he slept, not his mother.", "story": "Samson and Delilah (Judges 16)", "ctx": "Samson was a Nazarite from birth, and his great strength was tied to his vow never to cut his hair. The Philistines paid Delilah to learn his secret. When he finally told her, she had his hair shaved while he slept, and the Philistines captured and blinded him. In his last act, he prayed for strength and pulled down the pillars of a Philistine temple."}, {"text": "Elijah called down fire from heaven to prove the Lord is God, on Mount Carmel.", "answer": true, "ref": "1 Kings 18", "expl": "Fire fell and consumed Elijah's sacrifice, proving to Israel that the Lord is God.", "story": "Elijah and the priests of Baal (1 Kings 18)", "ctx": "During a long drought, Elijah challenged 450 prophets of Baal to a contest on Mount Carmel. Each side prepared a sacrifice and prayed for fire. Baal\u2019s prophets cried out all day with no answer. Elijah soaked his altar with water, prayed, and fire from heaven consumed everything, and the people cried, \u201cThe LORD, he is the God.\u201d"}, {"text": "Naaman was healed of leprosy by washing in the Euphrates River seven times.", "answer": false, "ref": "2 Kings 5", "expl": "Naaman washed in the Jordan River, not the Euphrates, and was healed.", "story": "Naaman healed (2 Kings 5)", "ctx": "Naaman was a Syrian army captain with leprosy. A captive Israelite servant girl told his wife about the prophet Elisha. Elisha sent word to wash seven times in the Jordan River, and Naaman was offended by the simple instruction. His servants persuaded him to obey, and his skin became like a little child\u2019s."}, {"text": "Hannah prayed for a son and later dedicated Samuel to serve the Lord at the tabernacle.", "answer": true, "ref": "1 Samuel 1", "expl": "Hannah kept her vow and brought young Samuel to serve under Eli the priest.", "story": "Hannah\u2019s prayer (1 Samuel 1)", "ctx": "Hannah had no children and prayed in deep sorrow at the tabernacle, promising that if the Lord gave her a son, she would give him to the Lord\u2019s service. She bore Samuel, and when he was weaned she brought him to serve with Eli the priest. Samuel grew up to be a great prophet."}, {"text": "David's first wife was Abigail.", "answer": false, "ref": "1 Samuel 18", "expl": "David's first wife was Michal, the daughter of King Saul; he married Abigail later.", "story": "David and Michal (1 Samuel 18 to 25)", "ctx": "After David killed Goliath, King Saul offered his daughter Michal in marriage, hoping David would die fighting the Philistines to earn her. David succeeded, and Michal loved him and later helped him escape Saul through a window. David married Abigail years later, after her husband Nabal died."}, {"text": "Job remained faithful to God despite losing his family, health, and possessions.", "answer": true, "ref": "Job 1-2", "expl": "Job did not curse God even after losing everything, and the Lord later blessed him.", "story": "The Lord answers Job (Job 38 to 42)", "ctx": "After many chapters of asking why he was suffering, Job heard the Lord speak out of a whirlwind. The Lord asked him a series of questions about the Creation to show how far His wisdom is above man\u2019s. Job humbled himself, prayed for his friends, and the Lord gave him twice as much as he had before."}, {"text": "The book of Esther never directly mentions the name of God.", "answer": true, "ref": "Esther", "expl": "Esther is well known as the one Old Testament book that never states God's name directly, though His hand is seen throughout.", "story": "The book of Esther", "ctx": "Esther tells how a Jewish queen saved her people from Haman\u2019s plot in Persia. God\u2019s name never appears in it, yet His hand is everywhere: Esther\u2019s timely rise to queen, the king\u2019s sleepless night, and Haman\u2019s plot turning back on himself. Jews still celebrate this deliverance at the feast of Purim."}, {"text": "Abraham was 100 years old when Isaac was born.", "answer": true, "ref": "Genesis 21:5", "expl": "Sarah was about ninety", "story": "The birth of Isaac (Genesis 18 and 21)", "ctx": "Three visitors told Abraham that Sarah would bear a son. Sarah, about ninety, laughed, and the Lord asked, \u201cIs any thing too hard for the LORD?\u201d A year later Isaac was born, whose name means \u201che laughs,\u201d and Sarah said, \u201cGod hath made me to laugh.\u201d"}, {"text": "Jacob worked a total of seven years to marry both Leah and Rachel.", "answer": false, "ref": "Genesis 29:20-30", "expl": "He served fourteen years in all", "story": "Jacob marries Leah and Rachel (Genesis 29)", "ctx": "Jacob loved Rachel and served her father Laban seven years to marry her, and the years \u201cseemed unto him but a few days.\u201d Laban secretly gave him Leah, the older daughter, instead. Jacob married Rachel a week later and served seven more years."}, {"text": "Esau sold his birthright for a bowl of pottage.", "answer": true, "ref": "Genesis 25:29-34", "expl": "He traded an eternal blessing for one meal", "story": "Esau sells his birthright (Genesis 25)", "ctx": "Esau, the firstborn twin, came in from the field faint with hunger and asked Jacob for some red pottage. Jacob asked for his birthright in exchange, and Esau traded it for one meal, saying, \u201cWhat profit shall this birthright do to me?\u201d The story warns against trading eternal blessings for short-term wants."}, {"text": "Jericho\u2019s walls fell after Israel marched around the city for seven days.", "answer": true, "ref": "Joshua 6:15-20", "expl": "On the seventh day they circled it seven times", "story": "The walls of Jericho (Joshua 6)", "ctx": "The Lord told Joshua to have Israel march around Jericho once a day for six days, with priests blowing rams\u2019 horn trumpets before the ark. On the seventh day they circled it seven times, the people shouted, and the walls fell down flat. Victory came by obedience, not by strength."}, {"text": "David defeated Goliath using King Saul\u2019s sword and armor.", "answer": false, "ref": "1 Samuel 17:38-40, 49", "expl": "He refused the armor and used a sling and a stone", "story": "David and Goliath (1 Samuel 17)", "ctx": "For forty days the giant Goliath defied Israel\u2019s army. Young David, who had killed a lion and a bear while protecting his sheep, refused King Saul\u2019s armor and faced him with a sling and five smooth stones, saying, \u201cThe battle is the LORD\u2019s.\u201d His first stone struck Goliath in the forehead."}, {"text": "Moses saw a bush that burned but was not consumed.", "answer": true, "ref": "Exodus 3:2", "expl": "The Lord called to him from the bush", "story": "The burning bush (Exodus 3)", "ctx": "Moses was tending sheep near Mount Horeb when he saw a bush burning with fire that was not consumed. The Lord called to him from the bush, told him to take off his shoes on holy ground, and sent him to deliver Israel from Egypt, promising, \u201cCertainly I will be with thee.\u201d"}, {"text": "The Lord confounded the people\u2019s language at the Tower of Babel.", "answer": true, "ref": "Genesis 11:7-9", "expl": "He scattered them across the earth", "story": "The Tower of Babel (Genesis 11; Ether 1)", "ctx": "After the Flood, people built a city and a tower meant to reach heaven so they could make a name for themselves. The Lord confounded their language and scattered them across the earth. The Book of Mormon adds that the brother of Jared prayed, and his family\u2019s language was not confounded as they left for the promised land."}, {"text": "Lot\u2019s wife became a pillar of salt when she looked back.", "answer": true, "ref": "Genesis 19:26", "expl": "Jesus said, \u201cRemember Lot\u2019s wife\u201d", "story": "Lot\u2019s wife (Genesis 19)", "ctx": "Angels led Lot and his family out of the wicked city of Sodom before it was destroyed and warned them not to look back. Lot\u2019s wife looked back and became a pillar of salt. Jesus later warned His disciples, \u201cRemember Lot\u2019s wife\u201d (Luke 17:32), a caution against longing for what we should leave behind."}, {"text": "Joseph told his brothers they should be angry with themselves for selling him.", "answer": false, "ref": "Genesis 45:5", "expl": "He told them not to be grieved, because God sent him to preserve life", "story": "Joseph forgives his brothers (Genesis 45)", "ctx": "Joseph could not hold back any longer and told his brothers, \u201cI am Joseph.\u201d They were terrified, but he wept, kissed them, and told them not to be angry with themselves, because \u201cGod did send me before you to preserve life.\u201d It is one of the greatest examples of forgiveness in scripture."}, {"text": "Gideon was threshing wheat by a winepress when an angel appeared to him.", "answer": true, "ref": "Judges 6:11", "expl": "He was hiding the wheat from the Midianites", "story": "Gideon\u2019s 300 (Judges 6 to 7)", "ctx": "The Midianites were oppressing Israel when an angel called Gideon to deliver them. The Lord told him his army of 32,000 was too large, so Israel would not think they had saved themselves. With just 300 men carrying trumpets and torches hidden in pitchers, Gideon surrounded the enemy camp at night, and the Midianites fled in confusion."}], "seconds": 20, "root": "seminaryGames/otquiz"};
var DB = "https://penny-project-fb5da-default-rtdb.firebaseio.com";
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function url(code, path){ return DB + '/' + CFG.root + '/' + code + (path ? '/' + path : '') + '.json'; }
function dbErr(r){ return r && typeof r === 'object' && typeof r.error === 'string' ? r.error : null; }
function jget(code, path){ return fetch(url(code, path), {cache:'no-store'}).then(function(r){ return r.json(); }).catch(function(){ return { error: 'network' }; }); }
function jput(code, path, v){ return fetch(url(code, path), {method:'PUT', body: JSON.stringify(v)}).then(function(r){ return r.json(); }).catch(function(){ return { error: 'network' }; }); }
function jpatch(code, path, v){ return fetch(url(code, path), {method:'PATCH', body: JSON.stringify(v)}).then(function(r){ return r.json(); }).catch(function(){ return { error: 'network' }; }); }
function dbErrorScreen(msg){
  return '<div class="card"><div class="eyebrow">Could not reach the database</div>' +
    '<p>'+esc(msg)+'</p>' +
    '<p class="muted">This usually means the Firebase Realtime Database rules need to allow read and write. In the Firebase console, go to Realtime Database, then Rules, and make sure they allow access (for example, <code>{"rules": {".read": true, ".write": true}}</code>), then reload this page.</p></div>';
}
function ranked(players){ var a=[]; for (var k in (players||{})) a.push({id:k, name:players[k].name, score:players[k].score||0}); a.sort(function(x,y){ return y.score-x.score || x.name.localeCompare(y.name); }); return a; }
function store(k, v){ try{ if (v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); }catch(e){ return null; } }
function ctxHtml(q){ if(!q||(!q.story&&!q.ctx)) return ''; return '<div class="ctx"><div class="ctx-h">The story</div>'+(q.story?'<b>'+esc(q.story)+'</b>':'')+(q.ctx?'<p>'+esc(q.ctx)+'</p>':'')+'</div>'; }
function mkCode(){ var L='ABCDEFGHJKLMNPQRSTUVWXYZ', c=''; for (var i=0;i<4;i++) c+=L[Math.floor(Math.random()*L.length)]; return c; }

(function(){
var app=document.getElementById('app'),Q=CFG.questions,ROUND_SIZE=Math.min(10,Q.length),code='',room=null,busy=false;
function joinUrl(){ return new URL('play.html?g='+code, location.href).href; }
function qr(t){ var q=qrcode(0,'M'); q.addData(t); q.make(); return q.createSvgTag({cellSize:4, margin:2, scalable:true}); }
var BK='bank_'+CFG.root, PICK=(function(){ try{ var v=localStorage.getItem(BK+'_n'); return v?(v==='all'?'all':parseInt(v,10)):10; }catch(e){ return 10; } })();
function shuf(a){ for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pickSet(n, mark){ var N=Q.length, used=[], all=[], i; n=(n==='all')?N:Math.min(n,N);
  try{ used=JSON.parse(localStorage.getItem(BK+'_used')||'[]'); }catch(e){}
  for (i=0;i<N;i++) all.push(i);
  var out=shuf(all.filter(function(x){ return used.indexOf(x)<0; })).slice(0,n);
  if (out.length<n){ used=[]; out=out.concat(shuf(all.filter(function(x){ return out.indexOf(x)<0; })).slice(0,n-out.length)); }
  if (mark){ try{ localStorage.setItem(BK+'_used', JSON.stringify(used.concat(out))); }catch(e){} }
  return out; }
function countCard(){ var N=Q.length, opts=[5,10,15].filter(function(x){ return x<N; }); opts.push('all');
  return '<div class="card"><h2>How many questions?</h2><div class="row">'+opts.map(function(o){ var sel=(o===PICK)||(o==='all'&&(PICK==='all'||PICK>=N));
    return '<button class="btn'+(sel?' primary':'')+'" data-a="count" data-n="'+o+'">'+(o==='all'?'All '+N:o)+'</button>'; }).join(' ')+
    '</div><div class="muted" style="margin-top:8px">Drawn at random from a bank of '+N+'. Questions used in recent games are saved for later, so the next game starts with fresh ones.</div></div>'; }
function newGame(){ code=mkCode(); return jput(code,'',{meta:{phase:'lobby', q:0, t0:0, limit:CFG.seconds, created:Date.now(), title:CFG.title, qids:pickSet(ROUND_SIZE)}}); }
function lb(players, n){ var r=ranked(players).slice(0, n||10), h='<table class="lb"><tr><th>#</th><th>Name</th><th>Score</th></tr>'; r.forEach(function(p,i){ h+='<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+p.score+'</td></tr>'; }); return h+'</table>'; }
function count(){ var m=room.meta, a=(room.ans||{})[m.q]||{}; return Object.keys(a).length; }

function qHtml(q){
  if (CFG.kind==='match') return '<div class="eyebrow">Which prophet said or wrote this?</div><div class="verse">&ldquo;'+esc(q.text)+'&rdquo;</div><div class="ref">Reference hidden until the reveal</div>';
  return '<div class="eyebrow">True or false</div><div class="q">'+esc(q.text)+'</div>';
}

function render(){
  if (!room) return;
  if (room.error){ app.innerHTML = dbErrorScreen(room.error); return; }
  var m=room.meta;
  if (!m){ app.innerHTML = dbErrorScreen('The game database returned an unexpected reply.'); return; }
  var pl=room.players||{}, np=Object.keys(pl).length, h='';
  if (m.phase==='lobby'){
    h='<div class="eyebrow">'+esc(CFG.title)+'</div><h1>Scan to join on your phone</h1><div class="lobby"><div>'+
      '<div class="card"><div class="qr-box">'+qr(joinUrl())+'</div><div class="code">'+code+'</div><div class="muted" style="text-align:center">or go to the play page and enter this code</div></div>'+'</div><div>'+
      '<div class="card"><h2>Players ('+np+')</h2><div>'+(np?ranked(pl).map(function(p){ return '<span class="tag">'+esc(p.name)+'</span>'; }).join(''):'<span class="muted">Waiting for players to join...</span>')+'</div></div>'+
      countCard()+
      '<button class="btn primary big" data-a="start"'+(np?'':' disabled')+'>Start Game</button></div></div>';
  } else if (m.phase==='question'){
    var q=Q[m.qids[m.q]], answered=count();
    h='<div class="muted">Question '+(m.q+1)+' of '+m.qids.length+'</div><div class="card">'+qHtml(q)+
      '<div class="muted">'+answered+' of '+np+' have answered</div></div>'+
      '<button class="btn primary big" data-a="reveal">Reveal answer</button>';
  } else if (m.phase==='reveal'){
    var q=Q[m.qids[m.q]];
    var correctLabel = CFG.kind==='match' ? q.options[q.answer] : (q.answer ? 'True' : 'False');
    h='<div class="muted">Question '+(m.q+1)+' of '+m.qids.length+'</div><div class="card">'+qHtml(q)+
      '<div class="card" style="background:var(--bg-panel-raised)"><b>'+esc(q.ref)+'</b><br>Correct answer: <b>'+esc(correctLabel)+'</b><br><span class="muted">'+esc(q.expl)+'</span></div>'+ctxHtml(q)+'</div>'+
      '<div class="card"><h2>Leaderboard</h2>'+lb(pl, 5)+'</div>'+
      '<button class="btn primary big" data-a="next">'+(m.q+1>=m.qids.length ? 'Show final results' : 'Next question')+'</button>';
  } else if (m.phase==='final'){
    var r=ranked(pl);
    h='<h1>Final Results</h1><div class="podium">'+
      (r[1]?('<div class="spot g2"><b>'+esc(r[1].name)+'</b><br>'+r[1].score+'</div>'):'')+
      (r[0]?('<div class="spot g1"><b>'+esc(r[0].name)+'</b><br>'+r[0].score+'</div>'):'<div class="muted">No players</div>')+
      (r[2]?('<div class="spot g3"><b>'+esc(r[2].name)+'</b><br>'+r[2].score+'</div>'):'')+
      '</div><div class="card"><h2>Full leaderboard</h2>'+lb(pl, 30)+'</div>'+
      '<button class="btn primary big" data-a="again">Play again (new code)</button>';
  }
  app.innerHTML=h;
}

function poll(){
  if (busy || !code) return;
  busy=true;
  jget(code,'').then(function(d){ busy=false; if (d){ room=d; render(); } });
}

function reveal(){
  var m=room.meta, qi=m.q, q=Q[m.qids[qi]], ans=(room.ans||{})[qi]||{}, pl=room.players||{}, upd={};
  for (var pid in ans){
    var a=ans[pid], ok = CFG.kind==='match' ? (a.i===q.answer) : (a.i===(q.answer?0:1));
    if (ok){
      var elapsedFrac = Math.max(0, Math.min(1, (a.t - m.t0) / (CFG.seconds*1000)));
      var pts = Math.round(1000 - elapsedFrac*400);
      upd['players/'+pid+'/score'] = (pl[pid]?(pl[pid].score||0):0) + pts;
    }
  }
  upd['meta/phase']='reveal';
  jpatch(code,'',upd).then(function(){ poll(); });
}

app.addEventListener('click', function(e){
  var b=e.target.closest('[data-a]'); if (!b) return; var a=b.getAttribute('data-a');
  if (a==='start') jpatch(code,'meta',{phase:'question', q:0, t0:Date.now(), qids:pickSet(PICK,true)}).then(poll);
  else if (a==='count'){ var v=b.getAttribute('data-n'); PICK=v==='all'?'all':parseInt(v,10); try{ localStorage.setItem(BK+'_n',String(PICK)); }catch(e){} render(); }
  else if (a==='reveal') reveal();
  else if (a==='next'){ var m=room.meta; if (m.q+1>=m.qids.length) jpatch(code,'meta',{phase:'final'}).then(poll); else jpatch(code,'meta',{phase:'question', q:m.q+1, t0:Date.now()}).then(poll); }
  else if (a==='again') newGame().then(poll);
});

newGame().then(function(d){
  var e = dbErr(d);
  if (e){ room = { error: e }; render(); return; }
  poll(); setInterval(poll, 1500);
});
})();

<script>
/* No-phone team mode: runs the quiz on one screen for teams. The teacher marks which teams got it right, then reveals the answer and its story. Uses this page's question bank (CFG). */
(function () {
  if (typeof CFG === 'undefined' || !CFG.questions) return;
  var Q = CFG.questions, KIND = CFG.kind, COLORS = ['#F0545C', '#3E8EF7', '#1FB5A8', '#F4B740', '#8B7CF6', '#E57AC2'];
  var S = { teams: [], scores: [], ids: [], i: 0, got: {}, revealed: false, timer: null, left: 0, paused: false, secs: 30 };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function shuf(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function draw(n) {
    var key = 'tm_used_' + CFG.title, used = [], all = Q.map(function (_, i) { return i; });
    try { used = JSON.parse(store(key) || '[]'); } catch (e) {}
    n = n === 'all' ? Q.length : Math.min(n, Q.length);
    var out = shuf(all.filter(function (x) { return used.indexOf(x) < 0; })).slice(0, n);
    if (out.length < n) { used = []; out = out.concat(shuf(all.filter(function (x) { return out.indexOf(x) < 0; })).slice(0, n - out.length)); }
    store(key, JSON.stringify(used.concat(out))); return out;
  }
  function opts(q) { if (KIND === 'tf') return ['True', 'False']; if (KIND === 'order') return q.shown.map(function (i) { return q.items[i]; }); return q.options || []; }
  function right(q) { return KIND === 'tf' ? (q.answer ? 0 : 1) : q.answer; }

  var css = document.createElement('style');
  css.textContent = [
    '#tmToggle{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:60;display:flex;gap:4px;background:rgba(13,21,40,.92);border:1px solid rgba(160,185,230,.25);border-radius:999px;padding:4px;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.3)}',
    '#tmToggle button{all:unset;cursor:pointer;color:#A3B2CE;font-weight:800;font-size:13px;padding:7px 12px;border-radius:999px}',
    '#tmToggle button[aria-pressed="true"]{background:#EEF3FB;color:#0D1528}#tmToggle button:focus-visible{outline:3px solid #fff}',
    'body.tm-on>*:not(#tmRoot):not(#tmToggle){display:none!important}body.tm-on{background:#0D1528}',
    '#tmRoot{display:none;min-height:100vh;background:#0D1528;color:#EEF3FB;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5;padding:calc(64px + env(safe-area-inset-top,0px)) 20px 40px}',
    'body.tm-on #tmRoot{display:block}#tmRoot *{box-sizing:border-box}',
    '#tmRoot .w{max-width:1400px;margin:0 auto}#tmRoot h1{font-family:Fraunces,Georgia,serif;font-size:2rem;margin:0 0 6px}#tmRoot h2{font-size:1.15rem;margin:0 0 10px}',
    '#tmRoot .sub{color:#A3B2CE;margin:0 0 18px}#tmRoot .card{background:#152039;border:1px solid rgba(160,185,230,.16);border-radius:16px;padding:18px;margin-bottom:14px}',
    '#tmRoot .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#tmRoot label{font-weight:700;color:#A3B2CE;font-size:.9rem;display:block;margin:10px 0 6px}',
    '#tmRoot input[type=text]{font:inherit;background:#1B2846;color:#EEF3FB;border:1px solid rgba(160,185,230,.25);border-radius:10px;padding:9px 12px;min-width:150px;flex:1}',
    '#tmRoot .b{font:inherit;font-weight:800;cursor:pointer;border-radius:999px;padding:10px 16px;border:1px solid rgba(160,185,230,.25);background:#1B2846;color:#EEF3FB}',
    '#tmRoot .b.on{background:#EEF3FB;color:#0D1528}#tmRoot .b.go{background:#1FB5A8;border-color:#1FB5A8;color:#062a27}#tmRoot .b.big{font-size:1.1rem;padding:14px 22px}',
    '#tmRoot .b:focus-visible{outline:3px solid #fff;outline-offset:2px}',
    '#tmRoot .score{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}#tmRoot .chip{flex:1 1 140px;background:#152039;border-radius:12px;padding:8px 12px;border-top:5px solid var(--c)}',
    '#tmRoot .chip .n{font-size:.85rem;color:#A3B2CE}#tmRoot .chip .s{font-size:1.7rem;font-weight:800}',
    '#tmRoot .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:#A3B2CE;margin-bottom:8px}',
    '#tmRoot .clock{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.6rem;font-weight:700;color:#F4B740}#tmRoot .clock.out{color:#F0545C}',
    '#tmRoot .eyebrow{color:#1FB5A8;font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}',
    '#tmRoot .q{font-size:1.7rem;line-height:1.35;margin:8px 0 16px}#tmRoot .verse{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.7rem;line-height:1.4;margin:8px 0 16px}',
    '#tmRoot .emoji{font-size:4rem;letter-spacing:.12em;margin:8px 0 16px}',
    '#tmRoot .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}',
    '#tmRoot .opt{display:flex;gap:12px;align-items:center;background:#1B2846;border:2px solid rgba(160,185,230,.18);border-radius:14px;padding:14px 16px;font-size:1.2rem;font-weight:600}',
    '#tmRoot .opt i{font-style:normal;font-weight:800;color:#F4B740;min-width:1.4em}#tmRoot .opt.ok{border-color:#3FA66B;background:rgba(63,166,107,.18)}#tmRoot .opt.dim{opacity:.45}',
    '#tmRoot .who{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}#tmRoot .who .b{border-left:6px solid var(--c)}#tmRoot .who .b.got{background:#3FA66B;border-color:#3FA66B;color:#fff}',
    '#tmRoot .ans{border-left:4px solid #F4B740;padding:10px 14px;background:rgba(244,183,64,.08);border-radius:10px;margin:14px 0}',
    '#tmRoot .ctx{border-left:4px solid #1FB5A8;padding:12px 14px;background:rgba(31,181,168,.10);border-radius:10px;margin:12px 0}#tmRoot .ctx b{display:block;margin-bottom:4px}#tmRoot .ctx p{margin:0}',
    '#tmRoot .order li{margin:4px 0}#tmRoot .when{margin-left:8px;color:#F4B740;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.85rem}',
    '#tmRoot .eras{width:100%;height:auto;margin-top:8px}#tmRoot .stand{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(160,185,230,.16);font-size:1.2rem}',
    '#tmRoot .keys{color:#A3B2CE;font-size:.85rem;margin-top:10px}'
  ].join('\n');
  document.head.appendChild(css);

  var root = document.createElement('div'); root.id = 'tmRoot'; root.setAttribute('aria-live', 'polite'); document.body.appendChild(root);
  var tg = document.createElement('div'); tg.id = 'tmToggle'; tg.setAttribute('role', 'group'); tg.setAttribute('aria-label', 'How students play');
  tg.innerHTML = '<button type="button" data-m="phones" aria-pressed="true">📱 Phones</button><button type="button" data-m="teams" aria-pressed="false">👥 Teams, no phones</button>';
  document.body.appendChild(tg);
  tg.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) mode(b.getAttribute('data-m')); });
  function mode(m) {
    [].forEach.call(tg.querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-m') === m)); });
    document.body.classList.toggle('tm-on', m === 'teams'); stopClock();
    if (m === 'teams' && !S.started) setup(); window.scrollTo(0, 0);
  }

  function setup() {
    var n = parseInt(store('tm_n') || '3', 10), qn = store('tm_q') || '10', secs = store('tm_s') || String(CFG.seconds || 30);
    var names = []; try { names = JSON.parse(store('tm_names') || '[]'); } catch (e) {}
    var counts = [5, 10, 15].filter(function (x) { return x < Q.length; }).concat(['all']);
    root.innerHTML = '<div class="w"><h1>' + esc(CFG.title) + '</h1><p class="sub">Team mode: no phones needed. Teams answer out loud or on paper, you mark who got it right, then reveal the answer and the story behind it.</p>' +
      '<div class="card"><h2>Teams</h2><div class="row" id="tmN">' + [2, 3, 4, 5, 6].map(function (k) { return '<button class="b' + (k === n ? ' on' : '') + '" data-n="' + k + '">' + k + ' teams</button>'; }).join('') + '</div>' +
      '<div class="row" id="tmNames" style="margin-top:12px"></div></div>' +
      '<div class="card"><h2>Game</h2><label>Questions (drawn at random from ' + Q.length + ')</label><div class="row" id="tmQ">' + counts.map(function (c) { return '<button class="b' + (String(c) === qn ? ' on' : '') + '" data-q="' + c + '">' + (c === 'all' ? 'All ' + Q.length : c) + '</button>'; }).join('') + '</div>' +
      '<label>Timer per question</label><div class="row" id="tmS">' + ['0', '20', '30', '45', '60'].map(function (c) { return '<button class="b' + (c === secs ? ' on' : '') + '" data-s="' + c + '">' + (c === '0' ? 'Off' : c + ' sec') + '</button>'; }).join('') + '</div></div>' +
      '<button class="b go big" id="tmStart">Start team game</button></div>';
    function names_() { var box = root.querySelector('#tmNames'), old = [].map.call(box.querySelectorAll('input'), function (i) { return i.value; });
      box.innerHTML = ''; for (var i = 0; i < n; i++) { var v = old[i] || names[i] || ('Team ' + (i + 1)); box.insertAdjacentHTML('beforeend', '<input type="text" maxlength="24" aria-label="Name for team ' + (i + 1) + '" style="border-left:6px solid ' + COLORS[i] + '" value="' + esc(v) + '">'); } }
    names_();
    root.querySelector('#tmN').onclick = function (e) { var b = e.target.closest('[data-n]'); if (!b) return; n = +b.getAttribute('data-n'); [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); }); names_(); };
    root.querySelector('#tmQ').onclick = function (e) { var b = e.target.closest('[data-q]'); if (!b) return; qn = b.getAttribute('data-q'); [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); }); };
    root.querySelector('#tmS').onclick = function (e) { var b = e.target.closest('[data-s]'); if (!b) return; secs = b.getAttribute('data-s'); [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); }); };
    root.querySelector('#tmStart').onclick = function () {
      S.teams = [].map.call(root.querySelectorAll('#tmNames input'), function (x, i) { return x.value.trim() || ('Team ' + (i + 1)); });
      store('tm_n', String(n)); store('tm_q', qn); store('tm_s', secs); store('tm_names', JSON.stringify(S.teams));
      S.scores = S.teams.map(function () { return 0; }); S.ids = draw(qn === 'all' ? 'all' : parseInt(qn, 10)); S.i = 0; S.secs = parseInt(secs, 10); S.started = true; question();
    };
  }
  function scoreBar() { return '<div class="score">' + S.teams.map(function (t, i) { return '<div class="chip" style="--c:' + COLORS[i] + '"><div class="n">' + esc(t) + '</div><div class="s">' + S.scores[i] + '</div></div>'; }).join('') + '</div>'; }
  function question() {
    S.got = {}; S.revealed = false; S.left = S.secs; S.paused = false; render();
    stopClock(); if (S.secs > 0) S.timer = setInterval(function () { if (S.paused || S.revealed) return; S.left--; paintClock(); if (S.left <= 0) stopClock(); }, 1000);
  }
  function stopClock() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
  function paintClock() { var c = root.querySelector('.clock'); if (!c) return; c.textContent = S.left > 0 ? (S.paused ? 'Paused ' : '') + S.left + 's' : 'Time!'; c.classList.toggle('out', S.left <= 0); }
  function render() {
    var q = Q[S.ids[S.i]], o = opts(q), r = right(q), rv = S.revealed, h = '<div class="w">' + scoreBar();
    h += '<div class="meta"><span>Question ' + (S.i + 1) + ' of ' + S.ids.length + '</span>' + (S.secs > 0 ? '<span class="row"><span class="clock"></span><button class="b" id="tmPause">' + (S.paused ? 'Resume' : 'Pause') + '</button><button class="b" id="tmMore">+10 sec</button></span>' : '') + '</div>';
    h += '<div class="card"><div class="eyebrow">' + esc(q.round || q.prompt || (KIND === 'tf' ? 'True or false' : KIND === 'order' ? 'Put these in order' : (KIND === 'match' ? 'Who said or wrote this?' : 'Question'))) + '</div>';
    if (q.emoji) h += '<div class="emoji">' + esc(q.emoji) + '</div>';
    if (q.verse) h += '<div class="verse">“' + esc(q.verse) + '”</div>';
    if (q.text) h += '<div class="' + (KIND === 'match' ? 'verse' : 'q') + '">' + (KIND === 'match' ? '“' + esc(q.text) + '”' : esc(q.text)) + '</div>';
    h += '<div class="opts">' + o.map(function (t, k) { var cls = 'opt' + (rv && KIND !== 'order' ? (k === r ? ' ok' : ' dim') : ''); return '<div class="' + cls + '"><i>' + 'ABCDEF'[k] + '</i>' + esc(t) + '</div>'; }).join('') + '</div>';
    if (rv) {
      var label = KIND === 'order' ? '' : '<b>Answer: ' + esc(o[r]) + '</b>';
      h += '<div class="ans">' + label + (q.ref ? (label ? ' &nbsp;' : '') + '<span style="color:#A3B2CE">' + esc(q.ref) + '</span>' : '') + (q.expl ? '<div style="margin-top:4px">' + esc(q.expl) + '</div>' : '') + '</div>';
      if (KIND === 'order') h += '<ol class="order">' + q.items.map(function (it, k) { return '<li>' + esc(it) + (q.dates ? '<span class="when">' + esc(q.dates[k]) + '</span>' : '') + '</li>'; }).join('') + '</ol>' + (typeof eraSvg === 'function' && q.years ? eraSvg(q, false) : '');
      if (q.story || q.ctx) h += '<div class="ctx"><b>' + esc(q.story || '') + '</b><p>' + esc(q.ctx || '') + '</p></div>';
    }
    h += '<h2 style="margin-top:16px">Who got it right? <span class="sub" style="font-weight:400;font-size:.9rem">tap to give a point, tap again to take it back</span></h2><div class="who">' +
      S.teams.map(function (t, i) { return '<button class="b' + (S.got[i] ? ' got' : '') + '" style="--c:' + COLORS[i] + '" data-t="' + i + '">' + (S.got[i] ? '✓ ' : '') + esc(t) + '</button>'; }).join('') + '</div>';
    h += '<div class="row" style="margin-top:14px">' + (rv ? '' : '<button class="b go big" id="tmReveal">Reveal answer</button>') + '<button class="b' + (rv ? ' go' : '') + ' big" id="tmNext">' + (S.i + 1 >= S.ids.length ? 'Final standings' : 'Next question') + '</button></div>';
    h += '<p class="keys">Keyboard: Space pauses the timer, R reveals, N goes to the next question.</p></div></div>';
    root.innerHTML = h; paintClock(); bind();
  }
  function bind() {
    var x;
    if ((x = root.querySelector('#tmPause'))) x.onclick = togglePause;
    if ((x = root.querySelector('#tmMore'))) x.onclick = function () { S.left = Math.max(S.left, 0) + 10; if (!S.timer && S.secs > 0) S.timer = setInterval(function () { if (S.paused || S.revealed) return; S.left--; paintClock(); if (S.left <= 0) stopClock(); }, 1000); paintClock(); };
    if ((x = root.querySelector('#tmReveal'))) x.onclick = reveal;
    root.querySelector('#tmNext').onclick = next;
    root.querySelector('.who').onclick = function (e) { var b = e.target.closest('[data-t]'); if (!b) return; var t = +b.getAttribute('data-t');
      S.got[t] = !S.got[t]; S.scores[t] += S.got[t] ? 1 : -1; var keep = S.paused; render(); S.paused = keep; };
  }
  function togglePause() { S.paused = !S.paused; var b = root.querySelector('#tmPause'); if (b) b.textContent = S.paused ? 'Resume' : 'Pause'; paintClock(); }
  function reveal() { if (S.revealed) return; S.revealed = true; stopClock(); render(); }
  function next() { stopClock(); if (S.i + 1 >= S.ids.length) return final(); S.i++; question(); }
  function final() {
    var order = S.teams.map(function (t, i) { return i; }).sort(function (a, b) { return S.scores[b] - S.scores[a]; });
    root.innerHTML = '<div class="w"><h1>Final standings</h1><div class="card">' + order.map(function (i, k) { return '<div class="stand"><span>' + (k + 1) + '. ' + esc(S.teams[i]) + '</span><b>' + S.scores[i] + '</b></div>'; }).join('') + '</div>' +
      '<div class="row"><button class="b go big" id="tmAgain">Play again</button><button class="b big" id="tmSetup">Change teams</button></div></div>';
    root.querySelector('#tmAgain').onclick = function () { S.scores = S.teams.map(function () { return 0; }); S.ids = draw(S.ids.length); S.i = 0; question(); };
    root.querySelector('#tmSetup').onclick = function () { S.started = false; setup(); };
  }
  document.addEventListener('keydown', function (e) {
    if (!document.body.classList.contains('tm-on') || !S.started || /input|textarea/i.test((e.target && e.target.tagName) || '') || !root.querySelector('#tmNext')) return;
    if (e.key === ' ') { e.preventDefault(); if (S.secs > 0 && !S.revealed) togglePause(); }
    else if (e.key === 'r' || e.key === 'R') reveal(); else if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') next();
  });
  if (/[?&]mode=teams/.test(location.search)) mode('teams');
})();

</script>
