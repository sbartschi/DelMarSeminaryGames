<script>var CFG={"title": "Match the Prophet: Round 2", "kind": "mc", "seconds": 25, "questions": [{"options": ["Ezekiel", "Isaiah", "Jeremiah", "Hosea"], "answer": 1, "ref": "Isaiah 9:6", "expl": "Isaiah gave these names for the Savior about 700 years before His birth", "verse": "For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.", "prompt": "Who said or wrote this?", "story": "Isaiah’s prophecy of the Messiah (Isaiah 9)", "ctx": "Isaiah prophesied about 700 years before the Savior’s birth, when Judah faced threats from Assyria. Amid warnings, he looked ahead to a child born to rule with peace and justice forever. The titles Wonderful, Counsellor, the mighty God, the everlasting Father, and the Prince of Peace all describe Jesus Christ."}, {"options": ["David", "Hosea", "Isaiah", "Jeremiah"], "answer": 3, "ref": "Jeremiah 31:33", "expl": "Jeremiah prophesied of a new covenant written in the heart", "verse": "But this shall be the covenant that I will make with the house of Israel; After those days, saith the LORD, I will put my law in their inward parts, and write it in their hearts; and will be their God, and they shall be my people.", "prompt": "Who said or wrote this?", "story": "The new covenant (Jeremiah 31)", "ctx": "Jeremiah lived as Judah was being conquered and carried away. Even while warning of destruction, he prophesied of a day when the Lord would gather Israel and make a new covenant with them, written not on stone tablets but in their hearts."}, {"options": ["Ezekiel", "Micah", "Zechariah", "Jeremiah"], "answer": 0, "ref": "Ezekiel 37:16-17", "expl": "Latter-day Saints see the stick of Judah as the Bible and the stick of Joseph as the Book of Mormon", "verse": "Moreover, thou son of man, take thee one stick, and write upon it, For Judah, and for the children of Israel his companions: then take another stick, and write upon it, For Joseph, the stick of Ephraim, and for all the house of Israel his companions: And join them one to another into one stick; and they shall become one in thine hand.", "prompt": "Who said or wrote this?", "story": "The two sticks (Ezekiel 37)", "ctx": "Right after the vision of the dry bones, the Lord told Ezekiel to take one stick for Judah and one for Joseph and join them in his hand. Latter-day Saints understand the stick of Judah as the Bible and the stick of Joseph as the Book of Mormon, which now testify together of Jesus Christ."}, {"options": ["Joel", "Amos", "Daniel", "Ezekiel"], "answer": 0, "ref": "Joel 2:28", "expl": "Moroni quoted this prophecy to Joseph Smith in 1823 (Joseph Smith, History 1:41)", "verse": "And it shall come to pass afterward, that I will pour out my spirit upon all flesh; and your sons and your daughters shall prophesy, your old men shall dream dreams, your young men shall see visions:", "prompt": "Who said or wrote this?", "story": "Joel’s prophecy of the Spirit (Joel 2)", "ctx": "Joel prophesied after a terrible plague of locusts, calling Israel to repent with fasting and weeping. He promised that in the last days the Lord would pour out His Spirit on all flesh. Peter quoted this on the day of Pentecost (Acts 2), and Moroni quoted it to Joseph Smith, saying it was soon to be fulfilled."}, {"options": ["Daniel", "Micah", "Amos", "Zechariah"], "answer": 1, "ref": "Micah 6:8", "expl": "Micah summed up what the Lord asks of each of us", "verse": "He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?", "prompt": "Who said or wrote this?", "story": "What the Lord requires (Micah 6)", "ctx": "Micah prophesied in Judah around the same time as Isaiah. In this chapter the people ask whether the Lord wants thousands of rams or rivers of oil as offerings. The answer is no: what He truly wants is for us to do justly, love mercy, and walk humbly with Him."}, {"options": ["Malachi", "Micah", "Ezekiel", "David"], "answer": 0, "ref": "Malachi 4:5-6", "expl": "Elijah came to the Kirtland Temple in 1836 to restore the sealing power (D&C 110:13-16)", "verse": "And he shall turn the heart of the fathers to the children, and the heart of the children to their fathers, lest I come and smite the earth with a curse.", "prompt": "Who said or wrote this?", "story": "Elijah’s promised return (Malachi 4)", "ctx": "In the last verses of the Old Testament, Malachi promised the Lord would send Elijah before His Second Coming to turn the hearts of the fathers and children to each other. Moroni quoted these verses to Joseph Smith in 1823, and Elijah came to the Kirtland Temple in 1836 to restore the sealing power that binds families forever (D&C 110)."}, {"options": ["Ezekiel", "Amos", "Zechariah", "Job"], "answer": 3, "ref": "Job 19:25", "expl": "In the middle of his suffering, Job testified of his Redeemer", "verse": "For I know that my redeemer liveth, and that he shall stand at the latter day upon the earth:", "prompt": "Who said or wrote this?", "story": "Job’s testimony (Job 19)", "ctx": "Job had lost his children, wealth, and health, and his friends insisted he must be suffering for secret sins. Feeling abandoned, Job still bore powerful testimony that his Redeemer lives and that he would see God in the flesh, a witness of the Resurrection."}, {"options": ["David", "Jeremiah", "Malachi", "Job"], "answer": 0, "ref": "Psalm 23:1", "expl": "Psalm 23 is \"A Psalm of David\"", "verse": "The LORD is my shepherd; I shall not want.", "prompt": "Who said or wrote this?", "story": "The Shepherd’s psalm (Psalm 23)", "ctx": "David was a shepherd before he became king, protecting his father’s flocks from lions and bears. In this psalm he describes the Lord as a shepherd who leads, feeds, restores, and protects His sheep, even through the valley of the shadow of death."}, {"options": ["Ezekiel", "Daniel", "Micah", "Job"], "answer": 1, "ref": "Daniel 2:44", "expl": "Daniel interpreted the stone that would fill the earth as God's everlasting kingdom", "verse": "And in the days of these kings shall the God of heaven set up a kingdom, which shall never be destroyed: and the kingdom shall not be left to other people, but it shall break in pieces and consume all these kingdoms, and it shall stand for ever.", "prompt": "Who said or wrote this?", "story": "Nebuchadnezzar’s dream (Daniel 2)", "ctx": "King Nebuchadnezzar demanded that his wise men tell him both his dream and its meaning, or die. Daniel and his friends prayed, and God revealed it. The great image stood for kingdoms that would rise and fall, and the stone cut out without hands stood for God’s kingdom in the last days, which would fill the whole earth."}, {"options": ["Daniel", "Ezekiel", "Amos", "Zechariah"], "answer": 3, "ref": "Zechariah 9:9", "expl": "Fulfilled when Jesus rode into Jerusalem on a colt (Matthew 21:5)", "verse": "Rejoice greatly, O daughter of Zion; shout, O daughter of Jerusalem: behold, thy King cometh unto thee: he is just, and having salvation; lowly, and riding upon an ass, and upon a colt the foal of an ass.", "prompt": "Who said or wrote this?", "story": "The King on a donkey (Zechariah 9)", "ctx": "Zechariah prophesied to the Jews rebuilding the temple after the exile. He foresaw their King coming to Jerusalem humbly, riding on a donkey’s colt. About 500 years later, Jesus fulfilled this at His triumphal entry, as crowds spread branches and cried “Hosanna” (Matthew 21:5)."}, {"options": ["Solomon", "David", "Isaiah", "Jeremiah"], "answer": 1, "ref": "Psalm 51:10", "expl": "David’s prayer of repentance", "verse": "Create in me a clean heart, O God; and renew a right spirit within me.", "prompt": "Who said or wrote this?", "story": "David’s prayer of repentance (Psalm 51)", "ctx": "David wrote this psalm after the prophet Nathan confronted him about his sin with Bathsheba. He pleads, “Create in me a clean heart, O God,” and teaches that God desires “a broken and a contrite heart.” The resurrected Savior asked the Nephites for this same sacrifice (3 Nephi 9:20)."}, {"options": ["Solomon (the Preacher)", "Malachi", "David", "Job"], "answer": 0, "ref": "Ecclesiastes 12:13", "expl": "The Preacher’s conclusion after searching for meaning", "verse": "Fear God, and keep his commandments: for this is the whole duty of man.", "prompt": "Who said or wrote this?", "story": "The whole duty of man (Ecclesiastes 12)", "ctx": "After exploring wealth, pleasure, work, and wisdom and calling them all vanity on their own, the Preacher reaches his conclusion: “Fear God, and keep his commandments: for this is the whole duty of man.” The same chapter begins, “Remember now thy Creator in the days of thy youth.”"}, {"options": ["Micah", "Zechariah", "Jeremiah", "Isaiah"], "answer": 3, "ref": "Isaiah 53:4", "expl": "One of the clearest prophecies of the Atonement", "verse": "Surely he hath borne our griefs, and carried our sorrows.", "prompt": "Who said or wrote this?", "story": "The suffering servant (Isaiah 53)", "ctx": "Isaiah 53 describes a servant who would be despised and rejected, wounded for our transgressions and bruised for our iniquities. Written centuries before Christ, it is one of the clearest Old Testament prophecies of the Savior’s Atonement. Abinadi quoted it to King Noah’s priests (Mosiah 14)."}, {"options": ["Ezekiel", "Isaiah", "Micah", "Daniel"], "answer": 1, "ref": "Isaiah 2:2", "expl": "Latter-day Saints see this fulfilled in temples", "verse": "The mountain of the LORD’s house shall be established in the top of the mountains, and all nations shall flow unto it.", "prompt": "Who said or wrote this?", "story": "The mountain of the Lord’s house (Isaiah 2)", "ctx": "Isaiah saw that in the last days “the mountain of the LORD’s house” would be established in the top of the mountains, and all nations would flow unto it to learn His ways. Latter-day Saints see this fulfilled in temples, including the Salt Lake Temple in the Rocky Mountains. Nephi quoted this chapter in 2 Nephi 12."}, {"options": ["Jeremiah", "Hosea", "Isaiah", "Ezekiel"], "answer": 0, "ref": "Jeremiah 18:6", "expl": "The Lord taught Jeremiah at the potter’s house", "verse": "As the clay is in the potter’s hand, so are ye in mine hand, O house of Israel.", "prompt": "Who said or wrote this?", "story": "The potter and the clay (Jeremiah 18)", "ctx": "The Lord sent Jeremiah to a potter’s house, where he watched a clay vessel get marred and reshaped into something new. The Lord taught that Israel was like clay in His hands: if they repented, He could reshape them. God can remake our lives when we let Him."}, {"options": ["Jeremiah", "Joel", "Ezekiel", "Amos"], "answer": 0, "ref": "Jeremiah 16:16", "expl": "A prophecy of gathering scattered Israel", "verse": "Behold, I will send for many fishers, saith the LORD, and they shall fish them; and after will I send for many hunters.", "prompt": "Who said or wrote this?", "story": "Fishers and hunters (Jeremiah 16)", "ctx": "Jeremiah prophesied that the Lord would gather scattered Israel from the north country and all the lands where they had been driven. He would send “many fishers” and “many hunters” to find them. Latter-day Saints see missionaries as those fishers and hunters, gathering Israel today."}, {"options": ["Daniel", "Isaiah", "Jeremiah", "Ezekiel"], "answer": 3, "ref": "Ezekiel 3:17", "expl": "Ezekiel’s calling to warn the people", "verse": "Son of man, I have made thee a watchman unto the house of Israel.", "prompt": "Who said or wrote this?", "story": "Ezekiel the watchman (Ezekiel 3)", "ctx": "Ezekiel was called as a prophet to the Jews in exile in Babylon. The Lord compared him to a watchman on a city wall whose job is to warn of approaching danger. If he warned the people and they ignored him, he was free of blame; if he stayed silent, he would be accountable. Modern prophets serve as watchmen in the same way."}, {"options": ["Joel", "Hosea", "Micah", "Amos"], "answer": 3, "ref": "Amos 8:11", "expl": "Fulfilled in the Great Apostasy", "verse": "I will send a famine in the land, not a famine of bread, nor a thirst for water, but of hearing the words of the LORD.", "prompt": "Who said or wrote this?", "story": "A famine of the word (Amos 8)", "ctx": "Amos warned of a coming famine, not of bread or water, but of hearing the words of the Lord, when people would search everywhere and not find it. Latter-day Saints see this fulfilled in the Great Apostasy after the deaths of the Apostles, a famine ended by the Restoration."}, {"options": ["Micah", "Malachi", "Zechariah", "Isaiah"], "answer": 0, "ref": "Micah 5:2", "expl": "Quoted to King Herod when the wise men came", "verse": "But thou, Beth-lehem Ephratah, though thou be little among the thousands of Judah, yet out of thee shall he come forth.", "prompt": "Who said or wrote this?", "story": "Bethlehem foretold (Micah 5)", "ctx": "Micah prophesied that a ruler of Israel, “whose goings forth have been from of old, from everlasting,” would come out of little Bethlehem. Centuries later, when the wise men asked where the King of the Jews would be born, the chief priests quoted this verse to King Herod (Matthew 2:5-6)."}, {"options": ["Amos", "Haggai", "Zechariah", "Malachi"], "answer": 3, "ref": "Malachi 3:8", "expl": "Malachi’s teaching on tithing", "verse": "Will a man rob God? Yet ye have robbed me. But ye say, Wherein have we robbed thee? In tithes and offerings.", "prompt": "Who said or wrote this?", "story": "Malachi on tithing (Malachi 3)", "ctx": "Malachi was the last prophet of the Old Testament. The Lord asked, “Will a man rob God?” and explained the people robbed Him in tithes and offerings. He promised that if they brought their tithes into the storehouse, He would open the windows of heaven. The Savior later taught these same words to the Nephites (3 Nephi 24)."}, {"options": ["Job", "David", "Jeremiah", "Jonah"], "answer": 1, "ref": "Psalm 22:1", "expl": "Jesus repeated these words on the cross", "verse": "My God, my God, why hast thou forsaken me?", "prompt": "Who said or wrote this?", "story": "My God, my God (Psalm 22)", "ctx": "Psalm 22 opens with the cry Jesus repeated on the cross, “My God, my God, why hast thou forsaken me?” The psalm also describes hands and feet being pierced and lots being cast for clothing, details fulfilled at the Crucifixion about a thousand years after David wrote it."}], "root": "seminaryGames/prophets2", "intro": "Passages from Job through Malachi, shown without the reference. Pick who said or wrote it", "round": 10, "banked": true};

    var q = Q[S.ids[S.i]], o = opts(q), r = right(q), rv = S.revealed, h = '<div class="w">' + scoreBar();
    h += '<div class="meta"><span>Question ' + (S.i + 1) + ' of ' + S.ids.length + '</span>' + (S.secs > 0 ? '<span class="row"><span class="clock"></span><button class="b" id="tmPause">' + (S.paused ? 'Resume' : 'Pause') + '</button><button class="b" id="tmMore">+10 sec</button></span>' : '') + '</div>';
    h += '<div class="card"><div class="eyebrow">' + esc(q.round || q.prompt || (KIND === 'tf' ? 'True or false' : KIND === 'order' ? 'Put these in order' : (KIND === 'match' ? 'Who said or wrote this?' : 'Question'))) + '</div>';
    if (q.emoji) h += '<div class="emoji">' + esc(q.emoji) + '</div>';
    if (q.verse) h += '<div class="verse">“' + esc(q.verse) + '”</div>';
    if (q.text) h += '<div class="' + (KIND === 'match' ? 'verse' : 'q') + '">' + (KIND === 'match' ? '“' + esc(q.text) + '”' : esc(q.text)) + '</div>';
    h += '<div class="opts">' + o.map(function (t, k) { var cls = 'opt' + (rv && KIND !== 'order' ? (k === r ? ' ok' : ' dim') : ''); return '<div class="' + cls + '"><i>' + 'ABCDEF'[k] + '</i>' + esc(t) + '</div>'; }).join('') + '</div>';
    if (rv) {
      var label = KIND === 'order' ? '' : '<b>Answer: ' + esc(o[r]) + '</b>';
      h += '<div class="ans">' + label + (q.ref ? (label ? ' &nbsp;' : '') + '<span style="color:#A3B2CE">' + esc(q.ref) + '</span>' : '') + (q.expl ? '<div style="margin-top:4px">' + esc(q.expl) + '</div>' : '') + '</div>';
      if (KIND === 'order') h += '<ol class="order">' + q.items.map(function (it, k) { return '<li>' + esc(it) + (q.dates ? '<span class="when">' + esc(q.dates[k]) + '</span>' : '') + '</li>'; }).join('') + '</ol>' + (typeof eraSvg === 'function' && q.years ? eraSvg(q, false) : '');
      if (q.story || q.ctx) h += '<div class="ctx"><b>' + esc(q.story || '') + '</b><p>' + esc(q.ctx || '') + '</p></div>';
    }
    h += '<h2 style="margin-top:16px">Who got it right? <span class="sub" style="font-weight:400;font-size:.9rem">tap to give a point, tap again to take it back</span></h2><div class="who">' +
      S.teams.map(function (t, i) { return '<button class="b' + (S.got[i] ? ' got' : '') + '" style="--c:' + COLORS[i] + '" data-t="' + i + '">' + (S.got[i] ? '✓ ' : '') + esc(t) + '</button>'; }).join('') + '</div>';
    h += '<div class="row" style="margin-top:14px">' + (rv ? '' : '<button class="b go big" id="tmReveal">Reveal answer</button>') + '<button class="b' + (rv ? ' go' : '') + ' big" id="tmNext">' + (S.i + 1 >= S.ids.length ? 'Final standings' : 'Next question') + '</button></div>';
    h += '<p class="keys">Keyboard: Space pauses the timer, R reveals, N goes to the next question.</p></div></div>';
    root.innerHTML = h; paintClock(); bind();
  }
  function bind() {
    var x;
    if ((x = root.querySelector('#tmPause'))) x.onclick = togglePause;
    if ((x = root.querySelector('#tmMore'))) x.onclick = function () { S.left = Math.max(S.left, 0) + 10; if (!S.timer && S.secs > 0) S.timer = setInterval(function () { if (S.paused || S.revealed) return; S.left--; paintClock(); if (S.left <= 0) stopClock(); }, 1000); paintClock(); };
    if ((x = root.querySelector('#tmReveal'))) x.onclick = reveal;
    root.querySelector('#tmNext').onclick = next;
    root.querySelector('.who').onclick = function (e) { var b = e.target.closest('[data-t]'); if (!b) return; var t = +b.getAttribute('data-t');
      S.got[t] = !S.got[t]; S.scores[t] += S.got[t] ? 1 : -1; var keep = S.paused; render(); S.paused = keep; };
  }
  function togglePause() { S.paused = !S.paused; var b = root.querySelector('#tmPause'); if (b) b.textContent = S.paused ? 'Resume' : 'Pause'; paintClock(); }
  function reveal() { if (S.revealed) return; S.revealed = true; stopClock(); render(); }
  function next() { stopClock(); if (S.i + 1 >= S.ids.length) return final(); S.i++; question(); }
  function final() {
    var order = S.teams.map(function (t, i) { return i; }).sort(function (a, b) { return S.scores[b] - S.scores[a]; });
    root.innerHTML = '<div class="w"><h1>Final standings</h1><div class="card">' + order.map(function (i, k) { return '<div class="stand"><span>' + (k + 1) + '. ' + esc(S.teams[i]) + '</span><b>' + S.scores[i] + '</b></div>'; }).join('') + '</div>' +
      '<div class="row"><button class="b go big" id="tmAgain">Play again</button><button class="b big" id="tmSetup">Change teams</button></div></div>';
    root.querySelector('#tmAgain').onclick = function () { S.scores = S.teams.map(function () { return 0; }); S.ids = draw(S.ids.length); S.i = 0; question(); };
    root.querySelector('#tmSetup').onclick = function () { S.started = false; setup(); };
  }
  document.addEventListener('keydown', function (e) {
    if (!document.body.classList.contains('tm-on') || !S.started || /input|textarea/i.test((e.target && e.target.tagName) || '') || !root.querySelector('#tmNext')) return;
    if (e.key === ' ') { e.preventDefault(); if (S.secs > 0 && !S.revealed) togglePause(); }
    else if (e.key === 'r' || e.key === 'R') reveal(); else if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') next();
  });
  if (/[?&]mode=teams/.test(location.search)) mode('teams');
})();

</script>
</body></html>
