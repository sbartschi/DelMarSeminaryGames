<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practice mode: Seminary Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#0D1528;--panel:#152039;--panel2:#1B2846;--line:rgba(160,185,230,.16);--ink:#EEF3FB;--soft:#A3B2CE;--teal:#1FB5A8;--amber:#F4B740;--coral:#F0545C;color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--ink);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
a{color:inherit}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.back{text-decoration:none;font-weight:700;color:var(--soft)}
.title{font-family:Fraunces,Georgia,serif;font-size:1.35rem;margin:0}
.pill{background:var(--amber);color:#2a1d00;font-weight:800;font-size:.8rem;padding:4px 12px;border-radius:999px}
.spacer{flex:1}
.btn{font:inherit;font-weight:800;cursor:pointer;border-radius:999px;padding:9px 16px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);text-decoration:none;font-size:.92rem}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#062a27}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.guide{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;padding:14px 22px;border-bottom:1px solid var(--line)}
.guide ol{margin:0;padding-left:20px;color:var(--soft)}
.guide li{margin:2px 0}.guide b{color:var(--ink)}
.note{font-size:.88rem;color:var(--soft);max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:18px 22px 40px;align-items:start}
.label{font-weight:800;font-size:.85rem;color:var(--soft);margin:0 0 6px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.tv{background:#000;border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.tv iframe{display:block;width:100%;height:78vh;min-height:560px;border:0;background:#fff}
.phones{display:grid;grid-template-columns:repeat(2,330px);gap:14px}
.phone{background:#05080f;border-radius:30px;padding:10px;border:2px solid var(--line);box-shadow:0 14px 30px rgba(0,0,0,.4)}
.phone iframe{display:block;width:310px;height:620px;border:0;border-radius:22px;background:#fff}
.x{all:unset;cursor:pointer;color:var(--soft);font-weight:800;padding:0 6px}
.wait{color:var(--soft);font-size:.92rem;max-width:330px}
@media (max-width:1180px){.stage{grid-template-columns:1fr}.phones{grid-template-columns:repeat(auto-fill,330px)}.guide{grid-template-columns:1fr}}
</style>
</head>

  add.onclick = addPhone;

  if (G.phone && !G.needsCode) { addPhone(); addPhone(); }
  if (!G.phone) document.querySelector('.stage').style.gridTemplateColumns = '1fr';
  sync();
})();
</script>
</body>
