.center{text-align:center;}

<script>var CFG={"title": "True or False: Prophets Edition", "kind": "tf", "seconds": 20, "questions": [{"text": "Isaiah saw the Lord sitting upon a throne in the year that King Uzziah died.", "answer": true, "ref": "Isaiah 6:1", "expl": "Isaiah's great vision and call happened \"in the year that king Uzziah died\"", "story": "Isaiah’s call to be a prophet (Isaiah 6)", "ctx": "In the year King Uzziah died, Isaiah saw the Lord on His throne surrounded by seraphim. Feeling unworthy, he cried that he was “a man of unclean lips,” but a seraph touched his lips with a live coal from the altar and his sin was purged. When the Lord asked, “Whom shall I send?” Isaiah answered, “Here am I; send me.”"}, {"text": "When the Lord asked \"Whom shall I send?\", Isaiah asked Him to send someone else.", "answer": false, "ref": "Isaiah 6:8", "expl": "Isaiah answered, \"Here am I; send me\"", "story": "Isaiah’s call to be a prophet (Isaiah 6)", "ctx": "In the year King Uzziah died, Isaiah saw the Lord on His throne surrounded by seraphim. Feeling unworthy, he cried that he was “a man of unclean lips,” but a seraph touched his lips with a live coal from the altar and his sin was purged. When the Lord asked, “Whom shall I send?” Isaiah answered, “Here am I; send me.”"}, {"text": "When the Assyrians surrounded Jerusalem in Hezekiah's day, the angel of the Lord smote 185,000 in the Assyrian camp.", "answer": true, "ref": "Isaiah 37:36", "expl": "The Lord delivered Jerusalem after Hezekiah prayed and Isaiah prophesied", "story": "The Lord saves Jerusalem from Assyria (Isaiah 36 to 37)", "ctx": "The Assyrian army of King Sennacherib surrounded Jerusalem and mocked Judah’s God. King Hezekiah spread the threatening letter before the Lord in the temple and prayed, and Isaiah promised the city would be spared. That night the angel of the Lord smote the Assyrian camp, and Sennacherib went home."}, {"text": "Isaiah mentioned King Cyrus of Persia by name long before Cyrus let the Jews go home.", "answer": true, "ref": "Isaiah 44:28; 45:1", "expl": "Isaiah prophesied that Cyrus would say to Jerusalem, \"Thou shalt be built\"", "story": "Cyrus lets the Jews return (Isaiah 44 to 45; Ezra 1)", "ctx": "More than a century before he was born, Isaiah recorded the Lord calling Cyrus by name as His “shepherd” who would see that Jerusalem and the temple were rebuilt. Cyrus became king of Persia, conquered Babylon, and issued a decree letting the Jews return home to rebuild."}, {"text": "Jeremiah began prophesying only after the Jews had returned from Babylon.", "answer": false, "ref": "Jeremiah 1:1-3", "expl": "Jeremiah prophesied from the days of King Josiah until Jerusalem was carried away captive", "story": "The call of Jeremiah (Jeremiah 1)", "ctx": "The Lord told Jeremiah that He knew him and ordained him a prophet before he was born. Jeremiah protested that he was only a child and could not speak. The Lord touched his mouth, put His words there, and told him not to be afraid. Jeremiah prophesied for about forty years, in the same era as Lehi."}, {"text": "Daniel and his friends asked to eat the king's meat and drink the king's wine.", "answer": false, "ref": "Daniel 1:8, 12", "expl": "They asked for pulse to eat and water to drink, and after ten days they looked healthier than the others", "story": "Daniel’s food test (Daniel 1)", "ctx": "Daniel and three friends were young Jewish captives chosen for training in the Babylonian king’s court. Rather than defile themselves with the king’s food and wine, they asked to eat pulse (vegetables) and drink water for ten days. At the end they were healthier than the others, and God gave them knowledge and wisdom."}, {"text": "King Nebuchadnezzar commanded that the furnace be heated seven times more than usual.", "answer": true, "ref": "Daniel 3:19", "expl": "Even so, Shadrach, Meshach, and Abed-nego came out without the smell of fire on them", "story": "The fiery furnace (Daniel 3)", "ctx": "King Nebuchadnezzar set up a golden image and commanded everyone to bow to it or be thrown into a burning fiery furnace, heated seven times hotter than usual. Shadrach, Meshach, and Abed-nego refused, saying God could deliver them, “but if not,” they still would not bow. The king saw a fourth person in the fire, and they came out without even the smell of fire on them."}, {"text": "Ezekiel saw a valley full of golden statues come to life.", "answer": false, "ref": "Ezekiel 37:1-10", "expl": "He saw a valley full of dry bones receive sinews, flesh, and breath", "story": "The valley of dry bones (Ezekiel 37)", "ctx": "In vision, the Lord set Ezekiel in a valley full of very dry bones and asked, “Can these bones live?” As Ezekiel prophesied, the bones came together, received flesh, and were filled with breath. The Lord explained it represented the house of Israel being gathered and given new life, and it also points to the Resurrection."}, {"text": "Esther became queen of Persia during the reign of King Ahasuerus.", "answer": true, "ref": "Esther 2:17", "expl": "Ahasuerus set the royal crown on Esther's head and made her queen instead of Vashti", "story": "Esther becomes queen (Esther 2)", "ctx": "After Queen Vashti refused the king’s command, King Ahasuerus searched the kingdom for a new queen. Esther, a Jewish orphan raised by her cousin Mordecai, was chosen and crowned. On Mordecai’s advice, she did not reveal at first that she was Jewish."}, {"text": "Nehemiah and the people took seven years to rebuild the wall of Jerusalem.", "answer": false, "ref": "Nehemiah 6:15", "expl": "The wall was finished in fifty and two days", "story": "Rebuilding the wall (Nehemiah 4 to 6)", "ctx": "As Nehemiah’s workers rebuilt Jerusalem’s walls, enemies mocked them and plotted to attack. Nehemiah set guards and had the builders carry weapons as they worked. When his enemies tried four times to lure him away to harm him, he answered, “I am doing a great work, so that I cannot come down.” The wall was finished in 52 days."}, {"text": "The people of Nineveh believed God, proclaimed a fast, and put on sackcloth after Jonah's warning.", "answer": true, "ref": "Jonah 3:5", "expl": "From the greatest to the least, the people repented", "story": "Jonah and Nineveh (Jonah 1 to 4)", "ctx": "The Lord sent Jonah to warn Nineveh, an enemy city, but he fled by ship toward Tarshish. In a storm he was thrown overboard and swallowed by a great fish, where he prayed for three days and three nights. When he finally preached, the whole city repented and was spared. Jonah was angry, admitting he had run because he knew the Lord would be merciful."}, {"text": "Malachi taught that people rob God when they fail to offer lambs for sacrifice.", "answer": false, "ref": "Malachi 3:8", "expl": "The Lord said they robbed Him \"in tithes and offerings\"", "story": "Malachi on tithing (Malachi 3)", "ctx": "Malachi was the last prophet of the Old Testament. The Lord asked, “Will a man rob God?” and explained the people robbed Him in tithes and offerings. He promised that if they brought their tithes into the storehouse, He would open the windows of heaven. The Savior later taught these same words to the Nephites (3 Nephi 24)."}, {"text": "Jonah was in the belly of the fish three days and three nights.", "answer": true, "ref": "Jonah 1:17", "expl": "Then he prayed unto the Lord from the fish’s belly", "story": "Jonah and Nineveh (Jonah 1 to 4)", "ctx": "The Lord sent Jonah to warn Nineveh, an enemy city, but he fled by ship toward Tarshish. In a storm he was thrown overboard and swallowed by a great fish, where he prayed for three days and three nights. When he finally preached, the whole city repented and was spared. Jonah was angry, admitting he had run because he knew the Lord would be merciful."}, {"text": "The people of Nineveh refused to repent, so the city was destroyed.", "answer": false, "ref": "Jonah 3:10", "expl": "They repented, and God spared the city", "story": "Jonah and Nineveh (Jonah 1 to 4)", "ctx": "The Lord sent Jonah to warn Nineveh, an enemy city, but he fled by ship toward Tarshish. In a storm he was thrown overboard and swallowed by a great fish, where he prayed for three days and three nights. When he finally preached, the whole city repented and was spared. Jonah was angry, admitting he had run because he knew the Lord would be merciful."}, {"text": "Jeremiah was lowered into a dungeon and sank in the mire.", "answer": true, "ref": "Jeremiah 38:6", "expl": "Ebed-melech later rescued him", "story": "Jeremiah in the dungeon (Jeremiah 38)", "ctx": "During the Babylonian siege, Jeremiah warned that Jerusalem would fall and urged surrender. Angry princes lowered him into a muddy dungeon to die. Ebed-melech, an Ethiopian servant in the king’s house, got permission to rescue him with cords and old rags."}, {"text": "Daniel was thrown into the lions’ den by King Nebuchadnezzar.", "answer": false, "ref": "Daniel 6:16", "expl": "It happened under King Darius", "story": "Daniel in the lions’ den (Daniel 6)", "ctx": "Jealous officials tricked King Darius into making a law that no one could pray to anyone but the king for thirty days. Daniel kept praying three times a day with his windows open toward Jerusalem. He was thrown to the lions, but God sent His angel to shut their mouths, and Daniel was unharmed."}, {"text": "The writing on the wall appeared during King Belshazzar’s feast.", "answer": true, "ref": "Daniel 5:1-5", "expl": "That night Babylon fell", "story": "The writing on the wall (Daniel 5)", "ctx": "King Belshazzar of Babylon held a great feast and drank from the sacred vessels taken from the temple in Jerusalem. Fingers of a man’s hand appeared and wrote on the wall, and only Daniel could read it: the kingdom had been weighed and found wanting. That very night Belshazzar was slain."}, {"text": "Ezekiel joined a stick for Judah and a stick for Joseph into one in his hand.", "answer": true, "ref": "Ezekiel 37:16-17", "expl": "Latter-day Saints see the Bible and the Book of Mormon", "story": "The two sticks (Ezekiel 37)", "ctx": "Right after the vision of the dry bones, the Lord told Ezekiel to take one stick for Judah and one for Joseph and join them in his hand. Latter-day Saints understand the stick of Judah as the Bible and the stick of Joseph as the Book of Mormon, which now testify together of Jesus Christ."}, {"text": "Isaiah prophesied that a virgin would bear a son called Immanuel.", "answer": true, "ref": "Isaiah 7:14", "expl": "Immanuel means “God with us”", "story": "The sign of Immanuel (Isaiah 7)", "ctx": "When King Ahaz of Judah feared an attack from Syria and Israel, Isaiah urged him to trust the Lord and offered a sign: a virgin would bear a son named Immanuel, meaning “God with us.” Matthew 1:23 teaches this was fulfilled in the birth of Jesus Christ to Mary."}, {"text": "Esther was Mordecai’s daughter.", "answer": false, "ref": "Esther 2:7", "expl": "She was his cousin, whom he raised as his own daughter", "story": "Esther becomes queen (Esther 2)", "ctx": "After Queen Vashti refused the king’s command, King Ahasuerus searched the kingdom for a new queen. Esther, a Jewish orphan raised by her cousin Mordecai, was chosen and crowned. On Mordecai’s advice, she did not reveal at first that she was Jewish."}, {"text": "Haman was hanged on the gallows he had built for Mordecai.", "answer": true, "ref": "Esther 7:10", "expl": "His plot turned back on himself", "story": "The story of Esther", "ctx": "Esther, a Jewish orphan, became queen of Persia. When Mordecai refused to bow to Haman, Haman got a decree to destroy all Jews. Esther fasted three days and risked her life to go to the king. Haman’s plot was exposed, and he was hanged on the gallows he had built for Mordecai."}, {"text": "Micah prophesied that the ruler of Israel would come out of Nazareth.", "answer": false, "ref": "Micah 5:2", "expl": "He named Bethlehem Ephratah", "story": "Bethlehem foretold (Micah 5)", "ctx": "Micah prophesied that a ruler of Israel, “whose goings forth have been from of old, from everlasting,” would come out of little Bethlehem. Centuries later, when the wise men asked where the King of the Jews would be born, the chief priests quoted this verse to King Herod (Matthew 2:5-6)."}, {"text": "Joel prophesied that the Lord would pour out His Spirit on all flesh.", "answer": true, "ref": "Joel 2:28", "expl": "Moroni quoted this to Joseph Smith", "story": "Joel’s prophecy of the Spirit (Joel 2)", "ctx": "Joel prophesied after a terrible plague of locusts, calling Israel to repent with fasting and weeping. He promised that in the last days the Lord would pour out His Spirit on all flesh. Peter quoted this on the day of Pentecost (Acts 2), and Moroni quoted it to Joseph Smith, saying it was soon to be fulfilled."}, {"text": "Amos was a temple priest before the Lord called him.", "answer": false, "ref": "Amos 7:14", "expl": "He was a herdman and a gatherer of sycomore fruit", "story": "Amos the herdsman prophet (Amos 3)", "ctx": "Amos was a herdsman and fig farmer from Judah, not a trained prophet, whom the Lord sent to warn the northern kingdom of Israel. He taught that the Lord reveals His plans to His prophets before acting, a key reason we follow living prophets today."}, {"text": "Zechariah prophesied that the King would come riding on a donkey’s colt.", "answer": true, "ref": "Zechariah 9:9", "expl": "Fulfilled at Jesus’ triumphal entry", "story": "The King on a donkey (Zechariah 9)", "ctx": "Zechariah prophesied to the Jews rebuilding the temple after the exile. He foresaw their King coming to Jerusalem humbly, riding on a donkey’s colt. About 500 years later, Jesus fulfilled this at His triumphal entry, as crowds spread branches and cried “Hosanna” (Matthew 21:5)."}], "root": "seminaryGames/otquiz2", "intro": "True or false questions on Isaiah, Jeremiah, Daniel, Ezekiel, Esther, Nehemiah, and the minor prophets", "round": 10, "banked": true};

    if (rv) {
      var label = KIND === 'order' ? '' : '<b>Answer: ' + esc(o[r]) + '</b>';
      h += '<div class="ans">' + label + (q.ref ? (label ? ' &nbsp;' : '') + '<span style="color:#A3B2CE">' + esc(q.ref) + '</span>' : '') + (q.expl ? '<div style="margin-top:4px">' + esc(q.expl) + '</div>' : '') + '</div>';
      if (KIND === 'order') h += '<ol class="order">' + q.items.map(function (it, k) { return '<li>' + esc(it) + (q.dates ? '<span class="when">' + esc(q.dates[k]) + '</span>' : '') + '</li>'; }).join('') + '</ol>' + (typeof eraSvg === 'function' && q.years ? eraSvg(q, false) : '');
      if (q.story || q.ctx) h += '<div class="ctx"><b>' + esc(q.story || '') + '</b><p>' + esc(q.ctx || '') + '</p></div>';
    }
    h += '<h2 style="margin-top:16px">Who got it right? <span class="sub" style="font-weight:400;font-size:.9rem">tap to give a point, tap again to take it back</span></h2><div class="who">' +
      S.teams.map(function (t, i) { return '<button class="b' + (S.got[i] ? ' got' : '') + '" style="--c:' + COLORS[i] + '" data-t="' + i + '">' + (S.got[i] ? '✓ ' : '') + esc(t) + '</button>'; }).join('') + '</div>';
    h += '<div class="row" style="margin-top:14px">' + (rv ? '' : '<button class="b go big" id="tmReveal">Reveal answer</button>') + '<button class="b' + (rv ? ' go' : '') + ' big" id="tmNext">' + (S.i + 1 >= S.ids.length ? 'Final standings' : 'Next question') + '</button></div>';
    h += '<p class="keys">Keyboard: Space pauses the timer, R reveals, N goes to the next question.</p></div></div>';
    root.innerHTML = h; paintClock(); bind();
  }
  function bind() {
    var x;
    if ((x = root.querySelector('#tmPause'))) x.onclick = togglePause;
    if ((x = root.querySelector('#tmMore'))) x.onclick = function () { S.left = Math.max(S.left, 0) + 10; if (!S.timer && S.secs > 0) S.timer = setInterval(function () { if (S.paused || S.revealed) return; S.left--; paintClock(); if (S.left <= 0) stopClock(); }, 1000); paintClock(); };
    if ((x = root.querySelector('#tmReveal'))) x.onclick = reveal;
    root.querySelector('#tmNext').onclick = next;
    root.querySelector('.who').onclick = function (e) { var b = e.target.closest('[data-t]'); if (!b) return; var t = +b.getAttribute('data-t');
      S.got[t] = !S.got[t]; S.scores[t] += S.got[t] ? 1 : -1; var keep = S.paused; render(); S.paused = keep; };
  }
  function togglePause() { S.paused = !S.paused; var b = root.querySelector('#tmPause'); if (b) b.textContent = S.paused ? 'Resume' : 'Pause'; paintClock(); }
  function reveal() { if (S.revealed) return; S.revealed = true; stopClock(); render(); }
  function next() { stopClock(); if (S.i + 1 >= S.ids.length) return final(); S.i++; question(); }
  function final() {
    var order = S.teams.map(function (t, i) { return i; }).sort(function (a, b) { return S.scores[b] - S.scores[a]; });
    root.innerHTML = '<div class="w"><h1>Final standings</h1><div class="card">' + order.map(function (i, k) { return '<div class="stand"><span>' + (k + 1) + '. ' + esc(S.teams[i]) + '</span><b>' + S.scores[i] + '</b></div>'; }).join('') + '</div>' +
      '<div class="row"><button class="b go big" id="tmAgain">Play again</button><button class="b big" id="tmSetup">Change teams</button></div></div>';
    root.querySelector('#tmAgain').onclick = function () { S.scores = S.teams.map(function () { return 0; }); S.ids = draw(S.ids.length); S.i = 0; question(); };
    root.querySelector('#tmSetup').onclick = function () { S.started = false; setup(); };
  }
  document.addEventListener('keydown', function (e) {
    if (!document.body.classList.contains('tm-on') || !S.started || /input|textarea/i.test((e.target && e.target.tagName) || '') || !root.querySelector('#tmNext')) return;
    if (e.key === ' ') { e.preventDefault(); if (S.secs > 0 && !S.revealed) togglePause(); }
    else if (e.key === 'r' || e.key === 'R') reveal(); else if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') next();
  });
  if (/[?&]mode=teams/.test(location.search)) mode('teams');
})();

</script>
</body></html>
