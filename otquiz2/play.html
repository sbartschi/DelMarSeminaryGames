<style>:root{--bg-page:#0E1B2B;--bg-panel:#16273B;--bg-panel-raised:#1E3450;--ink:#F1F6FB;--muted:#9FB4C9;--line:rgba(241,246,251,0.14);--accent:#4FA3D1;--ok:#3FA66B;--bad:#C65B5B;color-scheme:dark;}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;background:var(--bg-page);color:var(--ink);font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 50px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
h1{font-family:'Fraunces',Georgia,serif;font-size:1.9rem;margin:0 0 8px;}
h2{font-family:'Fraunces',Georgia,serif;font-size:1.3rem;margin:0 0 10px;}
.card{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
.muted{color:var(--muted);font-size:0.95rem;}
.btn{font:inherit;font-weight:700;padding:14px 20px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);cursor:pointer;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121D;}
.btn.big{font-size:1.1rem;width:100%;padding:18px;margin-top:6px;}
.btn[disabled]{opacity:0.4;cursor:default;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
input[type=text]{font:inherit;font-size:1.1rem;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);width:100%;margin-bottom:10px;}
.qr-box{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:14px;margin:10px auto;width:max-content;max-width:100%;}
.code{font-family:'IBM Plex Mono',monospace;font-size:2.4rem;letter-spacing:0.18em;text-align:center;color:var(--accent);margin:6px 0;}
.tag{display:inline-block;background:var(--bg-panel-raised);border-radius:20px;padding:6px 14px;margin:4px;font-size:0.95rem;}
.lb{width:100%;border-collapse:collapse;margin-top:6px;}
.lb td,.lb th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:1rem;}
.lb th{color:var(--muted);font-weight:600;font-size:0.78rem;text-transform:uppercase;}
.q{font-family:'Fraunces',Georgia,serif;font-size:1.6rem;line-height:1.35;margin:8px 0 16px;}
.verse{font-family:'Fraunces',Georgia,serif;font-size:1.45rem;line-height:1.45;font-style:italic;margin:8px 0 16px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt{padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--bg-panel-raised);font-size:1.1rem;}
.opt.right{border-color:var(--ok);background:rgba(63,166,107,0.25);}
.opt .n{font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-right:8px;}
.ans{display:block;width:100%;text-align:left;font:inherit;font-size:1.1rem;padding:18px 16px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);cursor:pointer;}
.ans.t{background:rgba(63,166,107,0.2);border-color:var(--ok);text-align:center;font-size:1.4rem;font-weight:700;}
.ans.f{background:rgba(198,91,91,0.2);border-color:var(--bad);text-align:center;font-size:1.4rem;font-weight:700;}
.timerbar{height:8px;border-radius:4px;background:var(--bg-panel-raised);overflow:hidden;margin:6px 0 12px;}
.timerbar i{display:block;height:100%;background:var(--accent);transition:width .25s linear;}
.result-big{font-family:'Fraunces',Georgia,serif;font-size:2.2rem;font-weight:700;margin:6px 0;}
.good{color:var(--ok);} .bad{color:var(--bad);}
.reveal{background:var(--bg-panel-raised);border-radius:12px;padding:14px 16px;margin-top:6px;}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:20px 0;}
.podium .spot{background:var(--bg-panel-raised);border-radius:10px 10px 0 0;padding:14px 16px;text-align:center;min-width:100px;}
.podium .g1{min-height:130px;background:linear-gradient(180deg,#F0CB77,#C9A227);color:#2b2418;}
.podium .g2{min-height:96px;} .podium .g3{min-height:72px;}
.ph{max-width:480px;margin:0 auto;}
.center{text-align:center;}
@media (max-width:600px){ .opts{grid-template-columns:1fr;} .q{font-size:1.3rem;} .verse{font-size:1.2rem;} }
.emoji{font-size:4rem;line-height:1.3;text-align:center;margin:10px 0 18px;letter-spacing:0.1em;}
.order{margin:0 0 6px;padding-left:28px;font-size:1.15rem;line-height:1.7;}
.order li::marker{color:var(--accent);font-weight:700;}
.ans.picked{border-color:var(--accent);background:rgba(255,255,255,0.08);opacity:0.75;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);margin-right:10px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.ans.picked .badge{background:var(--accent);color:#06121D;border-color:var(--accent);}
.scene{font-size:1.15rem;line-height:1.5;margin:4px 0 10px;}
.meters{display:grid;gap:10px;}
.meter{font-size:0.95rem;}
.mtrack{height:10px;border-radius:5px;background:var(--bg-panel-raised);overflow:hidden;margin-top:4px;}
.mtrack i{display:block;height:100%;background:var(--accent);transition:width .4s ease;}
.tally{display:grid;gap:8px;margin-top:8px;}
.trow{padding:10px 12px;border-radius:10px;border:1px solid var(--line);}
.trow.dec{border-color:var(--accent);background:rgba(255,255,255,0.05);}
.trow .n,.opt .n{font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-right:8px;}
.did{border-color:var(--accent);}
ul.plain{margin:0;padding-left:20px;line-height:1.6;}
.pts{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;color:var(--muted);margin-left:6px;white-space:nowrap;}
.pts.top{color:var(--accent);font-weight:700;}
.ctx{margin-top:14px;padding:14px 16px;border-left:4px solid var(--accent);background:rgba(227,176,75,0.10);border-radius:10px;text-align:left;}.ctx .ctx-h{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}.ctx b{display:block;font-size:1.05rem;margin-bottom:6px;color:var(--ink);}.ctx p{margin:0;line-height:1.55;color:var(--ink);font-size:0.98rem;}</style></head><body><div class="wrap" id="app"></div>
<script>var CFG={"title": "True or False: Prophets Edition", "kind": "tf", "seconds": 20, "questions": [{"text": "Isaiah saw the Lord sitting upon a throne in the year that King Uzziah died.", "answer": true, "ref": "Isaiah 6:1", "expl": "Isaiah's great vision and call happened \"in the year that king Uzziah died\"", "story": "Isaiah’s call to be a prophet (Isaiah 6)", "ctx": "In the year King Uzziah died, Isaiah saw the Lord on His throne surrounded by seraphim. Feeling unworthy, he cried that he was “a man of unclean lips,” but a seraph touched his lips with a live coal from the altar and his sin was purged. When the Lord asked, “Whom shall I send?” Isaiah answered, “Here am I; send me.”"}, {"text": "When the Lord asked \"Whom shall I send?\", Isaiah asked Him to send someone else.", "answer": false, "ref": "Isaiah 6:8", "expl": "Isaiah answered, \"Here am I; send me\"", "story": "Isaiah’s call to be a prophet (Isaiah 6)", "ctx": "In the year King Uzziah died, Isaiah saw the Lord on His throne surrounded by seraphim. Feeling unworthy, he cried that he was “a man of unclean lips,” but a seraph touched his lips with a live coal from the altar and his sin was purged. When the Lord asked, “Whom shall I send?” Isaiah answered, “Here am I; send me.”"}, {"text": "When the Assyrians surrounded Jerusalem in Hezekiah's day, the angel of the Lord smote 185,000 in the Assyrian camp.", "answer": true, "ref": "Isaiah 37:36", "expl": "The Lord delivered Jerusalem after Hezekiah prayed and Isaiah prophesied", "story": "The Lord saves Jerusalem from Assyria (Isaiah 36 to 37)", "ctx": "The Assyrian army of King Sennacherib surrounded Jerusalem and mocked Judah’s God. King Hezekiah spread the threatening letter before the Lord in the temple and prayed, and Isaiah promised the city would be spared. That night the angel of the Lord smote the Assyrian camp, and Sennacherib went home."}, {"text": "Isaiah mentioned King Cyrus of Persia by name long before Cyrus let the Jews go home.", "answer": true, "ref": "Isaiah 44:28; 45:1", "expl": "Isaiah prophesied that Cyrus would say to Jerusalem, \"Thou shalt be built\"", "story": "Cyrus lets the Jews return (Isaiah 44 to 45; Ezra 1)", "ctx": "More than a century before he was born, Isaiah recorded the Lord calling Cyrus by name as His “shepherd” who would see that Jerusalem and the temple were rebuilt. Cyrus became king of Persia, conquered Babylon, and issued a decree letting the Jews return home to rebuild."}, {"text": "Jeremiah began prophesying only after the Jews had returned from Babylon.", "answer": false, "ref": "Jeremiah 1:1-3", "expl": "Jeremiah prophesied from the days of King Josiah until Jerusalem was carried away captive", "story": "The call of Jeremiah (Jeremiah 1)", "ctx": "The Lord told Jeremiah that He knew him and ordained him a prophet before he was born. Jeremiah protested that he was only a child and could not speak. The Lord touched his mouth, put His words there, and told him not to be afraid. Jeremiah prophesied for about forty years, in the same era as Lehi."}, {"text": "Daniel and his friends asked to eat the king's meat and drink the king's wine.", "answer": false, "ref": "Daniel 1:8, 12", "expl": "They asked for pulse to eat and water to drink, and after ten days they looked healthier than the others", "story": "Daniel’s food test (Daniel 1)", "ctx": "Daniel and three friends were young Jewish captives chosen for training in the Babylonian king’s court. Rather than defile themselves with the king’s food and wine, they asked to eat pulse (vegetables) and drink water for ten days. At the end they were healthier than the others, and God gave them knowledge and wisdom."}, {"text": "King Nebuchadnezzar commanded that the furnace be heated seven times more than usual.", "answer": true, "ref": "Daniel 3:19", "expl": "Even so, Shadrach, Meshach, and Abed-nego came out without the smell of fire on them", "story": "The fiery furnace (Daniel 3)", "ctx": "King Nebuchadnezzar set up a golden image and commanded everyone to bow to it or be thrown into a burning fiery furnace, heated seven times hotter than usual. Shadrach, Meshach, and Abed-nego refused, saying God could deliver them, “but if not,” they still would not bow. The king saw a fourth person in the fire, and they came out without even the smell of fire on them."}, {"text": "Ezekiel saw a valley full of golden statues come to life.", "answer": false, "ref": "Ezekiel 37:1-10", "expl": "He saw a valley full of dry bones receive sinews, flesh, and breath", "story": "The valley of dry bones (Ezekiel 37)", "ctx": "In vision, the Lord set Ezekiel in a valley full of very dry bones and asked, “Can these bones live?” As Ezekiel prophesied, the bones came together, received flesh, and were filled with breath. The Lord explained it represented the house of Israel being gathered and given new life, and it also points to the Resurrection."}, {"text": "Esther became queen of Persia during the reign of King Ahasuerus.", "answer": true, "ref": "Esther 2:17", "expl": "Ahasuerus set the royal crown on Esther's head and made her queen instead of Vashti", "story": "Esther becomes queen (Esther 2)", "ctx": "After Queen Vashti refused the king’s command, King Ahasuerus searched the kingdom for a new queen. Esther, a Jewish orphan raised by her cousin Mordecai, was chosen and crowned. On Mordecai’s advice, she did not reveal at first that she was Jewish."}, {"text": "Nehemiah and the people took seven years to rebuild the wall of Jerusalem.", "answer": false, "ref": "Nehemiah 6:15", "expl": "The wall was finished in fifty and two days", "story": "Rebuilding the wall (Nehemiah 4 to 6)", "ctx": "As Nehemiah’s workers rebuilt Jerusalem’s walls, enemies mocked them and plotted to attack. Nehemiah set guards and had the builders carry weapons as they worked. When his enemies tried four times to lure him away to harm him, he answered, “I am doing a great work, so that I cannot come down.” The wall was finished in 52 days."}, {"text": "The people of Nineveh believed God, proclaimed a fast, and put on sackcloth after Jonah's warning.", "answer": true, "ref": "Jonah 3:5", "expl": "From the greatest to the least, the people repented", "story": "Jonah and Nineveh (Jonah 1 to 4)", "ctx": "The Lord sent Jonah to warn Nineveh, an enemy city, but he fled by ship toward Tarshish. In a storm he was thrown overboard and swallowed by a great fish, where he prayed for three days and three nights. When he finally preached, the whole city repented and was spared. Jonah was angry, admitting he had run because he knew the Lord would be merciful."}, {"text": "Malachi taught that people rob God when they fail to offer lambs for sacrifice.", "answer": false, "ref": "Malachi 3:8", "expl": "The Lord said they robbed Him \"in tithes and offerings\"", "story": "Malachi on tithing (Malachi 3)", "ctx": "Malachi was the last prophet of the Old Testament. The Lord asked, “Will a man rob God?” and explained the people robbed Him in tithes and offerings. He promised that if they brought their tithes into the storehouse, He would open the windows of heaven. The Savior later taught these same words to the Nephites (3 Nephi 24)."}, {"text": "Jonah was in the belly of the fish three days and three nights.", "answer": true, "ref": "Jonah 1:17", "expl": "Then he prayed unto the Lord from the fish’s belly", "story": "Jonah and Nineveh (Jonah 1 to 4)", "ctx": "The Lord sent Jonah to warn Nineveh, an enemy city, but he fled by ship toward Tarshish. In a storm he was thrown overboard and swallowed by a great fish, where he prayed for three days and three nights. When he finally preached, the whole city repented and was spared. Jonah was angry, admitting he had run because he knew the Lord would be merciful."}, {"text": "The people of Nineveh refused to repent, so the city was destroyed.", "answer": false, "ref": "Jonah 3:10", "expl": "They repented, and God spared the city", "story": "Jonah and Nineveh (Jonah 1 to 4)", "ctx": "The Lord sent Jonah to warn Nineveh, an enemy city, but he fled by ship toward Tarshish. In a storm he was thrown overboard and swallowed by a great fish, where he prayed for three days and three nights. When he finally preached, the whole city repented and was spared. Jonah was angry, admitting he had run because he knew the Lord would be merciful."}, {"text": "Jeremiah was lowered into a dungeon and sank in the mire.", "answer": true, "ref": "Jeremiah 38:6", "expl": "Ebed-melech later rescued him", "story": "Jeremiah in the dungeon (Jeremiah 38)", "ctx": "During the Babylonian siege, Jeremiah warned that Jerusalem would fall and urged surrender. Angry princes lowered him into a muddy dungeon to die. Ebed-melech, an Ethiopian servant in the king’s house, got permission to rescue him with cords and old rags."}, {"text": "Daniel was thrown into the lions’ den by King Nebuchadnezzar.", "answer": false, "ref": "Daniel 6:16", "expl": "It happened under King Darius", "story": "Daniel in the lions’ den (Daniel 6)", "ctx": "Jealous officials tricked King Darius into making a law that no one could pray to anyone but the king for thirty days. Daniel kept praying three times a day with his windows open toward Jerusalem. He was thrown to the lions, but God sent His angel to shut their mouths, and Daniel was unharmed."}, {"text": "The writing on the wall appeared during King Belshazzar’s feast.", "answer": true, "ref": "Daniel 5:1-5", "expl": "That night Babylon fell", "story": "The writing on the wall (Daniel 5)", "ctx": "King Belshazzar of Babylon held a great feast and drank from the sacred vessels taken from the temple in Jerusalem. Fingers of a man’s hand appeared and wrote on the wall, and only Daniel could read it: the kingdom had been weighed and found wanting. That very night Belshazzar was slain."}, {"text": "Ezekiel joined a stick for Judah and a stick for Joseph into one in his hand.", "answer": true, "ref": "Ezekiel 37:16-17", "expl": "Latter-day Saints see the Bible and the Book of Mormon", "story": "The two sticks (Ezekiel 37)", "ctx": "Right after the vision of the dry bones, the Lord told Ezekiel to take one stick for Judah and one for Joseph and join them in his hand. Latter-day Saints understand the stick of Judah as the Bible and the stick of Joseph as the Book of Mormon, which now testify together of Jesus Christ."}, {"text": "Isaiah prophesied that a virgin would bear a son called Immanuel.", "answer": true, "ref": "Isaiah 7:14", "expl": "Immanuel means “God with us”", "story": "The sign of Immanuel (Isaiah 7)", "ctx": "When King Ahaz of Judah feared an attack from Syria and Israel, Isaiah urged him to trust the Lord and offered a sign: a virgin would bear a son named Immanuel, meaning “God with us.” Matthew 1:23 teaches this was fulfilled in the birth of Jesus Christ to Mary."}, {"text": "Esther was Mordecai’s daughter.", "answer": false, "ref": "Esther 2:7", "expl": "She was his cousin, whom he raised as his own daughter", "story": "Esther becomes queen (Esther 2)", "ctx": "After Queen Vashti refused the king’s command, King Ahasuerus searched the kingdom for a new queen. Esther, a Jewish orphan raised by her cousin Mordecai, was chosen and crowned. On Mordecai’s advice, she did not reveal at first that she was Jewish."}, {"text": "Haman was hanged on the gallows he had built for Mordecai.", "answer": true, "ref": "Esther 7:10", "expl": "His plot turned back on himself", "story": "The story of Esther", "ctx": "Esther, a Jewish orphan, became queen of Persia. When Mordecai refused to bow to Haman, Haman got a decree to destroy all Jews. Esther fasted three days and risked her life to go to the king. Haman’s plot was exposed, and he was hanged on the gallows he had built for Mordecai."}, {"text": "Micah prophesied that the ruler of Israel would come out of Nazareth.", "answer": false, "ref": "Micah 5:2", "expl": "He named Bethlehem Ephratah", "story": "Bethlehem foretold (Micah 5)", "ctx": "Micah prophesied that a ruler of Israel, “whose goings forth have been from of old, from everlasting,” would come out of little Bethlehem. Centuries later, when the wise men asked where the King of the Jews would be born, the chief priests quoted this verse to King Herod (Matthew 2:5-6)."}, {"text": "Joel prophesied that the Lord would pour out His Spirit on all flesh.", "answer": true, "ref": "Joel 2:28", "expl": "Moroni quoted this to Joseph Smith", "story": "Joel’s prophecy of the Spirit (Joel 2)", "ctx": "Joel prophesied after a terrible plague of locusts, calling Israel to repent with fasting and weeping. He promised that in the last days the Lord would pour out His Spirit on all flesh. Peter quoted this on the day of Pentecost (Acts 2), and Moroni quoted it to Joseph Smith, saying it was soon to be fulfilled."}, {"text": "Amos was a temple priest before the Lord called him.", "answer": false, "ref": "Amos 7:14", "expl": "He was a herdman and a gatherer of sycomore fruit", "story": "Amos the herdsman prophet (Amos 3)", "ctx": "Amos was a herdsman and fig farmer from Judah, not a trained prophet, whom the Lord sent to warn the northern kingdom of Israel. He taught that the Lord reveals His plans to His prophets before acting, a key reason we follow living prophets today."}, {"text": "Zechariah prophesied that the King would come riding on a donkey’s colt.", "answer": true, "ref": "Zechariah 9:9", "expl": "Fulfilled at Jesus’ triumphal entry", "story": "The King on a donkey (Zechariah 9)", "ctx": "Zechariah prophesied to the Jews rebuilding the temple after the exile. He foresaw their King coming to Jerusalem humbly, riding on a donkey’s colt. About 500 years later, Jesus fulfilled this at His triumphal entry, as crowds spread branches and cried “Hosanna” (Matthew 21:5)."}], "root": "seminaryGames/otquiz2", "intro": "True or false questions on Isaiah, Jeremiah, Daniel, Ezekiel, Esther, Nehemiah, and the minor prophets", "round": 10, "banked": true};

    if (mine) h='<div class="card center"><div class="eyebrow">Question '+(m.q+1)+' of '+QN(m)+'</div><h2>Answer locked in</h2>'+(CFG.kind==='order'?'':'<p class="muted">You picked: '+esc(optsOf(q)[mine.i])+'</p>')+'<p class="muted">Waiting for the reveal</p></div>';
    else if (CFG.kind==='order'){
      if (seqQ!==m.q){ seq=[]; seqQ=m.q; }
      h='<div class="card"><div class="eyebrow">Question '+(m.q+1)+' of '+QN(m)+'</div><div class="q" style="font-size:1.15rem">'+esc(q.text)+'</div><div class="muted">Tap the events from first to last</div></div>';
      h+=q.shown.map(function(k,i){ var pos=seq.indexOf(i); return '<button class="ans'+(pos>=0?' picked':'')+'" data-a="seq" data-i="'+i+'"'+(pos>=0?' disabled':'')+'><span class="badge">'+(pos>=0?pos+1:'')+'</span>'+esc(q.items[k])+'</button>'; }).join('');
      h+='<div class="row"><button class="btn" data-a="undo"'+(seq.length?'':' disabled')+' style="flex:1">Undo</button><button class="btn primary" data-a="lock"'+(seq.length===q.items.length?'':' disabled')+' style="flex:2">Lock in my order</button></div>';
    }
    else {
      h='<div class="card"><div class="eyebrow">Question '+(m.q+1)+' of '+QN(m)+'</div>'+(q.verse?'<div class="muted">'+esc(q.prompt||CFG.prompt||'')+'</div><div class="verse" style="font-size:1.1rem">&ldquo;'+esc(q.verse)+'&rdquo;</div>':q.emoji?'<div class="muted">'+esc(q.prompt||CFG.prompt||'')+'</div><div class="emoji" style="font-size:2.6rem">'+esc(q.emoji)+'</div>':'<div class="q" style="font-size:1.2rem">'+esc(q.text)+'</div>')+'</div>';
      if (CFG.kind==='tf') h+='<button class="ans t" data-a="pick" data-i="0">True</button><button class="ans f" data-a="pick" data-i="1">False</button>';
      else h+=q.options.map(function(o,i){ return '<button class="ans" data-a="pick" data-i="'+i+'"><b>'+'ABCD'[i]+'</b> &nbsp;'+esc(o)+'</button>'; }).join('');
    }
  } else if (m.phase==='reveal'){
    var q=QA(m), ok=p.last===1;
    h='<div class="card center"><div class="result-big '+(ok?'good':'bad')+'">'+(ok?'Correct':'Not quite')+'</div>'+(CFG.kind==='order'?'<p>'+(p.hits||0)+' of '+q.items.length+' in the right spot</p><p>+'+(p.gain||0)+' points</p><p class="muted">The correct order is on the screen</p>':ok?'<p>+'+(p.gain||0)+' points</p>':'<p class="muted">Answer: '+esc(optsOf(q)[correctIdx(q)])+'</p>')+
      '<p class="muted">'+esc(q.ref)+'</p>'+ctxHtml(q)+'<p class="muted">You are in place '+rankOf()+' of '+Object.keys(room.players).length+'</p></div>';
  } else if (m.phase==='final'){
    h='<div class="card center"><h2>Game over</h2><div class="result-big">'+(p.score||0).toLocaleString()+'</div><p class="muted">points, place '+rankOf()+' of '+Object.keys(room.players).length+'</p><p class="muted">Look at the screen for the podium</p></div>';
  }
  app.innerHTML='<div class="ph">'+head+h+'</div>';
}
function poll(){
  if (busy || !code || !pid) return; busy=true;
  jget(code,'').then(function(d){ busy=false; if (!d || !d.meta) return; room=d;
    var m=d.meta, p=me(), mine=p&&((d.ans||{})[m.q]||{})[pid];
    var k=[m.phase,m.q,!!p,!!mine,p&&p.score,p&&p.last,rankOf()].join('~'); if (k!==lastKey){ lastKey=k; render(); }
  });
}
app.addEventListener('click', function(e){
  var b=e.target.closest('[data-a]'); if (!b) return; var a=b.getAttribute('data-a');
  if (a==='join'){
    var nm=(document.getElementById('nm').value||'').trim(), cd=document.getElementById('cd');
    if (cd) code=(cd.value||'').trim().toUpperCase();
    if (!nm || !code) return; b.disabled=true;
    jget(code,'meta').then(function(m){
      if (!m){ joinScreen('That game code was not found'); return; }
      return jpost(code,'players',{name:nm, score:0}).then(function(r){ pid=r&&r.name; store('pid_'+code,pid); lastKey=''; poll(); });
    });
  } else if (a==='seq'){ var i=parseInt(b.getAttribute('data-i'),10); if (seq.indexOf(i)<0) seq.push(i); render();
  } else if (a==='undo'){ seq.pop(); render();
  } else if (a==='lock' && !sending){
    sending=true; var q=room.meta.q; b.disabled=true;
    jput(code,'ans/'+q+'/'+pid,{seq:seq.slice(), t:TS}).then(function(){ sending=false; lastKey=''; poll(); });
  } else if (a==='pick' && !sending){
    sending=true; var i=parseInt(b.getAttribute('data-i'),10), q=room.meta.q;
    Array.prototype.forEach.call(app.querySelectorAll('[data-a=pick]'),function(x){ x.disabled=true; });
    b.style.outline='3px solid var(--accent)';
    jput(code,'ans/'+q+'/'+pid,{i:i, t:TS}).then(function(){ sending=false; lastKey=''; poll(); });
  }
});
if (code){ pid=store('pid_'+code)||''; }
if (pid) poll(); else joinScreen();
setInterval(poll, 1200);
})();
</script><script>
/* Site helper: an "All games" button for the teacher's screen, and confetti whenever a final standings screen appears. */
(function () {
  var inFrame = false; try { inFrame = window.parent !== window; } catch (e) { inFrame = true; }
  function isPlayer() { return /(^|\/)(play|wordle-play|clues-play)\.html$/.test(location.pathname) || /[?&](play|join)=/.test(location.search) || location.hash === '#play'; }
  var css = document.createElement('style');
  css.textContent = '#sgHome{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:9998;display:inline-flex;align-items:center;gap:6px;' +
    'font:800 13px/1 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#EEF3FB;background:rgba(13,21,40,.88);border:1px solid rgba(160,185,230,.3);' +
    'border-radius:999px;padding:8px 13px;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}' +
    '#sgHome:hover{border-color:#1FB5A8}#sgHome:focus-visible{outline:3px solid #fff;outline-offset:2px}' +
    'body.sg-home{padding-top:48px!important;box-sizing:border-box}@media (max-width:700px){#sgHome{font-size:12px;padding:7px 11px}}';
  document.head.appendChild(css);
  if (!inFrame) {
    var a = document.createElement('a'); a.id = 'sgHome'; a.href = '../'; a.textContent = '\u2190 All games';
    a.setAttribute('aria-label', 'Back to all seminary games');
    document.body.appendChild(a);
    /* shown on every teacher or shared screen; hidden only on student-only pages viewed on a phone */
    var hide = function () { return isPlayer() && innerWidth <= 700; };
    var sync = function () { var h = hide(); a.hidden = h; a.style.display = h ? 'none' : ''; document.body.classList.toggle('sg-home', !h); };
    sync(); window.addEventListener('hashchange', sync); window.addEventListener('resize', sync);
    /* full-screen layouts: make room for the button strip so the page does not scroll */
    var fit = function () {
      if (!document.body.classList.contains('sg-home')) return;
      var H = innerHeight;
      [].forEach.call(document.querySelectorAll('body > *, body > * > *, body > * > * > *'), function (el) {
        if (el.id === 'sgHome' || el.tagName === 'SCRIPT' || el.tagName === 'STYLE') return;
        var mh = getComputedStyle(el).minHeight;
        if (/px$/.test(mh) && Math.abs(parseFloat(mh) - H) <= 2) el.style.minHeight = 'calc(100vh - 48px)';
      });
    };
    fit(); window.addEventListener('resize', fit); window.addEventListener('load', fit);
    var ft = null; new MutationObserver(function () { clearTimeout(ft); ft = setTimeout(fit, 200); }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden', 'style'] });
  }

  /* ---------- confetti ---------- */
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function confetti() {
    if (reduce || window.SG_NO_CONFETTI || document.getElementById('sgConfetti')) return;
    var c = document.createElement('canvas'), dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    c.id = 'sgConfetti'; c.setAttribute('aria-hidden', 'true');
    c.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999';
    c.width = W * dpr; c.height = H * dpr; document.body.appendChild(c);
    var x = c.getContext('2d'); x.scale(dpr, dpr);
    var cols = ['#F0545C', '#3E8EF7', '#1FB5A8', '#F4B740', '#8B7CF6', '#E57AC2', '#FFFFFF'], P = [];
    for (var i = 0; i < 170; i++) P.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      vx: -1.5 + Math.random() * 3, vy: 2 + Math.random() * 3.5, r: Math.random() * 6.3, vr: -0.2 + Math.random() * 0.4, c: cols[i % cols.length] });
    var t0 = performance.now();
    (function frame(t) {
      var age = t - t0; x.clearRect(0, 0, W, H);
      P.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.r += p.vr;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = age > 3800 ? Math.max(0, 1 - (age - 3800) / 700) : 1; x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
      if (age < 4500) requestAnimationFrame(frame); else c.remove();
    })(t0);
  }
  window.sgConfetti = confetti;
  var FINAL = /^\s*(final (standings|results|rank|leaderboard|scores)|game over)\b/i, was = false, timer = null;
  function check() {
    var els = document.querySelectorAll('h1,h2,h3,.eyebrow,.title,.big'), now = false;
    for (var i = 0; i < els.length && !now; i++) { var e = els[i]; if (e.offsetParent !== null && FINAL.test(e.textContent || '')) now = true; }
    if (now && !was) confetti();
    was = now;
  }
  new MutationObserver(function () { clearTimeout(timer); timer = setTimeout(check, 250); }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden', 'style'] });
  setTimeout(check, 600);
})();

</script>
