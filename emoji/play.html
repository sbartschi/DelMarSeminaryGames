<title>Emoji Story: Play</title>

<style>:root{--bg-page:#0E1B2B;--bg-panel:#16273B;--bg-panel-raised:#1E3450;--ink:#F1F6FB;--muted:#9FB4C9;--line:rgba(241,246,251,0.14);--accent:#E0708A;--ok:#3FA66B;--bad:#C65B5B;color-scheme:dark;}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;background:var(--bg-page);color:var(--ink);font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 50px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
h1{font-family:'Fraunces',Georgia,serif;font-size:1.9rem;margin:0 0 8px;}
h2{font-family:'Fraunces',Georgia,serif;font-size:1.3rem;margin:0 0 10px;}
.card{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
.muted{color:var(--muted);font-size:0.95rem;}
.btn{font:inherit;font-weight:700;padding:14px 20px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);cursor:pointer;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121D;}
.btn.big{font-size:1.1rem;width:100%;padding:18px;margin-top:6px;}
.btn[disabled]{opacity:0.4;cursor:default;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
input[type=text]{font:inherit;font-size:1.1rem;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);width:100%;margin-bottom:10px;}
.qr-box{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:14px;margin:10px auto;width:max-content;max-width:100%;}
.code{font-family:'IBM Plex Mono',monospace;font-size:2.4rem;letter-spacing:0.18em;text-align:center;color:var(--accent);margin:6px 0;}
.tag{display:inline-block;background:var(--bg-panel-raised);border-radius:20px;padding:6px 14px;margin:4px;font-size:0.95rem;}
.lb{width:100%;border-collapse:collapse;margin-top:6px;}
.lb td,.lb th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:1rem;}
.lb th{color:var(--muted);font-weight:600;font-size:0.78rem;text-transform:uppercase;}
.q{font-family:'Fraunces',Georgia,serif;font-size:1.6rem;line-height:1.35;margin:8px 0 16px;}
.verse{font-family:'Fraunces',Georgia,serif;font-size:1.45rem;line-height:1.45;font-style:italic;margin:8px 0 16px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt{padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--bg-panel-raised);font-size:1.1rem;}
.opt.right{border-color:var(--ok);background:rgba(63,166,107,0.25);}
.opt .n{font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-right:8px;}
.ans{display:block;width:100%;text-align:left;font:inherit;font-size:1.1rem;padding:18px 16px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);cursor:pointer;}
.ans.t{background:rgba(63,166,107,0.2);border-color:var(--ok);text-align:center;font-size:1.4rem;font-weight:700;}
.ans.f{background:rgba(198,91,91,0.2);border-color:var(--bad);text-align:center;font-size:1.4rem;font-weight:700;}
.timerbar{height:8px;border-radius:4px;background:var(--bg-panel-raised);overflow:hidden;margin:6px 0 12px;}
.timerbar i{display:block;height:100%;background:var(--accent);transition:width .25s linear;}
.result-big{font-family:'Fraunces',Georgia,serif;font-size:2.2rem;font-weight:700;margin:6px 0;}
.good{color:var(--ok);} .bad{color:var(--bad);}
.reveal{background:var(--bg-panel-raised);border-radius:12px;padding:14px 16px;margin-top:6px;}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:20px 0;}
.podium .spot{background:var(--bg-panel-raised);border-radius:10px 10px 0 0;padding:14px 16px;text-align:center;min-width:100px;}
.podium .g1{min-height:130px;background:linear-gradient(180deg,#F0CB77,#C9A227);color:#2b2418;}
.podium .g2{min-height:96px;} .podium .g3{min-height:72px;}
.ph{max-width:480px;margin:0 auto;}
.center{text-align:center;}
@media (max-width:600px){ .opts{grid-template-columns:1fr;} .q{font-size:1.3rem;} .verse{font-size:1.2rem;} }
.emoji{font-size:4rem;line-height:1.3;text-align:center;margin:10px 0 18px;letter-spacing:0.1em;}
.order{margin:0 0 6px;padding-left:28px;font-size:1.15rem;line-height:1.7;}
.order li::marker{color:var(--accent);font-weight:700;}
.ans.picked{border-color:var(--accent);background:rgba(255,255,255,0.08);opacity:0.75;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);margin-right:10px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.ans.picked .badge{background:var(--accent);color:#06121D;border-color:var(--accent);}
.scene{font-size:1.15rem;line-height:1.5;margin:4px 0 10px;}
.meters{display:grid;gap:10px;}
.meter{font-size:0.95rem;}
.mtrack{height:10px;border-radius:5px;background:var(--bg-panel-raised);overflow:hidden;margin-top:4px;}
.mtrack i{display:block;height:100%;background:var(--accent);transition:width .4s ease;}
.tally{display:grid;gap:8px;margin-top:8px;}
.trow{padding:10px 12px;border-radius:10px;border:1px solid var(--line);}
.trow.dec{border-color:var(--accent);background:rgba(255,255,255,0.05);}
.trow .n,.opt .n{font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-right:8px;}
.did{border-color:var(--accent);}
ul.plain{margin:0;padding-left:20px;line-height:1.6;}
.pts{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;color:var(--muted);margin-left:6px;white-space:nowrap;}
.pts.top{color:var(--accent);font-weight:700;}
.ctx{margin-top:14px;padding:14px 16px;border-left:4px solid var(--accent);background:rgba(227,176,75,0.10);border-radius:10px;text-align:left;}.ctx .ctx-h{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}.ctx b{display:block;font-size:1.05rem;margin-bottom:6px;color:var(--ink);}.ctx p{margin:0;line-height:1.55;color:var(--ink);font-size:0.98rem;}</style></head><body><div class="wrap" id="app"></div>
<script>var CFG={"title": "Emoji Story", "kind": "mc", "seconds": 20, "questions": [{"options": ["Zechariah's King on a colt", "Esther goes before the king", "Daniel in the lions' den", "Jonah and the great fish"], "answer": 3, "ref": "Jonah 1:17; 2:1", "expl": "Jonah prayed from the belly of the fish for three days and three nights", "emoji": "🌊🐋🙏", "prompt": "Which story is this?", "story": "Jonah and Nineveh (Jonah 1 to 4)", "ctx": "The Lord sent Jonah to warn Nineveh, an enemy city, but he fled by ship toward Tarshish. In a storm he was thrown overboard and swallowed by a great fish, where he prayed for three days and three nights. When he finally preached, the whole city repented and was spared. Jonah was angry, admitting he had run because he knew the Lord would be merciful."}, {"options": ["Job loses everything", "The valley of dry bones", "The potter and the clay", "Daniel in the lions' den"], "answer": 3, "ref": "Daniel 6:10, 16", "expl": "Daniel prayed with his windows open toward Jerusalem", "emoji": "🦁🦁🙏🪟", "prompt": "Which story is this?", "story": "Daniel in the lions’ den (Daniel 6)", "ctx": "Jealous officials tricked King Darius into making a law that no one could pray to anyone but the king for thirty days. Daniel kept praying three times a day with his windows open toward Jerusalem. He was thrown to the lions, but God sent His angel to shut their mouths, and Daniel was unharmed."}, {"options": ["Esther goes before the king", "Zechariah's King on a colt", "Nehemiah rebuilds the wall", "The fiery furnace"], "answer": 3, "ref": "Daniel 3:25", "expl": "Three men went in, and the king saw four walking in the fire", "emoji": "👤👤👤🔥👤", "prompt": "Which story is this?", "story": "The fiery furnace (Daniel 3)", "ctx": "King Nebuchadnezzar set up a golden image and commanded everyone to bow to it or be thrown into a burning fiery furnace, heated seven times hotter than usual. Shadrach, Meshach, and Abed-nego refused, saying God could deliver them, “but if not,” they still would not bow. The king saw a fourth person in the fire, and they came out without even the smell of fire on them."}, {"options": ["Jonah's gourd", "The fiery furnace", "Elijah will be sent", "The writing on the wall"], "answer": 3, "ref": "Daniel 5:5, 25", "expl": "MENE, MENE, TEKEL, UPHARSIN", "emoji": "👑🍷✋✍️🧱", "prompt": "Which story is this?", "story": "The writing on the wall (Daniel 5)", "ctx": "King Belshazzar of Babylon held a great feast and drank from the sacred vessels taken from the temple in Jerusalem. Fingers of a man’s hand appeared and wrote on the wall, and only Daniel could read it: the kingdom had been weighed and found wanting. That very night Belshazzar was slain."}, {"options": ["The valley of dry bones", "Elijah will be sent", "Jonah's gourd", "Zechariah's King on a colt"], "answer": 0, "ref": "Ezekiel 37:1-10", "expl": "The bones came together and received breath", "emoji": "🏜️🦴🦴🌬️🧍", "prompt": "Which story is this?", "story": "The valley of dry bones (Ezekiel 37)", "ctx": "In vision, the Lord set Ezekiel in a valley full of very dry bones and asked, “Can these bones live?” As Ezekiel prophesied, the bones came together, received flesh, and were filled with breath. The Lord explained it represented the house of Israel being gathered and given new life, and it also points to the Resurrection."}, {"options": ["Nehemiah rebuilds the wall", "Esther goes before the king", "Isaiah's lips touched by a coal", "The writing on the wall"], "answer": 1, "ref": "Esther 4:16; 5:1-2", "expl": "She fasted three days, then the king held out the golden sceptre", "emoji": "🙏🍽️❌3️⃣👸👑", "prompt": "Which story is this?", "story": "Esther saves her people (Esther 4 to 8)", "ctx": "Haman got a decree to destroy every Jew in Persia. Mordecai urged Esther to plead with the king, reminding her she may have become queen “for such a time as this.” Anyone who went to the king uninvited could be put to death, so Esther and her people fasted three days. She went in, the king held out his golden sceptre, and her people were saved."}, {"options": ["Job loses everything", "Zechariah's King on a colt", "Nehemiah rebuilds the wall", "Esther goes before the king"], "answer": 2, "ref": "Nehemiah 4:17; 6:15", "expl": "They built with one hand and held a weapon with the other", "emoji": "🧱🔨🗡️5️⃣2️⃣", "prompt": "Which story is this?", "story": "Rebuilding the wall (Nehemiah 4 to 6)", "ctx": "As Nehemiah’s workers rebuilt Jerusalem’s walls, enemies mocked them and plotted to attack. Nehemiah set guards and had the builders carry weapons as they worked. When his enemies tried four times to lure him away to harm him, he answered, “I am doing a great work, so that I cannot come down.” The wall was finished in 52 days."}, {"options": ["Isaiah's lips touched by a coal", "Nebuchadnezzar's dream of the image", "Daniel in the lions' den", "The valley of dry bones"], "answer": 0, "ref": "Isaiah 6:6-8", "expl": "Then Isaiah said, \"Here am I; send me\"", "emoji": "👼🔥🪨👄", "prompt": "Which story is this?", "story": "Isaiah’s call to be a prophet (Isaiah 6)", "ctx": "In the year King Uzziah died, Isaiah saw the Lord on His throne surrounded by seraphim. Feeling unworthy, he cried that he was “a man of unclean lips,” but a seraph touched his lips with a live coal from the altar and his sin was purged. When the Lord asked, “Whom shall I send?” Isaiah answered, “Here am I; send me.”"}, {"options": ["Nebuchadnezzar's dream of the image", "The writing on the wall", "The valley of dry bones", "The potter and the clay"], "answer": 3, "ref": "Jeremiah 18:3-6", "expl": "As the clay is in the potter's hand, so are we in the Lord's", "emoji": "🏺👐🔄", "prompt": "Which story is this?", "story": "The potter and the clay (Jeremiah 18)", "ctx": "The Lord sent Jeremiah to a potter’s house, where he watched a clay vessel get marred and reshaped into something new. The Lord taught that Israel was like clay in His hands: if they repented, He could reshape them. God can remake our lives when we let Him."}, {"options": ["Nebuchadnezzar's dream of the image", "Isaiah's lips touched by a coal", "The writing on the wall", "Jonah's gourd"], "answer": 0, "ref": "Daniel 2:34-35", "expl": "A stone cut out without hands became a mountain", "emoji": "🗿🪨💥⛰️", "prompt": "Which story is this?", "story": "Nebuchadnezzar’s dream (Daniel 2)", "ctx": "King Nebuchadnezzar demanded that his wise men tell him both his dream and its meaning, or die. Daniel and his friends prayed, and God revealed it. The great image stood for kingdoms that would rise and fall, and the stone cut out without hands stood for God’s kingdom in the last days, which would fill the whole earth."}, {"options": ["Daniel in the lions' den", "Psalm 23", "The fiery furnace", "The valley of dry bones"], "answer": 1, "ref": "Psalm 23:1-5", "expl": "Green pastures, still waters, and my cup runneth over", "emoji": "🐑🌿💧🍷", "prompt": "Which story is this?", "story": "The Shepherd’s psalm (Psalm 23)", "ctx": "David was a shepherd before he became king, protecting his father’s flocks from lions and bears. In this psalm he describes the Lord as a shepherd who leads, feeds, restores, and protects His sheep, even through the valley of the shadow of death."}, {"options": ["Job loses everything", "Psalm 23", "Daniel in the lions' den", "Jonah and the great fish"], "answer": 0, "ref": "Job 1:13-21", "expl": "\"The LORD gave, and the LORD hath taken away\"", "emoji": "🐫🐂🏠💨😢🙏", "prompt": "Which story is this?", "story": "Job’s trial begins (Job 1 to 2)", "ctx": "Job was a perfect and upright man with great wealth and ten children. Satan claimed Job was faithful only because he was blessed, so the Lord allowed Job to be tried. In one day he lost his animals, servants, and children, and later his health. Job worshipped and said, “The LORD gave, and the LORD hath taken away,” and he did not curse God."}, {"options": ["Esther goes before the king", "Jonah's gourd", "Nehemiah rebuilds the wall", "Jonah and the great fish"], "answer": 1, "ref": "Jonah 4:6-8", "expl": "The Lord used a gourd and a worm to teach Jonah about mercy", "emoji": "🌱☀️🐛😠", "prompt": "Which story is this?", "story": "Jonah’s gourd (Jonah 4)", "ctx": "After Nineveh was spared, Jonah sat outside the city sulking. The Lord made a gourd grow to shade him, then sent a worm to wither it. When Jonah grieved over the plant, the Lord asked whether He should not care even more about the more than 120,000 people of Nineveh."}, {"options": ["Isaiah's lips touched by a coal", "Daniel's food test", "Psalm 23", "Jonah and the great fish"], "answer": 1, "ref": "Daniel 1:12-15", "expl": "After ten days on pulse and water they looked healthier", "emoji": "🥗💧🔟📅💪", "prompt": "Which story is this?", "story": "Daniel’s food test (Daniel 1)", "ctx": "Daniel and three friends were young Jewish captives chosen for training in the Babylonian king’s court. Rather than defile themselves with the king’s food and wine, they asked to eat pulse (vegetables) and drink water for ten days. At the end they were healthier than the others, and God gave them knowledge and wisdom."}, {"options": ["Naaman healed", "The tower of Babel", "Noah’s ark", "Nebuchadnezzar's dream of the image"], "answer": 2, "ref": "Genesis 6 to 9", "expl": "Rain fell forty days and forty nights", "emoji": "🚢🌧️🐘🦒🌈", "prompt": "Which story is this?", "story": "Noah and the Flood (Genesis 6 to 9)", "ctx": "The earth had become filled with violence, so the Lord told Noah, a just man, to build an ark. Noah, his family, and the animals entered, and it rained forty days and forty nights. Afterward the Lord set a rainbow in the cloud as a token of His covenant never again to flood the whole earth."}, {"options": ["Joseph sold into Egypt", "Nebuchadnezzar's dream of the image", "Noah’s ark", "The valley of dry bones"], "answer": 0, "ref": "Genesis 37", "expl": "His brothers sold him for twenty pieces of silver", "emoji": "🧥🌈😠🕳️💰", "prompt": "Which story is this?", "story": "Joseph sold into Egypt (Genesis 37)", "ctx": "Jacob loved Joseph and gave him a coat of many colours, and Joseph dreamed that his brothers would bow to him. Jealous, his brothers threw him into a pit, then sold him to traders for twenty pieces of silver. They dipped his coat in goat’s blood and let their father believe he was dead."}, {"options": ["Jacob’s ladder", "Crossing the Red Sea", "Nehemiah rebuilds the wall", "Joseph sold into Egypt"], "answer": 1, "ref": "Exodus 14", "expl": "Israel crossed on dry ground", "emoji": "🌊🚶🚶🌊🐎💦", "prompt": "Which story is this?", "story": "Crossing the Red Sea (Exodus 14)", "ctx": "After the plagues, Pharaoh let Israel go, then changed his mind and chased them with his chariots. Trapped against the sea, the people were terrified, but Moses told them to “stand still, and see the salvation of the Lord.” The waters parted, Israel crossed on dry ground, and the waters returned on the Egyptian army."}, {"options": ["The fiery furnace", "Noah’s ark", "Ruth and Naomi", "The walls of Jericho"], "answer": 3, "ref": "Joshua 6", "expl": "The walls fell after seven days of marching", "emoji": "🎺🎺7️⃣🧱💥", "prompt": "Which story is this?", "story": "The walls of Jericho (Joshua 6)", "ctx": "The Lord told Joshua to have Israel march around Jericho once a day for six days, with priests blowing rams’ horn trumpets before the ark. On the seventh day they circled it seven times, the people shouted, and the walls fell down flat. Victory came by obedience, not by strength."}, {"options": ["David and Goliath", "Noah’s ark", "Jonah and the great fish", "The valley of dry bones"], "answer": 0, "ref": "1 Samuel 17", "expl": "One stone, and the battle was the Lord’s", "emoji": "👦🪨🎯🗿", "prompt": "Which story is this?", "story": "David and Goliath (1 Samuel 17)", "ctx": "For forty days the giant Goliath defied Israel’s army. Young David, who had killed a lion and a bear while protecting his sheep, refused King Saul’s armor and faced him wi <script>(function(){

});
if (code){ pid=store('pid_'+code)||''; }
if (pid) poll(); else joinScreen();
setInterval(poll, 1200);
})();
