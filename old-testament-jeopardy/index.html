<style>
  :root{
    --navy:#0B1D3A;
    --navy-dark:#061225;
    --navy-light:#132a52;
    --gold:#D9A544;
    --gold-light:#F0CB77;
    --maroon:#7A2331;
    --maroon-light:#9C3A48;
    --cream:#F3ECD8;
    --ink:#1F1A12;
    --white:#FFFFFF;
    --used:#0a1730;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--navy-dark);
    color:var(--white);
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Cinzel',serif;
  }

  /* ---------- SETUP SCREEN ---------- */
  #setupScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at top, var(--navy-light) 0%, var(--navy-dark) 70%);
    padding:24px;
  }
  .setupCard{
    background:var(--cream);
    color:var(--ink);
    border-radius:14px;
    max-width:560px;
    width:100%;
    padding:40px;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
    border:3px solid var(--gold);
  }
  .setupCard h1{
    font-size:28px;
    margin:0 0 6px;
    color:var(--navy);
    letter-spacing:0.5px;
  }
  .setupCard .sub{
    font-size:14px;
    color:var(--maroon);
    margin:0 0 28px;
    font-weight:600;
  }
  .field{margin-bottom:18px;}
  .field label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    font-weight:700;
    margin-bottom:6px;
    color:var(--navy);
  }
  select, input[type="text"], input[type="number"]{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:2px solid #cfc4a0;
    font-size:15px;
    font-family:'Inter',sans-serif;
    background:var(--white);
    color:var(--ink);
  }
  #teamNameFields{display:grid; gap:10px;}
  .startBtn{
    margin-top:10px;
    width:100%;
    padding:14px;
    background:var(--maroon);
    color:var(--white);
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.03em;
    cursor:pointer;
    font-family:'Cinzel',serif;
    transition:background .15s ease;
  }
  .startBtn:hover{background:var(--maroon-light);}

  /* ---------- GAME SCREEN ---------- */
  #gameScreen{display:none; padding:18px 22px 40px;}
  .topBar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:16px;
  }
  .roundTabs{display:flex; gap:8px;}
  .roundTab{
    padding:10px 18px;
    border-radius:8px;
    border:2px solid var(--gold);
    background:transparent;
    color:var(--gold-light);
    font-family:'Cinzel',serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    letter-spacing:0.03em;

  .roundTab.active{

    color:var(--navy-dark);
  }
  .utilBtns{display:flex; gap:8px; flex-wrap:wrap;}
  .utilBtn{
    padding:8px 14px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.25);
    background:var(--navy-light);
    color:var(--white);
    font-size:12px;
    cursor:pointer;
    font-weight:600;
  }
  .utilBtn:hover{background:#1c3a6b;}
  .utilBtn.danger{border-color:var(--maroon-light); color:#ffb9c0;}

  .doubleBanner{
    display:none;
    background:linear-gradient(90deg, var(--maroon), var(--maroon-light));
    border-left:5px solid var(--gold);
    padding:10px 16px;
    border-radius:8px;
    margin-bottom:14px;
    font-size:13px;
    line-height:1.5;
  }
  .doubleBanner.show{display:block;}
  .doubleBanner b{font-family:'Cinzel',serif;}

  /* Scoreboard */
  #scoreboard{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:12px;
    margin-bottom:20px;
  }
  .teamCard{
    background:var(--cream);
    color:var(--ink);
    border-radius:10px;
    padding:12px 14px;
    border:2px solid var(--gold);
  }
  .teamCard .tName{
    font-weight:800;
    font-size:14px;
    margin-bottom:2px;
    border:none;
    background:transparent;
    color:var(--navy);
    width:100%;
    font-family:'Inter',sans-serif;
  }
  .teamCard .tScore{
    font-family:'Cinzel',serif;
    font-size:26px;
    font-weight:700;
    color:var(--maroon);
    margin:2px 0 8px;
  }
  .scoreAdjust{display:flex; gap:6px;}
  .scoreAdjust input{
    width:70px;
    padding:6px;
    font-size:13px;
  }
  .scoreAdjust button{
    padding:6px 9px;
    font-size:13px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    font-weight:700;
  }
  .scoreAdjust .plusBtn{background:#2f7a4f; color:white;}
  .scoreAdjust .minusBtn{background:var(--maroon); color:white;}

  /* Board grid */
  .roundTitle{
    text-align:center;
    font-size:20px;
    margin:6px 0 16px;
    color:var(--gold-light);
    letter-spacing:0.04em;
  }
  .board{
    display:none;
    grid-template-columns:repeat(5, 1fr);
    gap:6px;
  }
  .board.active{display:grid;}
  .catHeader{
    background:var(--navy);
    border:2px solid var(--gold);
    color:var(--white);
    font-family:'Cinzel',serif;
    font-size:13px;
    font-weight:700;
    text-align:center;
    padding:12px 6px;
    border-radius:6px;
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    letter-spacing:0.02em;
    text-transform:uppercase;
  }
  .clueCell{
    position:relative;
    background:linear-gradient(160deg, var(--navy-light), var(--navy));
    border:2px solid var(--gold);
    border-radius:6px;
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-family:'Cinzel',serif;
    font-size:24px;
    font-weight:700;
    color:var(--gold-light);
    transition:transform .1s ease, background .15s ease;
  }
  .clueCell:hover{background:linear-gradient(160deg, #1c3a6b, var(--navy-light)); transform:scale(1.02);}
  .clueCell.used{
    background:var(--used);
    color:#3c4a68;
    cursor:default;
    border-color:#2a3c60;
  }
  .clueCell.used:hover{transform:none;}
  .toggleDot{
    position:absolute;
    top:4px;
    right:4px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.4);
    cursor:pointer;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    line-height:1;
  }
  .toggleDot:hover{background:rgba(255,255,255,0.35);}

  /* Modal */
  #modalOverlay{
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.75);

    justify-content:center;
    padding:20px;
    z-index:50;

  #modalOverlay.show{display:flex;}
  .modalCard{
    background:var(--cream);
    color:var(--ink);
    border-radius:14px;
    max-width:640px;
    width:100%;
    padding:32px;
    border:3px solid var(--gold);

    overflow-y:auto;

  .modalMeta{

    font-weight:700;
    color:var(--maroon);

  .modalQuestion{

    font-weight:600;
    line-height:1.4;
    margin-bottom:18px;
    color:var(--navy);

    border-radius:8px;
    border:none;
    background:var(--navy);
    color:var(--white);
    font-weight:700;
    cursor:pointer;
    font-size:13px;
    margin-bottom:16px;
  }
  .revealBox{
    display:none;
    background:var(--white);
    border-left:4px solid var(--gold);
    padding:14px 16px;
    border-radius:8px;
    margin-bottom:18px;
    font-size:14px;
    line-height:1.5;
  }
  .revealBox.show{display:block;}
  .revealBox .refLine{font-weight:800; color:var(--maroon); margin-bottom:4px;}
  .ctxBox{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed #cfc4a0;}
  .ctxBox.on{display:block;}
  .ctxBox .ctxH{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--maroon);margin-bottom:4px;}
  .ctxBox b{display:block;font-size:15px;color:var(--navy);margin-bottom:4px;}
  .ctxBox p{margin:0;font-size:14px;line-height:1.55;color:#2b2418;}
  .teamAwardGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:8px;
    margin-bottom:12px;
  }
  .awardBtn{
    padding:10px 8px;
    border-radius:8px;
    border:2px solid #2f7a4f;
    background:#eaf5ee;
    color:#1f5c38;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .awardBtn:hover{background:#d9efe0;}
  .modalFooter{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .footerBtn{
    padding:10px 14px;
    border-radius:8px;
    border:none;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .noAnswerBtn{background:#e0d9bf; color:var(--ink);}
  .cancelBtn{background:transparent; color:var(--maroon); border:2px solid var(--maroon);}

  @media (max-width:820px){
    .board{grid-template-columns:repeat(5, minmax(70px,1fr)); overflow-x:auto;}
    .catHeader{font-size:10px; padding:8px 4px;}
    .clueCell{font-size:16px; min-height:56px;}
  }
</style>
</head>
<body>

<!-- ============ SETUP SCREEN ============ -->
<div id="setupScreen">
  <div class="setupCard">
    <h1>Old Testament Jeopardy</h1>
    <p class="sub">Genesis through Job, plus Pearl of Great Price</p>

    <div class="field">
      <label for="numTeams">Number of teams</label>
      <select id="numTeams">
        <option value="2">2 teams</option>
        <option value="3">3 teams</option>
        <option value="4" selected>4 teams</option>
        <option value="5">5 teams</option>
        <option value="6">6 teams</option>
      </select>
    </div>

    <div class="field">
      <label>Team names</label>
      <div id="teamNameFields"></div>
    </div>

    <button class="startBtn" onclick="startGame()">Start Game</button>
  </div>
</div>

<!-- ============ GAME SCREEN ============ -->
<div id="gameScreen">
  <div class="topBar">
    <div class="roundTabs">
      <button class="roundTab active" id="tabSingle" onclick="switchRound('single')">Jeopardy</button>
      <button class="roundTab" id="tabDouble" onclick="switchRound('double')">Deborah Double Jeopardy</button>
    </div>
    <div class="utilBtns">
      <button class="utilBtn" onclick="resetBoard()">Reset board marks</button>
      <button class="utilBtn danger" onclick="newGame()">New game / re-setup</button>
    </div>
  </div>

  <div class="doubleBanner" id="doubleBanner">
    <b>Deborah Double Jeopardy:</b> named for the prophetess and judge of Israel (Judges 4 to 5) who led with double the courage. Values are doubled for this round.
  </div>

  <div id="scoreboard"></div>

  <h2 class="roundTitle" id="roundTitle">Old Testament Jeopardy: Genesis to Job</h2>

  <div class="board active" id="boardSingle"></div>
  <div class="board" id="boardDouble"></div>
</div>

<!-- ============ MODAL ============ -->
<div id="modalOverlay">
  <div class="modalCard">
    <div class="modalMeta" id="modalMeta"></div>
    <div class="modalQuestion" id="modalQuestion"></div>
    <button class="revealBtn" id="revealBtn" onclick="revealAnswer()">Reveal scripture reference and answer</button>
    <div class="revealBox" id="revealBox">
      <div class="refLine" id="refLine"></div>
      <div id="answerLine"></div>
      <div class="ctxBox" id="ctxBox"><div class="ctxH">The story</div><b id="ctxTitle"></b><p id="ctxText"></p></div>
    </div>
    <div style="font-size:12px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700; color:var(--navy); margin-bottom:8px;">Award points to</div>
    <div class="teamAwardGrid" id="teamAwardGrid"></div>
    <div class="modalFooter">
      <button class="footerBtn noAnswerBtn" onclick="noOneAnswered()">No one answered correctly</button>
      <button class="footerBtn cancelBtn" onclick="closeModal(false)">Cancel, do not mark used</button>
    </div>
  </div>
</div>

<script>
/* ------------------ DATA ------------------ */
const data = {
  single: {
    label: "Old Testament Jeopardy: Genesis to Job",
    values: [100,200,300,400,500],
    categories: [
      {
        title: "Creation and the Fall",
        clues: [
          {q:"On which day of the Creation did God create man and woman?", ref:"Genesis 1:26-31", a:"The sixth day."},
          {q:"What were the two special trees in the middle of the Garden of Eden?", ref:"Genesis 2:9; 3:3", a:"The tree of life and the tree of knowledge of good and evil."},
          {q:"What did the Lord tell Eve about her sorrow and her relationship to Adam after the Fall?", ref:"Genesis 3:16", a:"Her sorrow in childbearing would be multiplied, and her desire would be to her husband, who would rule over her."},
          {q:"What did Cain say when the Lord asked him where his brother Abel was?", ref:"Genesis 4:9", a:"\"Am I my brother's keeper?\""},
          {q:"According to the book of Moses, what did Satan seek to destroy when he rebelled against the Father's plan?", ref:"Moses 4:1-4", a:"The agency of man."}
        ]
      },
      {
        title: "Noah and the Tower of Babel",
        clues: [
          {q:"How old was Noah when the flood came upon the earth?", ref:"Genesis 7:6", a:"Six hundred years old."},
          {q:"What kind of animals did Noah take into the ark by sevens?", ref:"Genesis 7:2-3", a:"Clean beasts and clean fowls."},
          {q:"What sign did God give as a token of His covenant never again to destroy the whole earth by flood?", ref:"Genesis 9:12-13", a:"The rainbow."},
          {q:"What were the people at Babel building, and why?", ref:"Genesis 11:4", a:"A tower to reach unto heaven, so they could make themselves a name."},
          {q:"What happened to the language of the people because of their pride at the Tower of Babel?", ref:"Genesis 11:6-9", a:"The Lord confounded their language so they could not understand one another, and scattered them abroad."}

      {
        title: "Abraham and Sarah",
        clues: [
          {q:"What new names did the Lord give to Abram and Sarai?", ref:"Genesis 17:5, 15", a:"Abraham and Sarah."},
          {q:"About how old was Sarah when she gave birth to Isaac?", ref:"Genesis 17:17; 21:5", a:"About ninety years old."},
          {q:"What did the Lord command Abraham to offer up on Mount Moriah?", ref:"Genesis 22:2", a:"His son Isaac."},
          {q:"According to the book of Abraham, what did the Lord promise Abraham concerning the priesthood and his posterity?", ref:"Abraham 2:9-11", a:"That the priesthood would continue through his lineage, and all nations of the earth would be blessed through his seed."},

      },
      {
        title: "Isaac and Jacob",
        clues: [
          {q:"Who did Abraham's servant find at the well to become Isaac's wife?", ref:"Genesis 24:15-67", a:"Rebekah."},
          {q:"What did Esau trade to Jacob for a mess of pottage?", ref:"Genesis 25:29-34", a:"His birthright."},

        ]
      },
      {
        title: "Joseph in Egypt",
        clues: [
          {q:"What did Joseph's brothers do to his coat before bringing it to their father, Jacob?", ref:"Genesis 37:31-32", a:"They dipped it in the blood of a goat."},

  double: {
    label: "Deborah Double Jeopardy",

        title: "The Book of Job",

          {q:"What did Job say he would do even though the Lord slay him?", ref:"Job 13:15", a:"\"Yet will I trust in him.\""},

."], ["Lot’s wife (Genesis 19)", "Angels led Lot and his family out of the wicked city of Sodom before it was destroyed and warned them not to look back. Lot’s wife looked back and became a pillar of salt. Jesus later warned His disciples, “Remember Lot’s wife” (Luke 17:32), a caution against longing for what we should leave behind."], ["Joseph tests his brothers (Genesis 42 to 44)", "During the famine, Joseph’s brothers came to Egypt to buy grain and bowed before him without recognizing him. Joseph tested them to see if they had changed, secretly returning their money in their sacks and later demanding their youngest brother, Benjamin. Judah offered himself as a slave in Benjamin’s place."]]; var n = 0; ['single','double'].forEach(function(r){ data[r].categories.forEach(function(c){ c.clues.forEach(function(q){ var s = ST[n++]; if (s) { q.story = s[0]; q.ctx = s[1]; } }); }); }); })();


/* ------------------ STATE ------------------ */
let teams = [];
let usedState = { single: {}, double: {} };
let currentRound = 'single';
let pendingClue = null; // {round, catIdx, clueIdx, value}

/* ------------------ SETUP SCREEN ------------------ */
const numTeamsSelect = document.getElementById('numTeams');
function renderTeamNameFields(){
  const n = parseInt(numTeamsSelect.value, 10);
  const container = document.getElementById('teamNameFields');
  container.innerHTML = '';
  for(let i=0; i<n; i++){
    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'teamNameInput' + i;
    input.value = 'Team ' + (i+1);
    container.appendChild(input);
  }
}
numTeamsSelect.addEventListener('change', renderTeamNameFields);
renderTeamNameFields();

function startGame(){
  const n = parseInt(numTeamsSelect.value, 10);
  teams = [];
  for(let i=0; i<n; i++){
    const nameInput = document.getElementById('teamNameInput' + i);
    const name = (nameInput && nameInput.value.trim()) || ('Team ' + (i+1));
    teams.push({name: name, score: 0});
  }
  initUsedState();
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  renderScoreboard();
  renderBoard('single');
  renderBoard('double');
}

function initUsedState(){
  ['single','double'].forEach(roundKey => {
    usedState[roundKey] = {};
    data[roundKey].categories.forEach((cat, ci) => {
      usedState[roundKey][ci] = {};
      cat.clues.forEach((clue, qi) => {
        usedState[roundKey][ci][qi] = false;
      });
    });
  });
}

/* ------------------ SCOREBOARD ------------------ */
function renderScoreboard(){
  const board = document.getElementById('scoreboard');
  board.innerHTML = '';
  teams.forEach((team, idx) => {
    const card = document.createElement('div');
    card.className = 'teamCard';
    card.innerHTML = `
      <input class="tName" value="${escapeHtml(team.name)}" onchange="renameTeam(${idx}, this.value)">
      <div class="tScore" id="scoreVal${idx}">${team.score}</div>
      <div class="scoreAdjust">
        <input type="number" id="adjInput${idx}" value="100" step="50">
        <button class="plusBtn" onclick="adjustScore(${idx}, 1)">+</button>
        <button class="minusBtn" onclick="adjustScore(${idx}, -1)">-</button>
      </div>
    `;
    board.appendChild(card);
  });
}
function renameTeam(idx, newName){
  teams[idx].name = newName.trim() || teams[idx].name;
}
function adjustScore(idx, direction){
  const input = document.getElementById('adjInput' + idx);
  const amount = parseInt(input.value, 10) || 0;
  teams[idx].score += (direction * amount);
  document.getElementById('scoreVal' + idx).textContent = teams[idx].score;
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ------------------ BOARD ------------------ */
function renderBoard(roundKey){
  const boardEl = document.getElementById(roundKey === 'single' ? 'boardSingle' : 'boardDouble');
  boardEl.innerHTML = '';
  const round = data[roundKey];

  round.categories.forEach(cat => {
    const header = document.createElement('div');
    header.className = 'catHeader';
    header.textContent = cat.title;
    boardEl.appendChild(header);
  });

  round.values.forEach((value, rowIdx) => {
    round.categories.forEach((cat, catIdx) => {
      const used = usedState[roundKey][catIdx][rowIdx];
      const cell = document.createElement('div');
      cell.className = 'clueCell' + (used ? ' used' : '');
      cell.innerHTML = `$${value}<div class="toggleDot" title="Manually mark used or available" onclick="toggleManual(event,'${roundKey}',${catIdx},${rowIdx})">${used ? '✓' : ''}</div>`;
      if(!used){
        cell.addEventListener('click', (e) => {
          if(e.target.classList.contains('toggleDot')) return;
          openClue(roundKey, catIdx, rowIdx, value);
        });
      }
      boardEl.appendChild(cell);
    });
  });
}

function toggleManual(e, roundKey, catIdx, rowIdx){
  e.stopPropagation();
  usedState[roundKey][catIdx][rowIdx] = !usedState[roundKey][catIdx][rowIdx];
  renderBoard(roundKey);
}

function switchRound(roundKey){
  currentRound = roundKey;
  document.getElementById('tabSingle').classList.toggle('active', roundKey === 'single');
  document.getElementById('tabDouble').classList.toggle('active', roundKey === 'double');
  document.getElementById('boardSingle').classList.toggle('active', roundKey === 'single');
  document.getElementById('boardDouble').classList.toggle('active', roundKey === 'double');
  document.getElementById('roundTitle').textContent = data[roundKey].label;
  document.getElementById('doubleBanner').classList.toggle('show', roundKey === 'double');
}

function resetBoard(){
  if(!confirm('Reset all clue marks on both boards? Scores will not change.')) return;
  initUsedState();
  renderBoard('single');
  renderBoard('double');
}

function newGame(){
  if(!confirm('Start a brand new game? This clears all scores and board progress.')) return;
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('setupScreen').style.display = 'flex';
}

/* ------------------ MODAL ------------------ */
function openClue(roundKey, catIdx, clueIdx, value){
  const cat = data[roundKey].categories[catIdx];
  const clue = cat.clues[clueIdx];
  pendingClue = {roundKey, catIdx, clueIdx, value};

  document.getElementById('modalMeta').textContent = `${cat.title}: $${value}`;
  document.getElementById('modalQuestion').textContent = clue.q;
  document.getElementById('refLine').textContent = clue.ref;
  document.getElementById('answerLine').textContent = clue.a;
  var cb = document.getElementById('ctxBox');
  if (clue.story) { document.getElementById('ctxTitle').textContent = clue.story; document.getElementById('ctxText').textContent = clue.ctx; cb.classList.add('on'); } else { cb.classList.remove('on'); }
  document.getElementById('revealBox').classList.remove('show');
  document.getElementById('revealBtn').style.display = 'inline-block';

  const awardGrid = document.getElementById('teamAwardGrid');
  awardGrid.innerHTML = '';
  teams.forEach((team, idx) => {
    const btn = document.createElement('button');
    btn.className = 'awardBtn';
    btn.textContent = `${team.name} (+$${value})`;
    btn.onclick = () => awardPoints(idx);
    awardGrid.appendChild(btn);
  });

  document.getElementById('modalOverlay').classList.add('show');
}

function revealAnswer(){
  document.getElementById('revealBox').classList.add('show');
}

function awardPoints(teamIdx){
  if(!pendingClue) return;
  teams[teamIdx].score += pendingClue.value;
  markUsedAndClose();
}

function noOneAnswered(){
  markUsedAndClose();
}

function markUsedAndClose(){
  if(pendingClue){
    usedState[pendingClue.roundKey][pendingClue.catIdx][pendingClue.clueIdx] = true;
    renderBoard(pendingClue.roundKey);
  }
  renderScoreboard();
  closeModal(false);
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  pendingClue = null;
}
</script>
