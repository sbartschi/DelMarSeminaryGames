<style>:root{--bg-page:#0E1B2B;--bg-panel:#16273B;--bg-panel-raised:#1E3450;--ink:#F1F6FB;--muted:#9FB4C9;--line:rgba(241,246,251,0.14);--accent:#9C7BD6;--ok:#3FA66B;--bad:#C65B5B;color-scheme:dark;}

html,body{margin:0;min-height:100%;background:var(--bg-page);color:var(--ink);font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 50px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
h1{font-family:'Fraunces',Georgia,serif;font-size:1.9rem;margin:0 0 8px;}
h2{font-family:'Fraunces',Georgia,serif;font-size:1.3rem;margin:0 0 10px;}

.muted{color:var(--muted);font-size:0.95rem;}
.btn{font:inherit;font-weight:700;padding:14px 20px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);cursor:pointer;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121D;}
.btn.big{font-size:1.1rem;width:100%;padding:18px;margin-top:6px;}
.btn[disabled]{opacity:0.4;cursor:default;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
input[type=text]{font:inherit;font-size:1.1rem;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);width:100%;margin-bottom:10px;}
.qr-box{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:14px;margin:10px auto;width:max-content;max-width:100%;}
.code{font-family:'IBM Plex Mono',monospace;font-size:2.4rem;letter-spacing:0.18em;text-align:center;color:var(--accent);margin:6px 0;}
.tag{display:inline-block;background:var(--bg-panel-raised);border-radius:20px;padding:6px 14px;margin:4px;font-size:0.95rem;}
.lb{width:100%;border-collapse:collapse;margin-top:6px;}
.lb td,.lb th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:1rem;}
.lb th{color:var(--muted);font-weight:600;font-size:0.78rem;text-transform:uppercase;}
.q{font-family:'Fraunces',Georgia,serif;font-size:1.6rem;line-height:1.35;margin:8px 0 16px;}
.verse{font-family:'Fraunces',Georgia,serif;font-size:1.45rem;line-height:1.45;font-style:italic;margin:8px 0 16px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt{padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--bg-panel-raised);font-size:1.1rem;}
.opt.right{border-color:var(--ok);background:rgba(63,166,107,0.25);}
.opt .n{font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-right:8px;}
.ans{display:block;width:100%;text-align:left;font:inherit;font-size:1.1rem;padding:18px 16px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg-panel-raised);color:var(--ink);cursor:pointer;}
.ans.t{background:rgba(63,166,107,0.2);border-color:var(--ok);text-align:center;font-size:1.4rem;font-weight:700;}
.ans.f{background:rgba(198,91,91,0.2);border-color:var(--bad);text-align:center;font-size:1.4rem;font-weight:700;}
.timerbar{height:8px;border-radius:4px;background:var(--bg-panel-raised);overflow:hidden;margin:6px 0 12px;}
.timerbar i{display:block;height:100%;background:var(--accent);transition:width .25s linear;}
.result-big{font-family:'Fraunces',Georgia,serif;font-size:2.2rem;font-weight:700;margin:6px 0;}
.good{color:var(--ok);} .bad{color:var(--bad);}
.reveal{background:var(--bg-panel-raised);border-radius:12px;padding:14px 16px;margin-top:6px;}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:20px 0;}
.podium .spot{background:var(--bg-panel-raised);border-radius:10px 10px 0 0;padding:14px 16px;text-align:center;min-width:100px;}
.podium .g1{min-height:130px;background:linear-gradient(180deg,#F0CB77,#C9A227);color:#2b2418;}
.podium .g2{min-height:96px;} .podium .g3{min-height:72px;}
.ph{max-width:480px;margin:0 auto;}
.center{text-align:center;}
@media (max-width:600px){ .opts{grid-template-columns:1fr;} .q{font-size:1.3rem;} .verse{font-size:1.2rem;} }
.emoji{font-size:4rem;line-height:1.3;text-align:center;margin:10px 0 18px;letter-spacing:0.1em;}
.order{margin:0 0 6px;padding-left:28px;font-size:1.15rem;line-height:1.7;}
.order li::marker{color:var(--accent);font-weight:700;}
.ans.picked{border-color:var(--accent);background:rgba(255,255,255,0.08);opacity:0.75;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);margin-right:10px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.ans.picked .badge{background:var(--accent);color:#06121D;border-color:var(--accent);}
.scene{font-size:1.15rem;line-height:1.5;margin:4px 0 10px;}
.meters{display:grid;gap:10px;}
.meter{font-size:0.95rem;}
.mtrack{height:10px;border-radius:5px;background:var(--bg-panel-raised);overflow:hidden;margin-top:4px;}
.mtrack i{display:block;height:100%;background:var(--accent);transition:width .4s ease;}
.tally{display:grid;gap:8px;margin-top:8px;}
.trow{padding:10px 12px;border-radius:10px;border:1px solid var(--line);}
.trow.dec{border-color:var(--accent);background:rgba(255,255,255,0.05);}
.trow .n,.opt .n{font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-right:8px;}
.did{border-color:var(--accent);}
ul.plain{margin:0;padding-left:20px;line-height:1.6;}
.pts{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;color:var(--muted);margin-left:6px;white-space:nowrap;}
.pts.top{color:var(--accent);font-weight:700;}

<script>var CFG={"title": "Daniel in Babylon", "mode": "personal", "seconds": 35, "accent": "#9C7BD6", "meters": [{"k": "faith", "label": "Faithfulness", "start": 50, "color": "#E3B04B"}, {"k": "favor", "label": "Influence in Babylon", "start": 50, "color": "#9C7BD6"}, {"k": "safety", "label": "Safety", "start": 50, "color": "#4FA3D1"}], "prompt": "What do you do?", "didLabel": "What Daniel and his friends did", "how": "Each student is a young captive in Babylon facing the same choices as Daniel and his friends (Daniel 1 to 6). Choices are private and change your own three meters: Faithfulness, Influence in Babylon, and Safety. You earn 1,000 points for matching what Daniel or his friends did, and partial credit for other faithful or wise choices. Most rounds have two good-sounding answers, so knowing the story matters.", "waitText": "Watch the screen. You have just arrived in Babylon", "endText": "Daniel served faithfully from Nebuchadnezzar to Cyrus, and the Lord blessed him, though Daniel and his friends were willing to obey \"but if not\" (Daniel 1:21; 3:18).", "discuss": ["Which round had two answers that felt almost the same? What was the real difference?", "Faithful choices sometimes lowered Safety at first. How did the Lord bless Daniel anyway?", "Daniel often found a wise way to be faithful, like proposing a ten-day test. What is a wise, faithful way to handle something you face?"], "rounds": [{"title": "The king's table", "ref": "Daniel 1:5-16", "scene": "You have been chosen to train in the king's palace. Every day you are served the king's rich food and wine, which goes against the law of the Lord. The official in charge is afraid of the king.", "options": [{"t": "Ask the official in charge for permission not to eat it", "pts": 700, "fx": {"faith": 10}, "out": "He is sympathetic, but afraid the king will have his head"}, {"t": "Propose a ten-day test of vegetables and water to the steward", "pts": 1000, "fx": {"faith": 15, "favor": 10}, "out": "After ten days you look healthier than the others, and the steward agrees"}, {"t": "Eat the bread, but quietly skip the meat and wine", "pts": 400, "fx": {"faith": 5}, "out": "You avoid some of it, but the issue is still there"}, {"t": "Eat it for now and keep the law once you are home", "pts": 0, "fx": {"faith": -15, "safety": 5}, "out": "You blend in, but home may be many years away"}], "did": "Daniel first asked the prince of the eunuchs, who was afraid (Daniel 1:8-10). Then he proposed a ten-day test of pulse and water to the steward, and God gave the four young men \"knowledge and skill in all learning and wisdom\" (Daniel 1:11-17)."}, {"title": "The decree to kill the wise men", "ref": "Daniel 2:12-18", "scene": "The king has ordered every wise man in Babylon killed because no one could tell his dream. Arioch, captain of the guard, arrives to carry out the order, and you are on the list.", "options": [{"t": "Gather your friends and pray first, before talking to anyone", "pts": 700, "fx": {"faith": 15}, "out": "You feel peace, but Arioch is waiting"}, {"t": "Ask Arioch why the decree is so hasty, then ask the king for time", "pts": 1000, "fx": {"faith": 10, "favor": 10, "safety": 10}, "out": "Arioch explains, and the king gives you time"}, {"t": "Offer to interpret the dream if the king will just tell it to you", "pts": 300, "fx": {"safety": -5}, "out": "That is exactly what the other wise men already tried"}, {"t": "Slip out of the city until it blows over", "pts": 0, "fx": {"favor": -15}, "out": "You are safe for now, but the others are not"}], "did": "Daniel \"answered with counsel and wisdom to Arioch,\" asked the king for time, and then went home and asked his friends to \"desire mercies of the God of heaven\" (Daniel 2:14-18)."}, {"title": "Promoted", "ref": "Daniel 2:46-49", "scene": "You interpreted the dream and told the king it came from God. The king falls on his face before you, gives you great gifts, and makes you ruler over the province of Babylon.", "options": [{"t": "Thank the king, accept the gifts, and keep serving faithfully", "pts": 700, "fx": {"favor": 10}, "out": "You are now in a position to do much good"}, {"t": "Turn down the gifts so no one thinks you can be bought", "pts": 500, "fx": {"faith": 5, "favor": -5}, "out": "Some admire you; the king is a little offended"}, {"t": "Ask the king to promote your three friends too", "pts": 1000, "fx": {"faith": 10, "favor": 10}, "out": "Your friends rise with you"}, {"t": "Ask the king to let the captives of Judah go home", "pts": 300, "fx": {"favor": -10}, "out": "The king is not ready for that"}], "did": "Daniel accepted the king's gifts and position, then \"requested of the king, and he set Shadrach, Meshach, and Abed-nego, over the affairs of the province of Babylon\" (Daniel 2:48-49)."}, {"title": "The golden image", "ref": "Daniel 3:1-18", "scene": "The king sets up a golden image and commands everyone to bow when the music plays. Your friends refused, and now the angry king gives you one more chance before the fiery furnace.", "options": [{"t": "Tell the king your God will surely deliver you, so his furnace does not scare you", "pts": 600, "fx": {"faith": 10, "safety": -10}, "out": "Bold faith, but are you sure what God will do?"}, {"t": "Respectfully ask the king to excuse you because of your religion", "pts": 500, "fx": {"faith": 5}, "out": "The king refuses; he wants an answer"}, {"t": "Tell the king God is able to deliver you, but if not, you still will not bow", "pts": 1000, "fx": {"faith": 20, "safety": -10, "favor": 10}, "out": "You are thrown in the furnace, and a fourth figure walks with you in the fire"}, {"t": "Stay out of sight and hope no one reports you", "pts": 300, "fx": {"safety": 5}, "out": "It might work once, but the command still stands"}], "did": "They said God \"is able to deliver us... But if not... we will not serve thy gods\" (Daniel 3:17-18). They were cast into the furnace, and the king saw four men walking in the fire, unhurt (Daniel 3:25-27)."}, {"title": "The writing on the wall", "ref": "Daniel 5:13-29", "scene": "At King Belshazzar's feast, a hand writes on the wall. The king offers you scarlet clothing, a gold chain, and the third highest place in the kingdom to read it. The message is very bad news for the king.", "options": [{"t": "Accept the gifts, then read the message honestly", "pts": 600, "fx": {"faith": 10, "favor": 10}, "out": "You told the truth, and you are richer for it"}, {"t": "Refuse the gifts, then read and explain the message honestly", "pts": 1000, "fx": {"faith": 15, "favor": 10}, "out": "You told the truth with no strings attached"}, {"t": "Read it, but encourage the king that there is still time to change", "pts": 400, "fx": {"favor": 5}, "out": "Kind, but it softens what the Lord said"}, {"t": "Ask to speak with the king privately first", "pts": 300, "fx": {"safety": 5}, "out": "The whole court is waiting to hear"}], "did": "Daniel said, \"Let thy gifts be to thyself, and give thy rewards to another; yet I will read the writing.\" Belshazzar honored him anyway, and that night Belshazzar was slain (Daniel 5:17, 29-30)."}, {"title": "The decree against prayer", "ref": "Daniel 6:4-23", "scene": "Jealous leaders trick King Darius into signing a law: for thirty days, anyone who prays to any god except the king will be thrown into the den of lions. You are one of the king's favorite leaders.", "options": [{"t": "Keep praying, but close the windows so you do not provoke anyone", "pts": 500, "fx": {"faith": 10, "safety": 5}, "out": "You kept praying, but in hiding"}, {"t": "Ask King Darius to cancel the decree", "pts": 400, "fx": {"favor": 5}, "out": "He wants to, but a law of the Medes and Persians cannot be changed"}, {"t": "Pray in your heart only, just for thirty days", "pts": 300, "fx": {"faith": 5, "safety": 10}, "out": "Quiet prayer still counts, but your enemies are watching"}, {"t": "Keep praying as always, windows open toward Jerusalem", "pts": 1000, "fx": {"faith": 20, "safety": -10, "favor": 15}, "out": "You are cast into the den, but God sends His angel to shut the lions' mouths"}], "did": "Daniel \"kneeled upon his knees three times a day, and prayed, and gave thanks before his God, as he did aforetime.\" Darius could not change the law, but the Lord shut the lions' mouths (Daniel 6:10, 15, 22)."}], "root": "seminaryGames/daniel-babylon"};
var DBURL = "https://penny-project-fb5da-default-rtdb.firebaseio.com";
var FAKE = null; try{ if (window.parent && window.parent !== window && window.parent.FAKE) FAKE = window.parent.FAKE; }catch(e){}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dbPath(code, path){ return CFG.root + '/' + code + (path ? '/' + path : ''); }
function req(method, code, path, v){
  var p = dbPath(code, path);
  if (FAKE) return FAKE.req(method, p, v);
  var o = {method: method, cache: 'no-store'}; if (v !== undefined) o.body = JSON.stringify(v);
  return fetch(DBURL + '/' + p + '.json', o).then(function(r){ return r.json(); }).catch(function(){ return null; });
}
function jget(c,p){ return req('GET',c,p); }
function jput(c,p,v){ return req('PUT',c,p,v); }
function jpatch(c,p,v){ return req('PATCH',c,p,v); }
function jpost(c,p,v){ return req('POST',c,p,v); }
var TS = {".sv":"timestamp"};
function ranked(players){ var a=[]; for (var k in (players||{})) a.push({id:k, name:players[k].name, score:players[k].score||0}); a.sort(function(x,y){ return y.score-x.score || String(x.name).localeCompare(String(y.name)); }); return a; }
var MEM={};
function store(k, v){ if (FAKE){ if (v===undefined) return MEM[k]||null; MEM[k]=v; return; } try{ if (v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); }catch(e){ return null; } }
function optsOf(q){ return CFG.kind==='tf' ? ['True','False'] : q.options; }
function correctIdx(q){ return CFG.kind==='tf' ? (q.answer?0:1) : q.answer; }

<script>(function(){
var app=document.getElementById('app'), R=CFG.rounds, code='', pid='', room=null, busy=false, lastKey='', sending=false;
function param(n){ try{ return new URLSearchParams(location.search).get(n); }catch(e){ return null; } }
code=(param('g')||'').toUpperCase();
if (!code && FAKE && FAKE.latestCode) code=FAKE.latestCode(CFG.root);
function me(){ return (room&&room.players||{})[pid]; }
function rankOf(){ var r=ranked(room.players); for (var i=0;i<r.length;i++) if (r[i].id===pid) return i+1; return 0; }
function optsFor(rd){ return CFG.mode==='wall' ? CFG.actions.concat(rd.extra?[rd.extra]:[]) : rd.options; }
function joinScreen(msg){
  app.innerHTML='<div class="ph"><div class="eyebrow">'+esc(CFG.title)+'</div><h1>Join the game</h1><div class="card">'+
    (code?'':'<input type="text" id="cd" maxlength="4" placeholder="Game code" autocapitalize="characters">')+
    '<input type="text" id="nm" maxlength="20" placeholder="Your first name" autocomplete="off">'+
    '<button class="btn primary big" data-a="join">Join</button>'+(msg?'<p class="bad">'+esc(msg)+'</p>':'')+'</div></div>';
}
function myMeters(p){ if (CFG.mode!=='personal') return ''; var m=p.m||{}; return '<div class="card"><div class="meters">'+CFG.meters.map(function(x){ var v=m[x.k]!=null?m[x.k]:x.start; return '<div class="meter"><div class="row" style="justify-content:space-between"><span>'+esc(x.label)+'</span><span>'+Math.round(v)+'</span></div><div class="mtrack"><i style="width:'+v+'%;background:'+x.color+'"></i></div></div>'; }).join('')+'</div></div>'; }
function render(){
  var m=room.meta, p=me(), h='';
  if (!p){ store('pid_'+code,''); pid=''; joinScreen('You were removed from this game. Join again.'); return; }
  var team=CFG.mode==='wall'&&p.team!=null?' &middot; '+esc(CFG.teams[p.team]):'';
  var head='<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="muted">'+esc(p.name)+team+'</span><span class="muted">'+(p.score||0).toLocaleString()+' points</span></div>';
  if (m.phase==='lobby') h='<div class="card center"><h2>You are in</h2><p class="muted">'+esc(CFG.waitText)+'</p></div>';
  else if (m.phase==='round'){
    var rd=R[m.r], mine=((room.ans||{})[m.r]||{})[pid], o=optsFor(rd);
    h='<div class="card"><div class="eyebrow">Round '+(m.r+1)+' of '+R.length+'</div><h2>'+esc(rd.title)+'</h2><p class="scene" style="font-size:1rem">'+esc(rd.scene)+'</p></div>';
    if (mine) h+='<div class="card center"><h2>Choice locked in</h2><p class="muted">'+esc(o[mine.i].t)+'</p><p class="muted">Watch the screen for what happens</p></div>';
    else { h+='<p class="muted"><b>'+esc(rd.prompt||CFG.prompt)+'</b></p>'+o.map(function(op,i){ return '<button class="ans" data-a="pick" data-i="'+i+'"><b>'+'ABCDE'[i]+'</b> &nbsp;'+esc(op.t)+(op.hint?'<div class="muted" style="font-size:0.85rem;margin-top:4px">'+esc(op.hint)+'</div>':'')+'</button>'; }).join(''); }
    h+=myMeters(p);
  } else if (m.phase==='reveal'){
    var rd=R[m.r], o=optsFor(rd), pk=p.pick;
    h='<div class="card center"><div class="eyebrow">Round '+(m.r+1)+' results</div>'+(pk>=0?'<p>You chose: <b>'+esc(o[pk].t)+'</b></p>':'<p class="muted">You did not choose in time</p>')+
      '<div class="result-big">+'+(p.gain||0)+'</div><p class="muted">points</p>'+
      (CFG.mode==='personal'&&pk>=0&&o[pk].out?'<p>'+esc(o[pk].out)+'</p>':'')+
      (CFG.mode==='wall'&&m.res&&m.res.byTeam&&p.team!=null?'<p>'+esc(CFG.teams[p.team])+': '+esc(m.res.byTeam[p.team]||'')+'</p>':'')+
      (CFG.mode==='class'&&m.res?'<p class="muted">The council chose: '+esc(rd.options[m.res.dec].t)+'</p>':'')+
      '<p class="muted">Place '+rankOf()+' of '+Object.keys(room.players).length+'</p></div>'+myMeters(p);
  } else if (m.phase==='final'){
    h='<div class="card center"><h2>Game over</h2><div class="result-big">'+(p.score||0).toLocaleString()+'</div><p class="muted">points, place '+rankOf()+' of '+Object.keys(room.players).length+'</p><p class="muted">Look at the screen for the results</p></div>'+myMeters(p);
  }
  app.innerHTML='<div class="ph">'+head+h+'</div>';
}
function poll(){
  if (busy||!code||!pid) return; busy=true;
  jget(code,'').then(function(d){ busy=false; if (!d||!d.meta) return; room=d;
    var m=d.meta, p=me(), mine=p&&((d.ans||{})[m.r]||{})[pid];
    var k=[m.phase,m.r,!!p,!!mine,p&&p.score,p&&p.team,p&&p.gain,rankOf()].join('~'); if (k!==lastKey){ lastKey=k; render(); }
  });
}
app.addEventListener('click', function(e){
  var b=e.target.closest('[data-a]'); if (!b) return; var a=b.getAttribute('data-a');
  if (a==='join'){
    var nm=(document.getElementById('nm').value||'').trim(), cd=document.getElementById('cd');
    if (cd) code=(cd.value||'').trim().toUpperCase();
    if (!nm||!code) return; b.disabled=true;
    jget(code,'meta').then(function(m){ if (!m){ joinScreen('That game code was not found'); return; }
      return jpost(code,'players',{name:nm, score:0}).then(function(r){ pid=r&&r.name; store('pid_'+code,pid); lastKey=''; poll(); }); });
  } else if (a==='pick' && !sending){
    sending=true; var i=parseInt(b.getAttribute('data-i'),10), r=room.meta.r;
    Array.prototype.forEach.call(app.querySelectorAll('[data-a=pick]'),function(x){ x.disabled=true; }); b.style.outline='3px solid var(--accent)';
    jput(code,'ans/'+r+'/'+pid,{i:i, t:TS}).then(function(){ sending=false; lastKey=''; poll(); });
  }
});
if (code) pid=store('pid_'+code)||'';
if (pid) poll(); else joinScreen();
setInterval(poll,1200);
})();

(function () {

  function isPlayer() { return /(^|\/)(play|wordle-play|clues-play)\.html$/.test(location.pathname) || /[?&](play|join)=/.test(location.search) || location.hash === '#play'; }
  var css = document.createElement('style');
  css.textContent = '#sgHome{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:9998;display:inline-flex;align-items:center;gap:6px;' +
    'font:800 13px/1 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#EEF3FB;background:rgba(13,21,40,.88);border:1px solid rgba(160,185,230,.3);' +
    'border-radius:999px;padding:8px 13px;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}' +
    '#sgHome:hover{border-color:#1FB5A8}#sgHome:focus-visible{outline:3px solid #fff;outline-offset:2px}' +
    'body.sg-home{padding-top:48px!important;box-sizing:border-box}@media (max-width:700px){#sgHome{font-size:12px;padding:7px 11px}}';
  document.head.appendChild(css);
  if (!inFrame) {
    var a = document.createElement('a'); a.id = 'sgHome'; a.href = '../'; a.textContent = '\u2190 All games';
    a.setAttribute('aria-label', 'Back to all seminary games');
    document.body.appendChild(a);

    var hide = function () { return isPlayer() && innerWidth <= 700; };
    var sync = function () { var h = hide(); a.hidden = h; a.style.display = h ? 'none' : ''; document.body.classList.toggle('sg-home', !h); };

      [].forEach.call(document.querySelectorAll('body > *, body > * > *, body > * > * > *'), function (el) {
        if (el.id === 'sgHome' || el.tagName === 'SCRIPT' || el.tagName === 'STYLE') return;
        var mh = getComputedStyle(el).minHeight;
        if (/px$/.test(mh) && Math.abs(parseFloat(mh) - H) <= 2) el.style.minHeight = 'calc(100vh - 48px)';
      });
    };
    fit(); window.addEventListener('resize', fit); window.addEventListener('load', fit);
    var ft = null; new MutationObserver(function () { clearTimeout(ft); ft = setTimeout(fit, 200); }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden', 'style'] });
  }

  /* ---------- confetti ---------- */
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function confetti() {
    if (reduce || window.SG_NO_CONFETTI || document.getElementById('sgConfetti')) return;

    c.width = W * dpr; c.height = H * dpr; document.body.appendChild(c);
    var x = c.getContext('2d'); x.scale(dpr, dpr);
    var cols = ['#F0545C', '#3E8EF7', '#1FB5A8', '#F4B740', '#8B7CF6', '#E57AC2', '#FFFFFF'], P = [];
    for (var i = 0; i < 170; i++) P.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      vx: -1.5 + Math.random() * 3, vy: 2 + Math.random() * 3.5, r: Math.random() * 6.3, vr: -0.2 + Math.random() * 0.4, c: cols[i % cols.length] });

        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = age > 3800 ? Math.max(0, 1 - (age - 3800) / 700) : 1; x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });

  }
  window.sgConfetti = confetti;
  var FINAL = /^\s*(final (standings|results|rank|leaderboard|scores)|game over)\b/i, was = false, timer = null;
  function check() {
    var els = document.querySelectorAll('h1,h2,h3,.eyebrow,.title,.big'), now = false;
    for (var i = 0; i < els.length && !now; i++) { var e = els[i]; if (e.offsetParent !== null && FINAL.test(e.textContent || '')) now = true; }

  setTimeout(check, 600);
})();
