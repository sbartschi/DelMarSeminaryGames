<style>:root{--bg-page:#0E1B2B;--bg-panel:#16273B;--bg-panel-raised:#1E3450;--ink:#F1F6FB;--muted:#9FB4C9;--line:rgba(241,246,251,0.14);--accent:#E0925A;--ok:#3FA66B;--bad:#C65B5B;color-scheme:dark;}

.ctx{margin-top:14px;padding:14px 16px;border-left:4px solid var(--accent);background:rgba(227,176,75,0.10);border-radius:10px;text-align:left;}.ctx .ctx-h{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}.ctx b{display:block;font-size:1.05rem;margin-bottom:6px;color:var(--ink);}.ctx p{margin:0;line-height:1.55;color:var(--ink);font-size:0.98rem;}.wrap{max-width:1400px;padding-left:28px;padding-right:28px}.lobby{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:22px;align-items:start}.lobby .qr-box{width:max-content;max-width:100%;margin:6px auto}.lobby .qr-box svg,.lobby .qr-box canvas,.lobby .qr-box img{width:240px!important;height:240px!important;display:block}@media (max-width:860px){.lobby{grid-template-columns:1fr}}</style></head><body><div class="wrap" id="app"></div>
<script>var CFG={"title": "Old Testament Pop Quiz 2", "kind": "mc", "seconds": 25, "questions": [{"options": ["The Chaldeans", "Job's three friends", "Satan", "The king of Babylon"], "answer": 2, "ref": "Job 1:12", "expl": "The Lord gave Satan power over all Job had, but not over Job himself", "text": "Who did the Lord allow to try Job, as long as he did not touch Job himself at first?", "round": "Stories from the later Old Testament", "story": "Job’s trial begins (Job 1 to 2)", "ctx": "Job was a perfect and upright man with great wealth and ten children. Satan claimed Job was faithful only because he was blessed, so the Lord allowed Job to be tried. In one day he lost his animals, servants, and children, and later his health. Job worshipped and said, “The LORD gave, and the LORD hath taken away,” and he did not curse God."}, {"options": ["To ask for a larger palace", "To free Mordecai from prison", "To ask to return to Jerusalem", "To save the Jews from Haman's plot"], "answer": 3, "ref": "Esther 4:8, 16", "expl": "She fasted three days with her people, then went in saying \"if I perish, I perish\"", "text": "Why did Esther go to the king without being called, knowing she could die?", "round": "Stories from the later Old Testament", "story": "Esther saves her people (Esther 4 to 8)", "ctx": "Haman got a decree to destroy every Jew in Persia. Mordecai urged Esther to plead with the king, reminding her she may have become queen “for such a time as this.” Anyone who went to the king uninvited could be put to death, so Esther and her people fasted three days. She went in, the king held out his golden sceptre, and her people were saved."}, {"options": ["A scroll of the law", "A weapon", "A trumpet", "A torch"], "answer": 1, "ref": "Nehemiah 4:17", "expl": "They worked with one hand and held a weapon with the other, because enemies threatened to attack", "text": "While rebuilding the wall of Jerusalem, what did Nehemiah's workers hold in their other hand?", "round": "Stories from the later Old Testament", "story": "Rebuilding the wall (Nehemiah 4 to 6)", "ctx": "As Nehemiah’s workers rebuilt Jerusalem’s walls, enemies mocked them and plotted to attack. Nehemiah set guards and had the builders carry weapons as they worked. When his enemies tried four times to lure him away to harm him, he answered, “I am doing a great work, so that I cannot come down.” The wall was finished in 52 days."}, {"options": ["Forty", "Ten", "Fifteen", "Five"], "answer": 2, "ref": "Isaiah 38:5", "expl": "Through Isaiah the Lord said, \"I have heard thy prayer, I have seen thy tears\"", "text": "When King Hezekiah was sick unto death and prayed with tears, how many years did the Lord add to his life?", "round": "Stories from the later Old Testament", "story": "Hezekiah’s prayer for healing (Isaiah 38; 2 Kings 20)", "ctx": "Righteous King Hezekiah became deathly ill, and Isaiah told him to set his house in order. Hezekiah turned his face to the wall and prayed with tears. Before Isaiah had even left the palace, the Lord sent him back to promise fifteen more years, with the sun’s shadow going backward as a sign."}, {"options": ["Solomon's crown", "The book of the law", "The ark of the covenant", "A hidden treasure of gold"], "answer": 1, "ref": "2 Kings 22:8", "expl": "Finding the law led Josiah to lead the people in renewing their covenant with the Lord", "text": "What did Hilkiah the high priest find in the temple during the reign of young King Josiah?", "round": "Stories from the later Old Testament", "story": "Josiah and the book of the law (2 Kings 22 to 23)", "ctx": "Josiah became king of Judah at age eight. While the temple was being repaired, the high priest Hilkiah found the book of the law, which had been lost or neglected. When it was read to Josiah, he tore his clothes in sorrow, then gathered the people to renew their covenant and removed idols from the land."}, {"options": ["Fire from heaven", "A mighty army", "A stone cut out without hands", "A flood of water"], "answer": 2, "ref": "Daniel 2:34-35, 44", "expl": "The stone grew into a mountain that filled the earth, a symbol of God's kingdom that will never be destroyed", "text": "In Nebuchadnezzar's dream, what destroyed the great image of gold, silver, brass, iron, and clay?", "round": "Stories from the later Old Testament", "story": "Nebuchadnezzar’s dream (Daniel 2)", "ctx": "King Nebuchadnezzar demanded that his wise men tell him both his dream and its meaning, or die. Daniel and his friends prayed, and God revealed it. The great image stood for kingdoms that would rise and fall, and the stone cut out without hands stood for God’s kingdom in the last days, which would fill the whole earth."}, {"options": ["A lion walking through the hall", "A burning bush", "The prophet Jeremiah", "Fingers of a man's hand writing on the wall"], "answer": 3, "ref": "Daniel 5:5, 25", "expl": "Only Daniel could read the writing, and that night Babylon fell", "text": "What appeared during King Belshazzar's great feast in Babylon?", "round": "Stories from the later Old Testament", "story": "The writing on the wall (Daniel 5)", "ctx": "King Belshazzar of Babylon held a great feast and drank from the sacred vessels taken from the temple in Jerusalem. Fingers of a man’s hand appeared and wrote on the wall, and only Daniel could read it: the kingdom had been weighed and found wanting. That very night Belshazzar was slain."}, {"options": ["Wine for a great feast", "Water that became a river and healed the sea", "Fire that burned the wicked", "Oil that filled the city"], "answer": 1, "ref": "Ezekiel 47:1, 8-9", "expl": "Wherever the river went, things could live, a picture of the healing power of the temple", "text": "In Ezekiel's vision of the temple, what flowed out from under its threshold?", "round": "Stories from the later Old Testament", "story": "Ezekiel’s vision of the temple (Ezekiel 40 to 48)", "ctx": "Ezekiel, a prophet in exile in Babylon, was shown a vision of a future temple in Jerusalem. Water flowed from under it, growing deeper until it became a river that healed the Dead Sea, with trees along its banks bearing fruit for food and leaves for medicine."}, {"options": ["Daniel", "Nehemiah", "Mordecai", "Ezra"], "answer": 2, "ref": "Esther 3:2", "expl": "Mordecai would not bow or show Haman reverence, which made Haman furious", "text": "Who refused to bow down to Haman?", "round": "Who did it?", "story": "Mordecai refuses to bow (Esther 3)", "ctx": "King Ahasuerus promoted Haman above all his princes and commanded everyone to bow to him. Mordecai, a Jew, would not. Haman was so angry that he decided to destroy not just Mordecai but every Jew in the kingdom, setting up the crisis Esther would face."}, {"options": ["Nehemiah", "Hezekiah", "Jeremiah", "Ezra"], "answer": 3, "ref": "Ezra 7:10", "expl": "Ezra was a priest and scribe who helped the returning Jews learn and live the law", "text": "Who \"prepared his heart to seek the law of the Lord, and to do it, and to teach\" it in Israel?", "round": "Who did it?", "story": "Ezra teaches the law (Ezra 7; Nehemiah 8)", "ctx": "Ezra was a priest and scribe who led a group of Jews from Babylon back to Jerusalem with the support of King Artaxerxes. He devoted himself to studying, living, and teaching the law, and later read it aloud to all the people from morning until midday as they stood and listened."}, {"options": ["Jonah", "Jeremiah", "Daniel", "Isaiah"], "answer": 1, "ref": "Jeremiah 38:6", "expl": "Leaders angry at his warnings put him there, and a servant named Ebed-melech helped rescue him", "text": "Who was let down by cords into a dungeon and sank in the mire?", "round": "Who did it?", "story": "Jeremiah in the dungeon (Jeremiah 38)", "ctx": "During the Babylonian siege, Jeremiah warned that Jerusalem would fall and urged surrender. Angry princes lowered him into a muddy dungeon to die. Ebed-melech, an Ethiopian servant in the king’s house, got permission to rescue him with cords and old rags."}, {"options": ["Jeremiah", "Ezekiel", "Malachi", "Isaiah"], "answer": 3, "ref": "Isaiah 6:6-8", "expl": "His sin was purged, and he answered the Lord, \"Here am I; send me\"", "text": "Whose lips were touched by a seraph with a live coal from the altar?", "round": "Who did it?", "story": "Isaiah’s call to be a prophet (Isaiah 6)", "ctx": "In the year King Uzziah died, Isaiah saw the Lord on His throne surrounded by seraphim. Feeling unworthy, he cried that he was “a man of unclean lips,” but a seraph touched his lips with a live coal from the altar and his sin was purged. When the Lord asked, “Whom shall I send?” Isaiah answered, “Here am I; send me.”"}, {"options": ["Daniel", "Ezra", "Nehemiah", "Mordecai"], "answer": 2, "ref": "Nehemiah 1:11; 2:1", "expl": "He served King Artaxerxes and prayed before asking the king for permission to go", "text": "Who was the king's cupbearer in Persia before going to rebuild the walls of Jerusalem?", "round": "Who did it?", "story": "Nehemiah asks the king (Nehemiah 1 to 2)", "ctx": "Nehemiah was cupbearer to King Artaxerxes of Persia. When he heard that Jerusalem’s walls were broken down and its gates burned, he wept, fasted, and prayed for days. The king noticed his sad face, and after a quick silent prayer, Nehemiah asked to go rebuild the city. The king agreed and sent letters to help him."}, {"options": ["Daniel and his two sons", "Isaiah, Jeremiah, and Ezekiel", "Shadrach, Meshach, and Abed-nego", "Ezra, Nehemiah, and Haggai"], "answer": 2, "ref": "Daniel 3:25", "expl": "They would not worship the golden image, and the Lord delivered them", "text": "Who walked in a fiery furnace unharmed with a fourth person \"like the Son of God\"?", "round": "Who did it?", "story": "The fiery furnace (Daniel 3)", "ctx": "King Nebuchadnezzar set up a golden image and commanded everyone to bow to it or be thrown into a burning fiery furnace, heated seven times hotter than usual. Shadrach, Meshach, and Abed-nego refused, saying God could deliver them, “but if not,” they still would not bow. The king saw a fourth person in the fire, and they came out without even the smell of fire on them."}, {"options": ["Jonah", "Habakkuk", "Elijah", "Job"], "answer": 3, "ref": "Job 38:1, 4", "expl": "The Lord answered Job and helped him see His wisdom and power", "text": "Who heard the Lord ask out of a whirlwind, \"Where wast thou when I laid the foundations of the earth?\"", "round": "Who did it?", "story": "The Lord answers Job (Job 38 to 42)", "ctx": "After many chapters of asking why he was suffering, Job heard the Lord speak out of a whirlwind. The Lord asked him a series of questions about the Creation to show how far His wisdom is above man’s. Job humbled himself, prayed for his friends, and the Lord gave him twice as much as he had before."}, {"text": "What did the Lord prepare to swallow Jonah?", "options": ["A crocodile", "A giant whale shark", "A great fish", "A sea serpent"], "answer": 2, "ref": "Jonah 1:17", "expl": "He was in its belly three days and three nights", "round": "Stories from the later Old Testament", "story": "Jonah and Nineveh (Jonah 1 to 4)", "ctx": "The Lord sent Jonah to warn Nineveh, an enemy city, but he fled by ship toward Tarshish. In a storm he was thrown overboard and swallowed by a great fish, where he prayed for three days and three nights. When he finally preached, the whole city repented and was spared. Jonah was angry, admitting he had run because he knew the Lord would be merciful."}, {"text": "How many times a day did Daniel pray, even after the king’s decree?", "options": ["Seven times", "Three times", "Twice", "Once"], "answer": 1, "ref": "Daniel 6:10", "expl": "He prayed with his windows open toward Jerusalem", "round": "Stories from the later Old Testament", "story": "Daniel in the lions’ den (Daniel 6)", "ctx": "Jealous officials tricked King Darius into making a law that no one could pray to anyone but the king for thirty days. Daniel kept praying three times a day with his windows open toward Jerusalem. He was thrown to the lions, but God sent His angel to shut their mouths, and Daniel was unharmed."}, {"text": "What did Daniel and his friends ask to eat instead of the king’s meat?", "options": ["Pulse and water", "Fish and figs", "Nothing; they fasted", "Bread and honey"], "answer": 0, "ref": "Daniel 1:12", "expl": "After ten days they looked healthier than the others", "round": "Stories from the later Old Testament", "story": "Daniel’s food test (Daniel 1)", "ctx": "Daniel and three friends were young Jewish captives chosen for training in the Babylonian king’s court. Rather than defile themselves with the king’s food and wine, they asked to eat pulse (vegetables) and drink water for ten days. At the end they were healthier than the others, and God gave them knowledge and wisdom."}, {"text": "Who interpreted the writing on the wall for King Belshazzar?", "options": ["Mordecai", "Daniel", "Ezra", "Jeremiah"], "answer": 1, "ref": "Daniel 5:17, 25-28", "expl": "Daniel refused the king’s gifts and read the message", "round": "Who did it?", "story": "The writing on the wall (Daniel 5)", "ctx": "King Belshazzar of Babylon held a great feast and drank from the sacred vessels taken from the temple in Jerusalem. Fingers of a man’s hand appeared and wrote on the wall, and only Daniel could read it: the kingdom had been weighed and found wanting. That very night Belshazzar was slain."}, {"text": "How long did it take to rebuild Jerusalem’s wall under Nehemiah?", "options": ["Three years", "Seven days", "Fifty-two days", "Forty days"], "answer": 2, "ref": "Nehemiah 6:15", "expl": "Even the enemies saw the work was wrought of God", "round": "Stories from the later Old Testament", "story": "Rebuilding the wall (Nehemiah 4 to 6)", "ctx": "As Nehemiah’s workers rebuilt Jerusalem’s walls, enemies mocked them and plotted to attack. Nehemiah set guards and had the builders carry weapons as they worked. When his enemies tried four times to lure him away to harm him, he answered, “I am doing a great work, so that I cannot come down.” The wall was finished in 52 days."}, {"text": "Which Persian king made Esther his queen?", "options": ["Darius", "Nebuchadnezzar", "Cyrus", "Ahasuerus"], "answer": 3, "ref": "Esther 2:17", "expl": "He set the royal crown on her head", "round": "Who did it?", "story": "Esther becomes queen (Esther 2)", "ctx": "After Queen Vashti refused the king’s command, King Ahasuerus searched the kingdom for a new queen. Esther, a Jewish orphan raised by her cousin Mordecai, was chosen and crowned. On Mordecai’s advice, she did not reveal at first that she was Jewish."}, {"text": "What did Haman build to hang Mordecai on?", "options": ["Gallows", "A furnace", "A tower", "A cross"], "answer": 0, "ref": "Esther 5:14; 7:10", "expl": "Haman was hanged on the gallows he built", "round": "Stories from the later Old Testament", "story": "The story of Esther", "ctx": "Esther, a Jewish orphan, became queen of Persia. When Mordecai refused to bow to Haman, Haman got a decree to destroy all Jews. Esther fasted three days and risked her life to go to the king. Haman’s plot was exposed, and he was hanged on the gallows he had built for Mordecai."}, {"text": "What did Jeremiah watch at the potter’s house?", "options": ["A marred vessel being made again", "A vessel being smashed", "The potter selling jars", "A kiln catching fire"], "answer": 0, "ref": "Jeremiah 18:3-4", "expl": "Israel was like clay in the Lord’s hands", "round": "Stories from the later Old Testament", "story": "The potter and the clay (Jeremiah 18)", "ctx": "The Lord sent Jeremiah to a potter’s house, where he watched a clay vessel get marred and reshaped into something new. The Lord taught that Israel was like clay in His hands: if they repented, He could reshape them. God can remake our lives when we let Him."}, {"text": "Which prophet saw a valley of dry bones come to life?", "options": ["Ezekiel", "Daniel", "Isaiah", "Joel"], "answer": 0, "ref": "Ezekiel 37:1-10", "expl": "The bones received sinews, flesh, and breath", "round": "Who did it?", "story": "The valley of dry bones (Ezekiel 37)", "ctx": "In vision, the Lord set Ezekiel in a valley full of very dry bones and asked, “Can these bones live?” As Ezekiel prophesied, the bones came together, received flesh, and were filled with breath. The Lord explained it represented the house of Israel being gathered and given new life, and it also points to the Resurrection."}, {"text": "What did the Lord call Ezekiel, someone who warns the people of danger?", "options": ["A soldier", "A watchman", "A gatekeeper", "A shepherd"], "answer": 1, "ref": "Ezekiel 3:17", "expl": "Modern prophets are watchmen too", "round": "Stories from the later Old Testament", "story": "Ezekiel the watchman (Ezekiel 3)", "ctx": "Ezekiel was called as a prophet to the Jews in exile in Babylon. The Lord compared him to a watchman on a city wall whose job is to warn of approaching danger. If he warned the people and they ignored him, he was free of blame; if he stayed silent, he would be accountable. Modern prophets serve as watchmen in the same way."}, {"text": "According to Malachi, what will the Lord open for those who pay tithing?", "options": ["The springs of the earth", "The storehouses of Egypt", "The windows of heaven", "The gates of the temple"], "answer": 2, "ref": "Malachi 3:10", "expl": "He promised blessings there would not be room enough to receive", "round": "Stories from the later Old Testament", "story": "Malachi on tithing (Malachi 3)", "ctx": "Malachi was the last prophet of the Old Testament. The Lord asked, “Will a man rob God?” and explained the people robbed Him in tithes and offerings. He promised that if they brought their tithes into the storehouse, He would open the windows of heaven. The Savior later taught these same words to the Nephites (3 Nephi 24)."}, {"text": "Whom did Malachi say the Lord would send before the great and dre     '#tmRoot .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:#A3B2CE;margin-bottom:8px}',
    '#tmRoot .clock{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:1.6rem;font-weight:700;color:#F4B740}#tmRoot .clock.out{color:#F0545C}',
    '#tmRoot .eyebrow{color:#1FB5A8;font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}',
    '#tmRoot .q{font-size:1.7rem;line-height:1.35;margin:8px 0 16px}#tmRoot .verse{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.7rem;line-height:1.4;margin:8px 0 16px}',
    '#tmRoot .emoji{font-size:4rem;letter-spacing:.12em;margin:8px 0 16px}',
    '#tmRoot .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}',
    '#tmRoot .opt{display:flex;gap:12px;align-items:center;background:#1B2846;border:2px solid rgba(160,185,230,.18);border-radius:14px;padding:14px 16px;font-size:1.2rem;font-weight:600}',
    '#tmRoot .opt i{font-style:normal;font-weight:800;color:#F4B740;min-width:1.4em}#tmRoot .opt.ok{border-color:#3FA66B;background:rgba(63,166,107,.18)}#tmRoot .opt.dim{opacity:.45}',
    '#tmRoot .who{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}#tmRoot .who .b{border-left:6px solid var(--c)}#tmRoot .who .b.got{background:#3FA66B;border-color:#3FA66B;color:#fff}',
    '#tmRoot .ans{border-left:4px solid #F4B740;padding:10px 14px;background:rgba(244,183,64,.08);border-radius:10px;margin:14px 0}',
    '#tmRoot .ctx{border-left:4px solid #1FB5A8;padding:12px 14px;background:rgba(31,181,168,.10);border-radius:10px;margin:12px 0}#tmRoot .ctx b{display:block;margin-bottom:4px}#tmRoot .ctx p{margin:0}',
    '#tmRoot .order li{margin:4px 0}#tmRoot .when{margin-left:8px;color:#F4B740;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.85rem}',
    '#tmRoot .eras{width:100%;height:auto;margin-top:8px}#tmRoot .stand{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(160,185,230,.16);font-size:1.2rem}',
    '#tmRoot .keys{color:#A3B2CE;font-size:.85rem;margin-top:10px}'
  ].join('\n');
  document.head.appendChild(css);

  var root = document.createElement('div'); root.id = 'tmRoot'; root.setAttribute('aria-live', 'polite'); document.body.appendChild(root);
  var tg = document.createElement('div'); tg.id = 'tmToggle'; tg.setAttribute('role', 'group'); tg.setAttribute('aria-label', 'How students play');
  tg.innerHTML = '<button type="button" data-m="phones" aria-pressed="true">📱 Phones</button><button type="button" data-m="teams" aria-pressed="false">👥 Teams, no phones</button>';
  document.body.appendChild(tg);
  tg.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) mode(b.getAttribute('data-m')); });
  function mode(m) {
    [].forEach.call(tg.querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-m') === m)); });
    document.body.classList.toggle('tm-on', m === 'teams'); stopClock();
    if (m === 'teams' && !S.started) setup(); window.scrollTo(0, 0);
  }

  function setup() {
    var n = parseInt(store('tm_n') || '3', 10), qn = store('tm_q') || '10', secs = store('tm_s') || String(CFG.seconds || 30);
    var names = []; try { names = JSON.parse(store('tm_names') || '[]'); } catch (e) {}
    var counts = [5, 10, 15].filter(function (x) { return x < Q.length; }).concat(['all']);
    root.innerHTML = '<div class="w"><h1>' + esc(CFG.title) + '</h1><p class="sub">Team mode: no phones needed. Teams answer out loud or on paper, you mark who got it right, then reveal the answer and the story behind it.</p>' +
      '<div class="card"><h2>Teams</h2><div class="row" id="tmN">' + [2, 3, 4, 5, 6].map(function (k) { return '<button class="b' + (k === n ? ' on' : '') + '" data-n="' + k + '">' + k + ' teams</button>'; }).join('') + '</div>' +
      '<div class="row" id="tmNames" style="margin-top:12px"></div></div>' +
      '<div class="card"><h2>Game</h2><label>Questions (drawn at random from ' + Q.length + ')</label><div class="row" id="tmQ">' + counts.map(function (c) { return '<button class="b' + (String(c) === qn ? ' on' : '') + '" data-q="' + c + '">' + (c === 'all' ? 'All ' + Q.length : c) + '</button>'; }).join('') + '</div>' +
      '<label>Timer per question</label><div class="row" id="tmS">' + ['0', '20', '30', '45', '60'].map(function (c) { return '<button class="b' + (c === secs ? ' on' : '') + '" data-s="' + c + '">' + (c === '0' ? 'Off' : c + ' sec') + '</button>'; }).join('') + '</div></div>' +
      '<button class="b go big" id="tmStart">Start team game</button></div>';
    function names_() { var box = root.querySelector('#tmNames'), old = [].map.call(box.querySelectorAll('input'), function (i) { return i.value; });
      box.innerHTML = ''; for (var i = 0; i < n; i++) { var v = old[i] || names[i] || ('Team ' + (i + 1)); box.insertAdjacentHTML('beforeend', '<input type="text" maxlength="24" aria-label="Name for team ' + (i + 1) + '" style="border-left:6px solid ' + COLORS[i] + '" value="' + esc(v) + '">'); } }
    names_();
    root.querySelector('#tmN').onclick = function (e) { var b = e.target.closest('[data-n]'); if (!b) return; n = +b.getAttribute('data-n'); [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); }); names_(); };
    root.querySelector('#tmQ').onclick = function (e) { var b = e.target.closest('[data-q]'); if (!b) return; qn = b.getAttribute('data-q'); [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); }); };
    root.querySelector('#tmS').onclick = function (e) { var b = e.target.closest('[data-s]'); if (!b) return; secs = b.getAttribute('data-s'); [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); }); };
    root.querySelector('#tmStart').onclick = function () {
      S.teams = [].map.call(root.querySelectorAll('#tmNames input'), function (x, i) { return x.value.trim() || ('Team ' + (i + 1)); });
      store('tm_n', String(n)); store('tm_q', qn); store('tm_s', secs); store('tm_names', JSON.stringify(S.teams));
      S.scores = S.teams.map(function () { return 0; }); S.ids = draw(qn === 'all' ? 'all' : parseInt(qn, 10)); S.i = 0; S.secs = parseInt(secs, 10); S.started = true; question();
    };
  }
  function scoreBar() { return '<div class="score">' + S.teams.map(function (t, i) { return '<div class="chip" style="--c:' + COLORS[i] + '"><div class="n">' + esc(t) + '</div><div class="s">' + S.scores[i] + '</div></div>'; }).join('') + '</div>'; }
  function question() {
    S.got = {}; S.revealed = false; S.left = S.secs; S.paused = false; render();
    stopClock(); if (S.secs > 0) S.timer = setInterval(function () { if (S.paused || S.revealed) return; S.left--; paintClock(); if (S.left <= 0) stopClock(); }, 1000);
  }
  function stopClock() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
  function paintClock() { var c = root.querySelector('.clock'); if (!c) return; c.textContent = S.left > 0 ? (S.paused ? 'Paused ' : '') + S.left + 's' : 'Time!'; c.classList.toggle('out', S.left <= 0); }
  function render() {
    var q = Q[S.ids[S.i]], o = opts(q), r = right(q), rv = S.revealed, h = '<div class="w">' + scoreBar();
    h += '<div class="meta"><span>Question ' + (S.i + 1) + ' of ' + S.ids.length + '</span>' + (S.secs > 0 ? '<span class="row"><span class="clock"></span><button class="b" id="tmPause">' + (S.paused ? 'Resume' : 'Pause') + '</button><button class="b" id="tmMore">+10 sec</button></span>' : '') + '</div>';
    h += '<div class="card"><div class="eyebrow">' + esc(q.round || q.prompt || (KIND === 'tf' ? 'True or false' : KIND === 'order' ? 'Put these in order' : (KIND === 'match' ? 'Who said or wrote this?' : 'Question'))) + '</div>';
    if (q.emoji) h += '<div class="emoji">' + esc(q.emoji) + '</div>';
    if (q.verse) h += '<div class="verse">“' + esc(q.verse) + '”</div>';
    if (q.text) h += '<div class="' + (KIND === 'match' ? 'verse' : 'q') + '">' + (KIND === 'match' ? '“' + esc(q.text) + '”' : esc(q.text)) + '</div>';
    h += '<div class="opts">' + o.map(function (t, k) { var cls = 'opt' + (rv && KIND !== 'order' ? (k === r ? ' ok' : ' dim') : ''); return '<div class="' + cls + '"><i>' + 'ABCDEF'[k] + '</i>' + esc(t) + '</div>'; }).join('') + '</div>';
    if (rv) {
      var label = KIND === 'order' ? '' : '<b>Answer: ' + esc(o[r]) + '</b>';
      h += '<div class="ans">' + label + (q.ref ? (label ? ' &nbsp;' : '') + '<span style="color:#A3B2CE">' + esc(q.ref) + '</span>' : '') + (q.expl ? '<div style="margin-top:4px">' + esc(q.expl) + '</div>' : '') + '</div>';
      if (KIND === 'order') h += '<ol class="order">' + q.items.map(function (it, k) { return '<li>' + esc(it) + (q.dates ? '<span class="when">' + esc(q.dates[k]) + '</span>' : '') + '</li>'; }).join('') + '</ol>' + (typeof eraSvg === 'function' && q.years ? eraSvg(q, false) : '');
      if (q.story || q.ctx) h += '<div class="ctx"><b>' + esc(q.story || '') + '</b><p>' + esc(q.ctx || '') + '</p></div>';
    }
    h += '<h2 style="margin-top:16px">Who got it right? <span class="sub" style="font-weight:400;font-size:.9rem">tap to give a point, tap again to take it back</span></h2><div class="who">' +
      S.teams.map(function (t, i) { return '<button class="b' + (S.got[i] ? ' got' : '') + '" style="--c:' + COLORS[i] + '" data-t="' + i + '">' + (S.got[i] ? '✓ ' : '') + esc(t) + '</button>'; }).join('') + '</div>';
    h += '<div class="row" style="margin-top:14px">' + (rv ? '' : '<button class="b go big" id="tmReveal">Reveal answer</button>') + '<button class="b' + (rv ? ' go' : '') + ' big" id="tmNext">' + (S.i + 1 >= S.ids.length ? 'Final standings' : 'Next question') + '</button></div>';
    h += '<p class="keys">Keyboard: Space pauses the timer, R reveals, N goes to the next question.</p></div></div>';
    root.innerHTML = h; paintClock(); bind();
  }
  function bind() {
    var x;
    if ((x = root.querySelector('#tmPause'))) x.onclick = togglePause;
    if ((x = root.querySelector('#tmMore'))) x.onclick = function () { S.left = Math.max(S.left, 0) + 10; if (!S.timer && S.secs > 0) S.timer = setInterval(function () { if (S.paused || S.revealed) return; S.left--; paintClock(); if (S.left <= 0) stopClock(); }, 1000); paintClock(); };
    if ((x = root.querySelector('#tmReveal'))) x.onclick = reveal;
    root.querySelector('#tmNext').onclick = next;
    root.querySelector('.who').onclick = function (e) { var b = e.target.closest('[data-t]'); if (!b) return; var t = +b.getAttribute('data-t');
      S.got[t] = !S.got[t]; S.scores[t] += S.got[t] ? 1 : -1; var keep = S.paused; render(); S.paused = keep; };
  }
  function togglePause() { S.paused = !S.paused; var b = root.querySelector('#tmPause'); if (b) b.textContent = S.paused ? 'Resume' : 'Pause'; paintClock(); }
  function reveal() { if (S.revealed) return; S.revealed = true; stopClock(); render(); }
  function next() { stopClock(); if (S.i + 1 >= S.ids.length) return final(); S.i++; question(); }
  function final() {
    var order = S.teams.map(function (t, i) { return i; }).sort(function (a, b) { return S.scores[b] - S.scores[a]; });
    root.innerHTML = '<div class="w"><h1>Final standings</h1><div class="card">' + order.map(function (i, k) { return '<div class="stand"><span>' + (k + 1) + '. ' + esc(S.teams[i]) + '</span><b>' + S.scores[i] + '</b></div>'; }).join('') + '</div>' +
      '<div class="row"><button class="b go big" id="tmAgain">Play again</button><button class="b big" id="tmSetup">Change teams</button></div></div>';
    root.querySelector('#tmAgain').onclick = function () { S.scores = S.teams.map(function () { return 0; }); S.ids = draw(S.ids.length); S.i = 0; question(); };
    root.querySelector('#tmSetup').onclick = function () { S.started = false; setup(); };
  }
  document.addEventListener('keydown', function (e) {
    if (!document.body.classList.contains('tm-on') || !S.started || /input|textarea/i.test((e.target && e.target.tagName) || '') || !root.querySelector('#tmNext')) return;
    if (e.key === ' ') { e.preventDefault(); if (S.secs > 0 && !S.revealed) togglePause(); }
    else if (e.key === 'r' || e.key === 'R') reveal(); else if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') next();
  });
  if (/[?&]mode=teams/.test(location.search)) mode('teams');
})();

</script>
</body></html>
